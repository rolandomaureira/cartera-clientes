<!-- Tailwind (utilidades de layout en Inicio, Dashboard, Facturación, Trabajos
     Especiales, Requerimientos y Reporte Semanal) y html2pdf.js (solo para el
     botón "Descargar PDF" del Resumen Ejecutivo F-29) ya no se cargan acá como
     <script> bloqueantes — retrasaban el parseo del HTML antes de que
     arrancara siquiera la carga de datos. Tailwind se inyecta en paralelo con
     esa carga (ver init(), al final del archivo); html2pdf se carga bajo
     demanda la primera vez que se pide un PDF (ver asegurarHtml2pdf()). -->
<style>
  :root{
    /* Identidad BPO Gestión: azul marino de marca (tomado del isotipo bpo
       consultores) + dorado como acento premium. --teal/--teal-dark se
       mantienen como nombres de variable (para no reescribir cada uso en
       toda la app) pero ahora llevan los tonos de marca, no verde. */
    --ink:#12172A;
    --paper:#FFFFFF;
    --paper-2:#F1F2F5;
    --teal:#1E3A8F;
    --teal-dark:#0A1A73;
    --navy-deep:#081436;
    --gold:#B8892B;
    --line:#DDE1E6;
    --danger:#A3402F;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---------- Top bar ---------- */
  /* Barra superior en azul marino de marca (antes color papel): así el
     acento principal de BPO Gestión queda presente en todas las pantallas,
     no solo en el login. */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 16px;
    padding:18px 32px;
    border-bottom:2px solid var(--navy-deep);
    background:var(--teal-dark);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{
    width:42px;height:42px;border-radius:9px;
    object-fit:contain;background:#fff;
    border:1px solid rgba(255,255,255,0.3);
    padding:3px;flex-shrink:0;
  }
  .brand h1{
    font-size:22px;margin:0;font-weight:600;letter-spacing:0.2px;color:#fff;
  }
  .brand .sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px;letter-spacing:0.5px;text-transform:uppercase;}
  .whoami{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap;}
  .role-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:4px 10px;
    border-radius:3px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .role-badge.admin{background:var(--gold);color:var(--ink);}
  .role-badge.encargado{background:var(--teal);color:var(--white);}
  /* En la barra superior (ahora azul marino) el mismo azul se perdía contra
     el fondo; ahí se muestra en blanco sólido. En tablas sobre fondo claro
     (F-29 "Caso especial", rol en Configuración) sigue en azul de marca. */
  #topbar .role-badge.encargado{background:#fff;color:var(--teal-dark);}
  .uf-badge{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);
    padding:5px 10px;border-radius:3px;
  }
  .uf-badge .uf-date{color:rgba(255,255,255,0.55);}
  .uf-badge.uf-error{color:rgba(255,255,255,0.55);font-style:italic;}
  .switch-btn{
    background:none;border:1px solid rgba(255,255,255,0.5);color:#fff;
    padding:6px 12px;border-radius:3px;font-size:13px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .switch-btn:hover{background:#fff;color:var(--teal-dark);}

  /* ---------- Notificaciones (campana estilo Facebook) ---------- */
  .notif-wrap{position:relative;}
  .notif-bell{
    background:none;border:none;cursor:pointer;position:relative;
    padding:6px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .notif-bell:hover{background:rgba(255,255,255,0.12);}
  .notif-badge{
    position:absolute;top:0;right:0;
    background:var(--danger);color:var(--white);
    font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:700;
    min-width:16px;height:16px;line-height:16px;
    border-radius:9999px;text-align:center;padding:0 3px;
    border:2px solid var(--teal-dark);
  }
  .notif-panel{
    position:absolute;top:calc(100% + 10px);right:0;
    width:340px;max-height:420px;overflow-y:auto;
    background:var(--white);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 32px rgba(22,27,34,0.22);
    z-index:80;text-align:left;
  }
  .notif-panel-head{
    padding:14px 16px;border-bottom:1px solid var(--line);
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:15px;
  }
  .notif-item{
    display:flex;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--line);cursor:pointer;
    background:#E7ECFA;
  }
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:#DCE3F5;}
  .notif-avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:var(--teal);color:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:13px;
  }
  .notif-text{font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);line-height:1.4;}
  .notif-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a8879;margin-top:4px;}
  .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--teal-dark);flex-shrink:0;margin-top:5px;}
  .notif-empty{padding:30px 16px;text-align:center;color:#8a8879;font-family:'IBM Plex Sans',sans-serif;font-size:13px;}

  /* ---------- Color personal por cliente (solo Pablo Prieto y Sara Barriga) ---------- */
  .color-swatch-wrap{position:relative;}
  .color-swatch-btn{
    width:26px;height:26px;border-radius:6px;
    border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0;font-size:13px;background:var(--white);
  }
  .color-swatch-btn:hover{border-color:var(--teal-dark);}
  .color-popover{
    position:fixed;z-index:90;
    background:var(--white);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 12px 32px rgba(22,27,34,0.22);
    padding:12px;width:190px;text-align:left;
  }
  .color-popover .swatch-label{
    font-family:'IBM Plex Sans',sans-serif;font-size:11px;text-transform:uppercase;
    letter-spacing:0.4px;color:#8a8879;margin:8px 0 6px;
  }
  .color-popover .swatch-label:first-child{margin-top:0;}
  .swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .color-swatch-cell{
    width:26px;height:26px;border-radius:4px;
    border:1px solid rgba(22,27,34,0.15);cursor:pointer;padding:0;
  }
  .color-swatch-cell.selected{outline:2px solid var(--teal-dark);outline-offset:1px;}

  /* ---------- Gate screen ---------- */
  .gate{
    min-height:calc(100vh - 80px);
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
  }
  .gate-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:44px 40px;
    max-width:440px;width:100%;
    box-shadow:0 2px 0 var(--line);
  }
  .gate-card h2{
    font-size:28px;margin:0 0 6px;font-weight:600;
  }
  .gate-card p.lead{color:#6b6a5f;font-size:14px;margin:0 0 28px;}
  .gate-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .gate-option{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border:1px solid var(--line);border-radius:4px;
    background:var(--paper);cursor:pointer;text-align:left;
    font-family:'IBM Plex Sans',sans-serif;font-size:15px;color:var(--ink);
  }
  .gate-option:hover{border-color:var(--teal);background:#E4EFEC;}
  .gate-option .tag{font-size:11px;color:#6b6a5f;font-family:'IBM Plex Mono',monospace;}
  .gate-admin{border-left:4px solid var(--gold);}
  .gate-enc{border-left:4px solid var(--teal);}
  .gate-divider{
    display:flex;align-items:center;gap:10px;margin:18px 0;
    color:#9a9689;font-size:12px;text-transform:uppercase;letter-spacing:1px;
  }
  .gate-divider::before,.gate-divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .add-enc-row{display:flex;gap:8px;}
  .add-enc-row input{flex:1;}

  /* ---------- Layout ---------- */
  /* Navegación de secciones en dos niveles, mismo patrón que la home de
     banca en línea de Banco de Chile: una fila de pestañas tipo píldora
     arriba (cada una, un grupo de secciones) y, debajo, un panel con las
     secciones de la pestaña activa repartidas en columnas — con la
     tipografía y paleta propias de la app en vez de las de ese banco. */
  .layout{display:flex;flex-direction:column;min-height:calc(100vh - 80px);}
  .folders{
    border-bottom:2px solid var(--ink);
    background:var(--white);
    padding:22px 40px 28px;
  }
  .nav-pills{
    display:inline-flex;flex-wrap:wrap;gap:4px;
    background:var(--paper-2);border-radius:12px;padding:5px;
    margin-bottom:24px;
  }
  .nav-pill{
    display:flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:8px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
    color:#6b6a5f;border:none;background:none;white-space:nowrap;
  }
  .nav-pill svg{flex-shrink:0;opacity:0.7;}
  .nav-pill:hover{color:var(--ink);}
  .nav-pill.active{
    background:var(--white);color:var(--teal-dark);font-weight:600;
    box-shadow:0 1px 3px rgba(22,27,34,0.15);
  }
  .nav-pill.active svg{opacity:1;}
  .nav-panel-title{
    font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:16px;
  }
  .nav-columns{display:flex;flex-wrap:wrap;gap:10px 40px;}
  .nav-link{
    display:block;padding:6px 0;cursor:pointer;font-size:14px;color:var(--ink);
    line-height:1.4;white-space:nowrap;
  }
  .nav-link:hover{color:var(--teal-dark);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .nav-link.active{color:var(--teal-dark);font-weight:600;}

  /* Encargado filter bar (dentro del contenido) */
  .filter-bar{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;
  }
  .filter-chip{
    padding:7px 14px;border-radius:20px;border:1px solid var(--line);
    background:var(--white);font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;
  }
  .filter-chip:hover{border-color:var(--teal);}
  .filter-chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .filter-chip.active .count{color:var(--paper);}
  .filter-chip .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a8879;}
  /* Ancho máximo centrado para el contenido de todas las secciones (mismo
     criterio ya usado en F-29/Configuración): en monitores grandes evita que
     las tablas se estiren de borde a borde; en pantallas angostas no hace
     ninguna diferencia. */
  .main{flex:1;padding:32px 40px;max-width:1400px;margin:0 auto;width:100%;box-sizing:border-box;}
  .main-head{
    display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;
  }
  .main-head h2{font-size:26px;margin:0;font-weight:600;}
  .main-head .meta{font-size:13px;color:#6b6a5f;margin-top:4px;}

  .btn{
    background:var(--ink);color:var(--white);border:none;
    padding:9px 16px;border-radius:4px;font-size:13px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;font-weight:500;
  }
  .btn:hover{background:var(--teal-dark);}
  .btn.secondary{background:none;border:1px solid var(--ink);color:var(--ink);}
  .btn.secondary:hover{background:var(--ink);color:var(--white);}
  .btn.danger{background:none;color:var(--danger);border:1px solid var(--danger);}
  .btn.danger:hover{background:var(--danger);color:var(--white);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--teal-dark);}
  .btn.ghost:hover{background:var(--paper-2);border-color:var(--teal-dark);}

  table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,0.03), 0 1px 6px rgba(16,24,40,0.05);}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    color:#6b6a5f;padding:12px 16px;border-bottom:2px solid var(--ink);background:var(--paper-2);
  }
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-2);}
  select, input[type=text]{
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:7px 9px;
    border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--ink);
  }
  .empty-state{
    padding:60px 20px;text-align:center;color:#8a8879;background:var(--white);
    border:1px dashed var(--line);border-radius:6px;
  }
  .empty-state .display{font-size:20px;color:var(--ink);margin-bottom:6px;}
  .row-actions{display:flex;gap:6px;}
  .client-name{font-weight:500;}
  .client-notes{font-size:12px;color:#8a8879;margin-top:2px;}
  .form-inline{
    display:flex;gap:8px;padding:16px;background:var(--white);
    border:1px solid var(--line);border-radius:6px;margin-bottom:16px;flex-wrap:wrap;
  }
  .form-inline input{flex:1;min-width:140px;}
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--white);
    padding:12px 18px;border-radius:5px;font-size:13px;opacity:0;transform:translateY(8px);
    transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .manage-section{margin-top:34px;}
  .manage-section h3{font-size:15px;margin-bottom:10px;}

  /* Tabs */
  .tabbar{
    display:flex;gap:4px;margin-bottom:24px;border-bottom:2px solid var(--ink);
  }
  .tab-item{
    padding:10px 18px;font-size:14px;cursor:pointer;color:#6b6a5f;
    border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;
  }
  .tab-item:hover{color:var(--ink);}
  .tab-item.active{color:var(--ink);border-bottom-color:var(--teal);}

  /* F-29 status select */
  select.f29-select{
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;
    border-width:1px;padding:6px 10px;
  }
  select.f29-pending{background:#F7ECD9;border-color:#D9B36C;color:#7A5A19;}
  /* "Guardado" en violeta (antes usaba el mismo azul que "Enviado"; con el
     azul marino ahora como color de marca, ambos quedaban casi idénticos). */
  select.f29-guardado{background:#EDE9FE;border-color:#8B5CF6;color:#5B21B6;}
  select.f29-ok{background:#E7ECFA;border-color:var(--teal);color:var(--teal-dark);}

  /* Onboarding form */
  .onboard-card{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:28px;max-width:640px;
  }
  .onboard-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-bottom:22px;
  }
  .onboard-grid label{
    display:flex;flex-direction:column;gap:6px;font-size:12px;
    text-transform:uppercase;letter-spacing:0.5px;color:#6b6a5f;font-weight:500;
  }
  .onboard-grid input, .onboard-grid select{
    font-size:14px;text-transform:none;letter-spacing:normal;font-weight:400;
    color:var(--ink);padding:10px 12px;
  }
  @media (max-width:600px){
    .onboard-grid{grid-template-columns:1fr;}
  }

  /* Detalle de cliente (modal) */
  .client-clickable{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .client-clickable:hover{color:var(--teal-dark);text-decoration-color:var(--teal);}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(22,27,34,0.55);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-card{
    background:var(--white);border-radius:6px;padding:28px;max-width:640px;width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:0 8px 0 var(--ink);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-head h3{margin:0;font-size:22px;}

  /* Login BPO Gestión — identidad de marca: azul marino del isotipo bpo
     consultores + dorado como acento (mismo dorado que ya usa el resto de
     la app para Administrador/insignias premium). */
  .tg-login-bg{
    position:fixed;inset:0;z-index:50;
    background:
      radial-gradient(ellipse 900px 700px at 50% -10%, #1E3A8F 0%, transparent 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, #0A1442 55%, #060B22 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .tg-card{
    background:var(--white);border-radius:16px;padding:48px 40px;
    max-width:420px;width:100%;box-shadow:0 24px 60px rgba(6,11,34,0.45);
    border:1px solid rgba(255,255,255,0.06);
  }
  .tg-brand{display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:center;margin-bottom:24px;}
  .tg-logo{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line);padding:4px;flex-shrink:0;}
  .tg-title{font-size:20px;font-weight:700;color:var(--teal-dark);letter-spacing:0.3px;line-height:1.1;font-family:'Fraunces',serif;}
  .tg-subtitle{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:3px;margin-top:2px;text-transform:uppercase;}
  .tg-heading{
    text-align:center;font-size:13px;font-weight:700;letter-spacing:2px;
    color:#6b7280;margin-bottom:24px;text-transform:uppercase;
  }
  .tg-error{color:var(--danger);font-size:13px;min-height:18px;text-align:center;margin-bottom:6px;}
  .tg-input{
    display:block;box-sizing:border-box;
    width:100%;height:50px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);
    font-size:15px;color:var(--ink);margin-bottom:16px;font-family:'IBM Plex Sans',sans-serif;
    background:var(--paper);-webkit-appearance:none;appearance:none;
    transition:border-color .15s ease,background .15s ease;
  }
  .tg-input::placeholder{color:#9a9688;}
  .tg-input:focus{outline:none;border-color:var(--teal-dark);background:#fff;}
  /* El campo de clave, al ser type="password", trae por defecto el ícono de
     "guardar contraseña" de Chrome/Edge (llave) y el indicador de Bloq Mayús,
     que lo hacían ver más "pesado"/grande que el de usuario. Se ocultan para
     que ambos campos queden visualmente simétricos. */
  .tg-input::-webkit-credentials-auto-fill-button,
  .tg-input::-webkit-caps-lock-indicator{
    visibility:hidden;display:none !important;pointer-events:none;position:absolute;right:0;
  }
  .tg-input::-ms-reveal,
  .tg-input::-ms-clear{ display:none; }
  .tg-button{
    width:100%;padding:15px;border:none;border-radius:10px;
    background:var(--teal-dark);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
    letter-spacing:0.3px;transition:background .15s ease;
  }
  .tg-button:hover{background:var(--ink);}
  .encargado-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--white);
    border:1px solid var(--line);padding:6px 6px 6px 12px;border-radius:20px;
    font-size:13px;margin:0 8px 8px 0;
  }
  .encargado-chip button{
    background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;
    width:20px;height:20px;border-radius:50%;
  }
  .encargado-chip button:hover{background:#F3E4E0;}
  @media (max-width: 720px){
    .folders{padding:16px 18px 22px;}
    .nav-pills{display:flex;width:100%;overflow-x:auto;}
    .nav-columns{gap:16px 28px;}
    .main{padding:24px 18px;}
    .topbar{padding:14px 16px;}
    .whoami{gap:8px;font-size:13px;}
  }

  /* ---------- Impresión (usada por "Descargar PDF" del Reporte Semanal) ---------- */
  @media print{
    .topbar, .folders, .no-print, .toast{ display:none !important; }
    .layout{ display:block !important; }
    .main{ padding:0 !important; }
    body{ background:#fff !important; }
  }

  /* ===================================================================
     MEMOS Y PROPUESTAS — editor de documentos (memos, circulares y
     propuestas de servicio). Reutiliza las variables de marca ya
     definidas arriba (--ink/--teal-dark/--navy-deep/--gold/--line/
     --danger/--paper-2), no introduce paleta propia. Los nombres de
     clase (.stat, .tpl, .chip, .block, .paper, etc.) no existían antes
     en este archivo — se verificó que no chocan con nada.
     =================================================================== */
  svg.i{ width:20px; height:20px; display:block; flex-shrink:0; }
  .chip{ display:inline-flex; align-items:center; justify-content:center; border-radius:12px; flex-shrink:0; }
  .chip svg.i{ width:54%; height:54%; }
  .chip.sm{ width:30px; height:30px; border-radius:9px; }
  .chip.sm svg.i{ width:60%; height:60%; }
  .chip-blue{ background:#E7ECFA; color:var(--teal-dark); }
  .chip-green{ background:#E3F0E8; color:#2F6B4F; }
  .chip-purple{ background:#EDE7F5; color:#6B4FA0; }
  .chip-orange{ background:#FBEEE0; color:var(--gold); }
  .chip-teal{ background:#E1EEEC; color:#1E6B63; }
  .chip-indigo{ background:#E7E9F5; color:#4A4F8F; }
  .chip-pink{ background:#F5E7EE; color:#A0456F; }
  .chip-amber{ background:#FBF1DC; color:#8a5a00; }
  .chip-slate{ background:#EAEDF1; color:#4A4F5E; }
  .chip-cyan{ background:#E1EEF2; color:#1E6B85; }
  .chip-navy{ background:#E3E7F2; color:var(--teal-dark); }
  .chip-red{ background:#FBE9E7; color:var(--danger); }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px; }
  .stat{ display:flex; align-items:center; gap:14px; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:0 1px 2px rgba(16,24,40,0.03), 0 1px 6px rgba(16,24,40,0.05); }
  .stat .chip{ width:48px; height:48px; }
  .stat .v{ font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.15; }
  .stat .l{ font-size:0.78rem; color:#6b6a5f; }
  .tpl-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .tpl{ display:flex; flex-direction:column; align-items:flex-start; gap:9px; border:1px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; background:var(--white); text-align:left; font-family:inherit; color:var(--ink); box-shadow:0 1px 2px rgba(16,24,40,0.03); transition:transform .15s, box-shadow .15s, border-color .15s; }
  .tpl:hover{ transform:translateY(-2px); border-color:transparent; box-shadow:0 8px 18px rgba(16,24,40,0.1); }
  .tpl strong{ display:block; color:var(--teal-dark); font-size:0.9rem; margin-bottom:3px; }
  .tpl span{ font-size:0.78rem; color:#6b6a5f; line-height:1.35; }
  .tpl-head{ display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px; }
  .tpl-head h3{ margin:0; display:flex; align-items:center; gap:9px; font-size:1rem; }

  .pill{ display:inline-block; padding:2px 9px; border-radius:10px; font-size:0.72rem; font-weight:600; white-space:nowrap; }
  .pill.memo{ background:#E3E7F2; color:var(--teal-dark); }
  .pill.propuesta{ background:#EDE7F5; color:#6B4FA0; }
  .msg-doc{ padding:9px 13px; border-radius:4px; margin-bottom:12px; font-size:0.88rem; }
  .msg-doc.error{ background:#FBE9E7; color:var(--danger); border:1px solid #E8C4BC; }
  .msg-doc.ok{ background:#E3F0E8; color:#2F6B4F; border:1px solid #C3DDCB; }

  /* Badge de estado reutilizable fuera de Memos y Propuestas: mismo look de
     chip pero como pastilla con texto (no ícono), para <select>/<span> de
     estado en el resto de la app. Sin selector "select." para que también
     sirva en los <span> de solo lectura (ej. Facturación en modo Encargado). */
  .estado-pill{ display:inline-block; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:12px; border-radius:20px; border:1px solid var(--line); padding:5px 12px; background:var(--white); }
  select.estado-pill{ cursor:pointer; }
  .panel, .card{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:0 1px 2px rgba(16,24,40,0.03), 0 1px 6px rgba(16,24,40,0.05); margin-bottom:18px; }

  /* ---- Editor por bloques ---- */
  .editor-layout{ display:grid; grid-template-columns:minmax(380px, 520px) 1fr; gap:20px; align-items:start; }
  @media (max-width:1050px){ .editor-layout{ grid-template-columns:1fr; } }
  .meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:14px; }
  .meta-grid .full{ grid-column:1 / -1; }
  .meta-grid label, .cierre-grid label{ display:flex; flex-direction:column; gap:4px; font-size:0.78rem; color:#6b6a5f; text-transform:none; letter-spacing:normal; font-weight:400; margin-bottom:0; }
  .cierre-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  .cierre-grid .full{ grid-column:1 / -1; }
  .block{ border:1px solid var(--line); border-left:4px solid #9fb3cc; border-radius:4px; padding:8px 10px; margin-bottom:8px; background:var(--white); }
  .block.focus{ border-left-color:var(--gold); box-shadow:0 0 0 2px #F1E6CE; }
  .block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:6px; }
  .block-head .tipo{ font-size:0.72rem; font-weight:600; text-transform:uppercase; color:#6b6a5f; letter-spacing:0.04em; }
  .block-head .ctl button{ background:none; border:1px solid var(--line); border-radius:3px; cursor:pointer; padding:1px 6px; font-size:0.78rem; color:var(--teal-dark); }
  .block-head .ctl button:hover{ background:var(--paper-2); }
  .block-head .ctl button.del{ color:var(--danger); }
  .block .inl{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:0.82rem; margin-top:6px; }
  .block input[type=text], .block input[type=number], .block textarea{ width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:0.85rem; }
  .add-bar{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .add-bar button{ background:var(--white); border:1px dashed #9fb3cc; color:var(--teal-dark); border-radius:4px; padding:5px 9px; cursor:pointer; font-size:0.8rem; font-family:inherit; }
  .add-bar button:hover{ border-style:solid; background:var(--paper-2); }
  .hon-group{ border:1px solid var(--line); border-radius:4px; padding:8px; margin-bottom:8px; background:#fafbfc; }
  .hon-group table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .hon-group td{ padding:2px 3px; }
  .hon-group td input{ width:100%; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
  .hon-group td.uf input{ text-align:right; }
  .hon-sub{ text-align:right; font-size:0.82rem; color:var(--teal-dark); margin-top:4px; }
  .warns .w{ font-size:0.82rem; padding:6px 10px; border-radius:4px; background:#FBF1DC; border:1px solid #E9D8A6; color:#8a5a00; margin-bottom:5px; }
  .warns .okline{ font-size:0.82rem; padding:6px 10px; border-radius:4px; background:#E3F0E8; border:1px solid #C3DDCB; color:#2F6B4F; }
  .sticky-preview{ position:sticky; top:12px; }
  .preview-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .saved-info{ font-size:0.78rem; color:#6b6a5f; margin-left:auto; }
  .preview-scroll{ max-height:calc(100vh - 110px); overflow:auto; padding:4px 4px 20px; }
  .editor-pane{ display:flex; flex-direction:column; gap:14px; }
  .hint{ font-size:0.78rem; color:#6b6a5f; line-height:1.4; }
  .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:10px; }
  .row .grow, .field.grow{ flex:1; }
  .field{ display:flex; flex-direction:column; gap:4px; font-size:0.78rem; color:#6b6a5f; }
  .field input, .field select{ font-size:14px; color:var(--ink); }

  /* ---- Documento (hoja impresa/exportada) ---- */
  .paper{
    background:var(--white); width:100%; max-width:794px; margin:0 auto;
    padding:48px 60px 28px; box-shadow:0 1px 4px rgba(0,0,0,0.15), 0 8px 24px rgba(0,0,0,0.06);
    font-family:Calibri, "Segoe UI", Arial, sans-serif; font-size:11pt; line-height:1.45; color:#111;
  }
  .paper table.frame{ width:100%; border-collapse:collapse; }
  .paper table.frame > tbody > tr > td, .paper table.frame > tfoot > tr > td{ padding:0; border:none; }
  .paper .footer-spacer{ height:0; }
  table.lh{ width:100%; border-collapse:collapse; margin-bottom:0; }
  table.lh td{ padding:0; border:none; vertical-align:middle; }
  table.lh td.lh-logo{ width:58px; padding-right:14px; }
  table.lh td.lh-logo img{ display:block; width:52px; height:52px; object-fit:contain; border-radius:4px; }
  table.lh td.lh-name{ text-align:left; }
  table.lh td.lh-name .legal{ font-weight:700; font-size:13pt; color:var(--doc, #0A1A73); line-height:1.25; letter-spacing:0.01em; }
  table.lh td.lh-name .tag{ font-size:8.2pt; color:#7a8494; letter-spacing:0.03em; margin-top:2px; text-transform:uppercase; }
  table.lh td.lh-num{ text-align:right; white-space:nowrap; width:1%; }
  .paper table.badge{ border-collapse:collapse; margin-left:auto; }
  .paper table.badge td{ border:1px solid var(--doc, #0A1A73); background:#f4f7fb; color:var(--doc, #0A1A73); font-weight:700; font-size:9.3pt; letter-spacing:0.02em; padding:7px 13px; border-radius:4px; text-align:center; white-space:nowrap; }
  .lh-rule{ border:none; border-top:2.5px solid var(--doc, #0A1A73); margin:12px 0 2px; }
  .lh-rule2{ border:none; border-top:1px solid var(--doc, #0A1A73); opacity:0.35; margin:0 0 18px; }
  .d-meta{ border-collapse:collapse; margin-bottom:8px; }
  .d-meta td{ padding:2px 0; vertical-align:top; font-size:11pt; }
  .d-meta td.k{ width:95px; font-weight:600; color:#3a4453; }
  .d-meta td.s{ width:18px; color:#8a97a6; }
  .paper p{ margin:0 0 9px; text-align:justify; }
  .paper h4.h1{ font-size:11.5pt; margin:18px 0 9px; padding-bottom:3px; color:var(--doc, #0A1A73); border-bottom:1px solid #dbe2ea; }
  .paper h5.h2{ font-size:11pt; margin:12px 0 6px; font-style:italic; color:#2a3140; }
  .paper ul{ margin:0 0 10px; padding-left:22px; }
  .paper ul li{ margin-bottom:3px; text-align:justify; }
  .paper ul ul{ margin:3px 0 3px; list-style:"– "; }
  .paper ol.soc{ margin:0 0 12px; padding-left:24px; }
  .paper ol.soc li{ margin-bottom:2px; }
  .tbl-wrap{ margin:6px 0 14px; }
  .paper table.dt{ width:100%; border-collapse:collapse; font-size:9.5pt; }
  .paper table.dt th, .paper table.dt td{ padding:5px 8px; vertical-align:top; border:none; border-bottom:1px solid #dde3ea; }
  .paper table.dt th{ background:var(--doc, #0A1A73); color:#fff; text-align:left; font-weight:600; border-bottom:none; }
  .paper table.dt tbody tr:nth-child(even){ background:#f5f8fb; }
  .paper table.dt td.n, .paper table.dt th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .paper table.dt tr.grp td{ background:#e9eff6 !important; font-weight:700; color:var(--doc, #0A1A73); border-bottom:1px solid #c7d3e0; }
  .paper table.dt tr.tot td{ font-weight:700; background:#eef2f7 !important; border-top:1.5px solid var(--doc, #0A1A73); border-bottom:3px double var(--doc, #0A1A73); }
  .paper table.dt td.ind{ padding-left:20px; }
  .paper .nota{ border-left:4px solid var(--doc, #0A1A73); background:#f1f5f9; padding:9px 13px; margin:8px 0 14px; border-radius:0 5px 5px 0; }
  .paper .nota p{ margin:0; }
  .paper .nota strong{ color:var(--doc, #0A1A73); }
  .paper .salto{ border-top:1px dashed #b7c3d0; margin:16px 0; text-align:center; font-size:8pt; color:#8a97a6; height:0; }
  .paper .salto span{ position:relative; top:-0.8em; background:var(--white); padding:0 6px; }
  .paper .firma{ margin-top:22px; page-break-inside:avoid; }
  .paper .firma .esp{ height:42px; }
  .paper .firma .lin{ width:230px; border-top:1px solid #333; margin-bottom:4px; }
  .paper .iniciales{ font-size:8pt; color:#555; margin-top:18px; }
  .paper .acep{ page-break-inside:auto; }
  .paper .acep table.form{ border-collapse:collapse; margin:4px 0 14px; }
  .paper .acep table.form td{ padding:5px 0; }
  .paper .acep table.form td.k{ width:170px; }
  .paper .acep table.form td.v{ border-bottom:1px solid #444; width:300px; }
  .paper .acep .firmas{ display:flex; gap:40px; margin-top:44px; flex-wrap:wrap; }
  .paper .acep .firmas div{ flex:1; min-width:200px; font-size:10pt; }
  .paper .acep .firmas .lin{ border-top:1px solid #333; margin-bottom:4px; }
  .paper a{ color:#1a4fb5; word-break:break-all; }
  .paper mark.ph{ background:#ffe58a; color:#5c4300; padding:0 2px; border-radius:2px; }
  .doc-footer{ margin-top:26px; border-top:1.5px solid var(--doc, #0A1A73); padding-top:7px; font-size:7.5pt; color:#5b6776; text-align:center; line-height:1.4; }
  .doc-footer strong{ color:var(--doc, #0A1A73); font-size:8.5pt; }

  @media (max-width:640px){
    .meta-grid, .cierre-grid{ grid-template-columns:1fr; }
  }
  @media print{
    body.imprimiendo-doc .topbar, body.imprimiendo-doc .folders, body.imprimiendo-doc .no-print,
    body.imprimiendo-doc .toast, body.imprimiendo-doc .editor-pane, body.imprimiendo-doc .preview-bar,
    body.imprimiendo-doc .warns, body.imprimiendo-doc .nav-panel-title{ display:none !important; }
    body.imprimiendo-doc .layout{ display:block !important; }
    body.imprimiendo-doc .main{ padding:0 !important; }
    body.imprimiendo-doc .editor-layout{ display:block !important; }
    body.imprimiendo-doc .sticky-preview{ position:static !important; }
    body.imprimiendo-doc .preview-scroll{ max-height:none !important; overflow:visible !important; padding:0 !important; }
    body.imprimiendo-doc .paper{ box-shadow:none !important; max-width:none !important; padding:0 !important; }
    body.imprimiendo-doc .paper .footer-spacer{ height:16mm; }
    body.imprimiendo-doc .doc-footer{ position:fixed; left:0; right:0; bottom:0; margin:0; background:var(--white); }
    body.imprimiendo-doc .paper .salto{ border:none; margin:0; break-before:page; page-break-before:always; }
    body.imprimiendo-doc .paper .salto span{ display:none; }
    body.imprimiendo-doc .paper h4.h1, body.imprimiendo-doc .paper h5.h2{ break-after:avoid; page-break-after:avoid; }
    body.imprimiendo-doc .paper table.dt tr{ break-inside:avoid; }
    body.imprimiendo-doc table.lh, body.imprimiendo-doc .paper .nota{ break-inside:avoid; }
    @page{ size:A4; margin:14mm 18mm 10mm; }
  }

  /* ---- Modal "Guardar como plantilla" ---- */
  .modal-bg-doc{ position:fixed; inset:0; background:rgba(15,23,42,0.45); display:none; align-items:flex-start; justify-content:center; z-index:150; padding:40px 16px; overflow:auto; }
  .modal-bg-doc.open{ display:flex; }
  .modal-doc{ background:var(--white); border-radius:6px; max-width:560px; width:100%; padding:18px 20px; }
</style>
</head>

// Utilidad genérica de debounce: agrupa llamadas repetidas en una sola,
// ejecutada `wait` ms después de la última invocación. flush() ejecuta de
// inmediato lo pendiente (o no hace nada si no hay nada agendado); cancel()
// descarta lo pendiente sin ejecutarlo.
function makeDebouncer(fn, wait){
  let timer = null;
  let pendingArgs = null;
  // Además del timer de espera, se rastrea si fn(...) está corriendo (p.ej.
  // el POST de guardado ya salió pero la respuesta no ha vuelto). isPending()
  // cubre ambas ventanas — la usa sondearRequerimientosNuevos() para no
  // pisar con una respuesta vieja del servidor un cambio local que todavía
  // no terminó de guardarse.
  let enVuelo = false;
  async function ejecutar(a){
    enVuelo = true;
    try{ await fn(...a); } finally { enVuelo = false; }
  }
  function run(...args){
    pendingArgs = args;
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      const a = pendingArgs;
      pendingArgs = null;
      ejecutar(a);
    }, wait);
  }
  function flush(){
    if(timer === null) return;
    clearTimeout(timer);
    timer = null;
    const a = pendingArgs;
    pendingArgs = null;
    ejecutar(a);
  }
  function cancel(){
    clearTimeout(timer);
    timer = null;
    pendingArgs = null;
  }
  function isPending(){ return timer !== null || enVuelo; }
  return { run, flush, cancel, isPending };
}

// Paginación genérica para tablas grandes: corta `list` a la página pedida,
// respetando cualquier filtro ya aplicado antes de llamarla (sucursal,
// encargado, búsqueda, mes, etc. — quien llama filtra primero, esto solo pagina).
function paginate(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const clampedPage = Math.min(Math.max(1, page || 1), totalPages);
  const start = (clampedPage - 1) * PAGE_SIZE;
  return { pageItems: list.slice(start, start + PAGE_SIZE), totalPages, page: clampedPage, total: list.length };
}

// Vencido: ya pasó la fecha de respuesta. Próximo a vencer: quedan 7 días o
// menos (mismo umbral que ya usaba el badge ámbar/rojo de
// badgeDiasFaltantes, para que el color de la insignia y la categoría acá
// coincidan). Pendiente: todo lo demás sin resolver (incluye los que no
// tienen fecha de respuesta cargada). Resuelto: aparte, al final.
function categoriaUrgenciaRequerimiento(r){
  if(r.estado === 'Resuelto') return 'resuelto';
  const dias = diasFaltantes(r.fechaRespuesta);
  if(dias === null) return 'pendiente';
  if(dias < 0) return 'vencido';
  if(dias <= 7) return 'proximo';
  return 'pendiente';
}

const ORDEN_URGENCIA_REQUERIMIENTO = { vencido: 0, proximo: 1, pendiente: 2, resuelto: 3 };
const ETIQUETA_URGENCIA_REQUERIMIENTO = { vencido: 'Vencidos', proximo: 'Próximos a vencer', pendiente: 'Pendientes', resuelto: 'Resueltos' };

// Orden: primero por urgencia (vencido → próximo → pendiente → resuelto),
// y dentro de cada grupo, por persona a cargo (Dirigido a).
function ordenarRequerimientosPorUrgencia(list){
  return [...list].sort((a, b) => {
    const ua = ORDEN_URGENCIA_REQUERIMIENTO[categoriaUrgenciaRequerimiento(a)];
    const ub = ORDEN_URGENCIA_REQUERIMIENTO[categoriaUrgenciaRequerimiento(b)];
    if(ua !== ub) return ua - ub;
    const pa = nombresDirigidoA(a), pb = nombresDirigidoA(b);
    if(pa !== pb) return pa.localeCompare(pb, 'es');
    return (b.fechaCreacion||'').localeCompare(a.fechaCreacion||'');
  });
}

// Trae varias colecciones en UNA sola llamada al backend (en vez de una
// petición HTTP por colección, como hacía antes loadState() con Promise.all
// de kvGet). Esas ~9 llamadas simultáneas contra el mismo despliegue de
// Apps Script se pisaban/encolaban entre sí y eran la causa principal de la
// demora al cargar la app. Requiere que Code.gs soporte el parámetro
// "keys" (coma-separado) en doGet — ver comentario ahí.
async function kvGetMany(keys){
  if(!BACKEND_URL) return {};
  try{
    const res = await fetch(`${BACKEND_URL}?keys=${encodeURIComponent(keys.join(','))}&token=${encodeURIComponent(API_TOKEN)}`, { cache: 'no-store' });
    const data = await res.json();
    if(data && data.__rateLimited__){
      showToast('Demasiadas solicitudes seguidas. Espera un momento y reintenta.');
      return {};
    }
    return data || {};
  }catch(e){
    console.error('No se pudo leer del backend (lote):', e);
    return {};
  }
}

// ==== Estado dividido en varias llaves (una por colección) ====
// Antes todo `state` (usuarios+clientes+requerimientos+obligaciones+
// reuniones+trabajosEspeciales+plantillas) vivía en UNA sola llave
// "directorio", y CUALQUIER guardado reescribía el bloque completo. Eso
// causaba que, con dos pestañas abiertas, un guardado sin relación (p.ej.
// tildar una tarea) pisara silenciosamente un cambio hecho en otro lado
// segundos antes (p.ej. un permiso de usuario) — el backend "gana el
// último que guarda" a nivel de la llave completa.
//
// Para acotar el problema, cada colección de nivel superior ahora vive en
// su PROPIA llave del KV ('usuarios', 'clientes', 'requerimientos',
// 'obligaciones', 'reuniones', 'trabajosEspeciales', 'config'). Guardar
// una ya no reescribe las demás. Sigue existiendo la ventana de choque
// para DOS cambios a la MISMA colección casi al mismo segundo (eso
// requeriría filas individuales por registro, un cambio más grande), pero
// el caso que causó problemas — un cambio en usuarios pisado por un
// cambio de clientes, o viceversa — queda resuelto.
const COLECCIONES_ESTADO = ['usuarios', 'clientes', 'requerimientos', 'obligaciones', 'reuniones', 'trabajosEspeciales', 'auditoria', 'estimacionesF29', 'propuestas', 'clientesRemuneraciones', 'rrhhFichas', 'documentosTrabajo'];

// Colecciones que se guardan por FUSIÓN (merge) en vez de mandar el arreglo
// completo cada vez: el backend solo toca, por id, los registros que de
// verdad cambiaron o se borraron (ver calcularDiffColeccion / mergeColeccion
// en el backend). Esto es lo que permite que dos personas editen registros
// distintos de la misma colección (dos clientes, dos requerimientos, etc.)
// al mismo tiempo sin que el guardado de una borre el cambio de la otra —
// antes cada guardado reescribía TODA la colección de una sola vez, y la
// segunda persona en guardar pisaba en silencio lo que la primera acababa de
// guardar. auditoria (log de actividad) y config (ajustes globales) quedan
// afuera: son de bajo riesgo de choque y se siguen guardando completas.
const ID_POR_COLECCION_MERGE = {
  clientes: true, usuarios: true, requerimientos: true, obligaciones: true,
  reuniones: true, trabajosEspeciales: true, estimacionesF29: true, propuestas: true,
  clientesRemuneraciones: true, rrhhFichas: true, documentosTrabajo: true
};

// Copia de cada colección tal como sabemos que está guardada en el backend
// (recién cargada, o recién confirmado el guardado). Al guardar se compara
// la lista actual contra esta base para saber qué registros cambiaron,
// se agregaron o se borraron — eso es lo único que se manda, no la
// colección completa. SIEMPRE se guarda como copia profunda: si guardara la
// misma referencia que usa la app, cualquier edición en pantalla también
// "editaría" la base sin querer, y nunca se detectaría ningún cambio.
let baseSnapshots = {};

function actualizarBaseSnapshot(nombre, valor){
  baseSnapshots[nombre] = JSON.parse(JSON.stringify(valor || []));
}

function calcularDiffColeccion(nombre, listaActual){
  const base = baseSnapshots[nombre] || [];
  const baseMapa = new Map(base.map(r => [r.id, r]));
  const actualIds = new Set();
  const cambios = [];
  (listaActual || []).forEach(registro => {
    if(!registro || !registro.id) return;
    actualIds.add(registro.id);
    const anterior = baseMapa.get(registro.id);
    if(!anterior || JSON.stringify(anterior) !== JSON.stringify(registro)){
      cambios.push(registro);
    }
  });
  const eliminados = base.filter(r => !actualIds.has(r.id)).map(r => r.id);
  return { cambios, eliminados };
}

async function loadState(){
  state = {};
  const seed = seedData();

  // Antes: 9 llamadas HTTP en paralelo (una por colección + config), cada
  // una contra el mismo despliegue de Apps Script — se pisaban/encolaban
  // entre sí y eran la causa principal de la demora al entrar. Ahora: una
  // sola llamada en lote (ver kvGetMany / Code.gs).
  const llaves = COLECCIONES_ESTADO.concat(['config']);
  const valores = await kvGetMany(llaves);

  COLECCIONES_ESTADO.forEach((nombre) => {
    const raw = valores[nombre];
    try{
      state[nombre] = raw ? JSON.parse(raw) : (seed[nombre] || valorPorDefectoColeccion(nombre));
    }catch(e){
      state[nombre] = seed[nombre] || valorPorDefectoColeccion(nombre);
    }
    if(!state[nombre]) state[nombre] = valorPorDefectoColeccion(nombre);
    if(ID_POR_COLECCION_MERGE[nombre]) actualizarBaseSnapshot(nombre, state[nombre]);
  });

  try{
    const config = valores.config ? JSON.parse(valores.config) : null;
    state.tareasPlantilla = (config && config.tareasPlantilla) || seed.tareasPlantilla || valorPorDefectoConfig().tareasPlantilla;
    state.declaracionesJuradasPlantilla = (config && config.declaracionesJuradasPlantilla) || seed.declaracionesJuradasPlantilla || valorPorDefectoConfig().declaracionesJuradasPlantilla;
    // configDocumentos/firmantesDocumentos/plantillasUsuarioDocumentos (Memos y
    // Propuestas) son nuevos en config: un config guardado antes de esta
    // funcionalidad no los trae, así que cada uno cae a su default por separado
    // en vez de descartar TODO el config si falta uno solo.
    state.configDocumentos = Object.assign({}, valorPorDefectoConfigDocumentos(), (config && config.configDocumentos) || {});
    state.firmantesDocumentos = (config && config.firmantesDocumentos) || valorPorDefectoFirmantesDocumentos();
    state.plantillasUsuarioDocumentos = (config && config.plantillasUsuarioDocumentos) || [];
  }catch(e){
    const def = valorPorDefectoConfig();
    state.tareasPlantilla = def.tareasPlantilla;
    state.declaracionesJuradasPlantilla = def.declaracionesJuradasPlantilla;
    state.configDocumentos = def.configDocumentos;
    state.firmantesDocumentos = def.firmantesDocumentos;
    state.plantillasUsuarioDocumentos = def.plantillasUsuarioDocumentos;
  }
}

// Un debouncer + función de guardado por colección (mismo patrón de
// agrupado ~1.75s que ya usaba credenciales). flushPendingSaves() dispara
// de inmediato lo que esté pendiente en CUALQUIERA de ellas.
function crearGuardadoColeccion(nombreLlave, obtenerValor, mensajeError){
  const debouncer = makeDebouncer(async () => {
    try{
      if(ID_POR_COLECCION_MERGE[nombreLlave]){
        const listaActual = obtenerValor();
        const { cambios, eliminados } = calcularDiffColeccion(nombreLlave, listaActual);
        if(!cambios.length && !eliminados.length) return;
        // Copia profunda ANTES de esperar la respuesta: si mientras se guarda
        // alguien sigue editando en pantalla, la base tiene que quedar
        // marcada con lo que de verdad se mandó, no con lo que haya en
        // pantalla cuando responda el backend (si no, el próximo cambio
        // parecería "ya guardado" y nunca se enviaría).
        const snapshotEnviado = JSON.parse(JSON.stringify(listaActual));
        const ok = await kvMergeColeccion(nombreLlave, cambios, eliminados);
        if(ok){
          baseSnapshots[nombreLlave] = snapshotEnviado;
        }else if(BACKEND_URL){
          showToast(mensajeError);
        }
        return;
      }
      const ok = await kvSet(nombreLlave, JSON.stringify(obtenerValor()));
      if(!ok && BACKEND_URL) showToast(mensajeError);
    }catch(e){
      showToast(mensajeError);
    }
  }, 1750);
  return debouncer;
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Cache de UF/Dólar en localStorage por día (clave = fecha de todayISO()):
// antes se pedían a mindicador.cl sin caché en CADA carga de la página, y esa
// API puede tardar hasta ~20 segundos (medido en producción) — con esto,
// cada persona paga esa espera una sola vez por día en su propio navegador,
// no en cada recarga. Si localStorage no está disponible (modo privado,
// cuota llena, etc.) simplemente sigue sin caché, como antes.
function leerIndicadorCacheado(clave){
  try{
    const cacheado = JSON.parse(localStorage.getItem(clave) || 'null');
    if(cacheado && cacheado.fecha === todayISO()) return cacheado.info;
  }catch(e){ /* sin caché disponible */ }
  return null;
}
function guardarIndicadorCacheado(clave, info){
  try{ localStorage.setItem(clave, JSON.stringify({ fecha: todayISO(), info })); }catch(e){ /* sin caché disponible */ }
}

let ufInfo = null; // { valor, fecha }
let ufLoading = false;
async function loadUF(){
  const cacheado = leerIndicadorCacheado('uf_cache');
  if(cacheado){ ufInfo = cacheado; renderUFBadge(); return; }
  ufLoading = true;
  renderUFBadge();
  try{
    const res = await fetch('https://mindicador.cl/api/uf', { cache: 'no-store' });
    const data = await res.json();
    // No asumir el orden del arreglo: se busca la fecha más reciente explícitamente.
    const last = data.serie.reduce((max, item) => (!max || item.fecha > max.fecha) ? item : max, null);
    const [y,m,d] = last.fecha.split('T')[0].split('-');
    const valorFmt = last.valor.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
    ufInfo = { valor: valorFmt, fecha: `${d}-${m}-${y}` };
    guardarIndicadorCacheado('uf_cache', ufInfo);
  }catch(e){
    ufInfo = null;
    console.error('No se pudo obtener la UF:', e);
  }
  ufLoading = false;
  renderUFBadge();
}

function renderUFBadge(){
  const ufSpan = document.getElementById('ufBox');
  if(!ufSpan) return;
  if(ufLoading){
    ufSpan.innerHTML = `<span class="uf-badge">Cargando UF…</span>`;
    return;
  }
  ufSpan.innerHTML = ufInfo
    ? `<span class="uf-badge">UF hoy $${ufInfo.valor} <span class="uf-date">(${ufInfo.fecha})</span></span>`
    : `<span class="uf-badge uf-error">UF no disponible <button class="switch-btn" style="padding:2px 8px;font-size:11px;margin-left:4px;" onclick="loadUF()">Reintentar</button></span>`;
}

// Guarda { usuario, hash } -- el hash SHA-256 de la clave, NUNCA la clave en
// texto plano (antes sí se guardaba en texto plano acá). Con el hash guardado,
// intentarAutoLogin() puede reingresar a la persona sin volver a pedirle la
// clave, verificando contra el backend igual que un login manual — pero si
// alguien abre el almacenamiento local del navegador ya no encuentra la
// clave real.
const RECORDAR_LOGIN_KEY = 'bpo1_recordar_login';

function leerLoginRecordado(){
  try{ return JSON.parse(localStorage.getItem(RECORDAR_LOGIN_KEY) || 'null'); }catch(e){ return null; }
}

function guardarLoginRecordado(usuarioVal, hash){
  const recordarCheck = document.getElementById('loginRecordar');
  try{
    if(recordarCheck && recordarCheck.checked){
      localStorage.setItem(RECORDAR_LOGIN_KEY, JSON.stringify({ usuario: usuarioVal, hash }));
    }else{
      localStorage.removeItem(RECORDAR_LOGIN_KEY);
    }
  }catch(e){ /* localStorage no disponible: se ignora, no bloquea el login */ }
}

// Se intenta una sola vez, al cargar la página (ver init()). Si hay una
// sesión recordada y el backend la valida, entra directo sin mostrar el
// formulario. Si el hash guardado ya no sirve (p.ej. se cambió la clave), se
// olvida el dispositivo y se muestra el login normal.
async function intentarAutoLogin(){
  const recordado = leerLoginRecordado();
  if(!recordado) return false;
  const u = state.usuarios.find(u => (u.usuario||'').toLowerCase() === recordado.usuario);
  const ok = u && await verificarLoginBackend(u.id, recordado.hash);
  if(!ok){
    try{ localStorage.removeItem(RECORDAR_LOGIN_KEY); }catch(e){}
    return false;
  }
  enterAsUsuario(u.id);
  return true;
}

function renderGate(){
  document.getElementById('topbar').style.display = 'none';
  const app = document.getElementById('app');
  const recordado = leerLoginRecordado();
  app.innerHTML = `
    <div class="tg-login-bg">
      <div class="tg-card">
        <div class="tg-brand">
          <img class="tg-logo" src="${LOGO_DATA_URI}" alt="BPO">
          <div style="text-align:center;">

        <input type="password" id="loginClave" class="tg-input" placeholder="Clave" autocomplete="current-password">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7280;margin:-6px 0 18px;">
          <input type="checkbox" id="loginRecordar" ${recordado?'checked':''} style="width:auto;">

        </label>

      </div>
    </div>
  `;
  const uInput = document.getElementById('loginUsuario');
  const pInput = document.getElementById('loginClave');
  (recordado ? pInput : uInput).focus();
  uInput.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') pInput.focus(); });
  pInput.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') checkLogin(); });
}

async function checkLogin(){
  const usuarioVal = document.getElementById('loginUsuario').value.trim().toLowerCase();
  const claveVal = document.getElementById('loginClave').value;
  const errBox = document.getElementById('loginError');
  const u = state.usuarios.find(u => (u.usuario||'').toLowerCase() === usuarioVal);
  if(!u){
    errBox.textContent = 'Usuario o clave incorrectos.';
    document.getElementById('loginClave').value = '';
    return;
  }
  const hash = await sha256(claveVal);
  const ok = await verificarLoginBackend(u.id, hash);
  if(!ok){
    errBox.textContent = 'Usuario o clave incorrectos.';
    document.getElementById('loginClave').value = '';
    return;
  }
  guardarLoginRecordado(usuarioVal, hash);
  enterAsUsuario(u.id);
}

function enterAsUsuario(id){
  const u = state.usuarios.find(u => u.id === id);
  if(!u) return;
  // sucursal y carterasVisibles se copian del registro completo: sin esto,
  // carterasDeUsuario(currentUser) siempre devolvía [] para los Asistentes
  // (veían su cartera vacía sin importar lo que tuvieran asignado).
  // Contabilidad tiene acceso total (mismo nivel que Administrador): la
  // persona en ese rol es quien configura la app, así que no tiene sentido
  // dejarla fuera de las secciones exclusivas de administrador.
  currentUser = { id: u.id, name: u.name, rol: u.rol, isAdmin: esRolAdmin(u.rol) || esRolContabilidad(u.rol), sucursal: u.sucursal, carterasVisibles: u.carterasVisibles, verTodasLasCarteras: u.verTodasLasCarteras };
  activeFolder = 'todos';
  showWhoami();
  renderApp();
  iniciarPollingRequerimientos();
}

// Al elegir una pestaña superior (Clientes/Gestión/Sistema/Administración) se
// navega de una vez a la primera sección de ese grupo. Antes solo se
// resaltaba el grupo sin cambiar el contenido, y la pantalla se quedaba
// pegada en la sección anterior hasta hacer un segundo clic en una
// sub-pestaña — parecía que el botón no hacía nada.
function setNavGrupoActivo(key){
  const grupos = construirGruposNav();
  const grupo = grupos.find(g => g.key === key);
  navGrupoPreview = key;
  if(grupo && !grupo.tabs.some(t => t.tab === activeTab)){
    setTab(grupo.tabs[0].tab);
  }else{
    renderApp();
  }
}

// Navegación de secciones en dos niveles (mismo patrón que la home de banca
// en línea de Banco de Chile): una fila de pestañas tipo píldora, cada una
// un grupo de secciones con su ícono, y debajo un panel con las secciones
// de la pestaña activa repartidas en columnas de a lo más 4 enlaces.
function construirGruposNav(){
  let grupos;
  // Encargado/Asistente Remuneraciones: cartera de Remuneraciones separada de
  // la contable, sin nada del lado contable (ver
  // puedeVerTodasLasCarterasRemuneraciones/carterasDeUsuarioRemuneraciones).
  // Se resuelve antes que cualquier otra cosa para que NUNCA caigan en los
  // grupos de abajo, pensados para Encargado/Asistente/TAX contables.
  if(esRolEncargadoRemuneraciones(currentUser.rol) || esRolAsistenteRemuneraciones(currentUser.rol)){
    return [
      { key:'remuneraciones', label:'Remuneraciones', icon: NAV_ICONS.folder, tabs: [
        {tab:'cartera-remuneraciones', label:'Cartera de Remuneraciones'},
        {tab:'trabajos-especiales-remuneraciones', label:'Trabajos Especiales'},
        {tab:'facturacion-remuneraciones', label:'Facturación'},
      ]},
    ];
  }
  if(!currentUser.isAdmin){
    // Encargado, Asistente y TAX: mismas secciones de siempre (Facturación,
    // Incorporar Clientes, Dashboard, Usuarios y Roles siguen sin estar
    // disponibles para estos roles). Trabajos Especiales se suma a "Cartera"
    // solo para TAX (además del Administrador/Contabilidad, que tienen su
    // propio grupo "Gestión" más abajo).
    grupos = [
      { key:'gestion', label:'Gestión', icon: NAV_ICONS.list, tabs: [
        {tab:'inicio', label:'Inicio'},
        {tab:'requerimientos', label:'Requerimientos'},
      ]},
      { key:'cartera', label:'Cartera', icon: NAV_ICONS.folder, tabs: [
        {tab:'cartera', label:'Cartera de Clientes'},
        {tab:'obligaciones', label:'Obligaciones Tributarias'},
        {tab:'f29', label:'F-29'},
        {tab:'tareas', label:'Tareas'},
        {tab:'archivos', label:'Archivos'},
        ...(puedeVerTodasLasCarteras(currentUser) ? [{tab:'trabajos-especiales', label:'Trabajos Especiales'}] : []),
      ]},
    ];
  }else{
    grupos = [
      { key:'clientes', label:'Clientes', icon: NAV_ICONS.folder, tabs: [
        {tab:'cartera', label:'Cartera de Clientes'},
        {tab:'obligaciones', label:'Obligaciones Tributarias'},
        {tab:'f29', label:'F-29'},
        {tab:'tareas', label:'Tareas'},
        {tab:'archivos', label:'Archivos'},
        {tab:'facturacion', label:'Facturación'},
        {tab:'cobranza', label:'Cobranza'},
        {tab:'incorporar', label:'Incorporar Clientes'},
      ]},
      { key:'gestion', label:'Gestión', icon: NAV_ICONS.list, tabs: [
        {tab:'inicio', label:'Inicio'},
        {tab:'requerimientos', label:'Requerimientos'},
        {tab:'trabajos-especiales', label:'Trabajos Especiales'},
        {tab:'agenda-eduardo', label:'Agenda de Eduardo'},
      ]},
      { key:'sistema', label:'Sistema', icon: NAV_ICONS.gear, tabs: [
        {tab:'dashboard', label:'Dashboard'},
        {tab:'usuarios', label:'Usuarios y Roles'},
        {tab:'actividad', label:'Actividad'},
      ]},
    ];
  }

  // Administrador y Contabilidad además ven la sección Remuneraciones (la
  // misma cartera separada que ven Encargado/Asistente Remuneraciones arriba,
  // pero con visión completa — ver puedeVerTodasLasCarterasRemuneraciones).
  if(currentUser.isAdmin){
    grupos.push({ key:'remuneraciones', label:'Remuneraciones', icon: NAV_ICONS.folder, tabs: [
      {tab:'cartera-remuneraciones', label:'Cartera de Remuneraciones'},
      {tab:'trabajos-especiales-remuneraciones', label:'Trabajos Especiales'},
      {tab:'facturacion-remuneraciones', label:'Facturación'},
    ]});
    // Memos y Propuestas: incorporado directamente acá (ver comentario al
    // inicio del bloque "MEMOS Y PROPUESTAS" más abajo) — mismo alcance que
    // tenía el control de Propuestas original (Administrador/Contabilidad).
    grupos.push({ key:'documentos-trabajo', label:'Memos y Propuestas', icon: NAV_ICONS.folder, tabs: [
      {tab:'documentos-trabajo', label:'Documentos'},
      {tab:'documentos-trabajo-editor', label:'Editor'},
      {tab:'documentos-trabajo-clientes', label:'Clientes'},
      {tab:'documentos-trabajo-config', label:'Configuración'},
    ]});
  }

  // Contabilidad tiene acceso total (todo lo de Administrador, arriba) más
  // sus propias herramientas de seguimiento semanal.
  if(esRolContabilidad(currentUser.rol)){
    grupos.push({ key:'administracion', label:'Administración', icon: NAV_ICONS.gear, tabs: [
      {tab:'reporte-semanal', label:'Reporte Semanal'},
      {tab:'derivar-cartera', label:'Derivar Cartera'},
      {tab:'configuracion', label:'Configuración'},
    ]});
  }

  // RR.HH. queda reservado exclusivamente al rol Administrador: ni siquiera
  // Contabilidad (que sí comparte todo lo demás con Administrador, ver
  // currentUser.isAdmin más arriba) entra acá, porque son datos sensibles del
  // propio equipo (contratos, licencias). Por eso se exige esRolAdmin(...) en
  // vez de currentUser.isAdmin, y el dispatch de la pestaña 'rrhh' más abajo
  // existe SOLO en adminLayout(), nunca en contabilidadLayout().
  if(esRolAdmin(currentUser.rol)){
    grupos.push({ key:'rrhh', label:'RR.HH.', icon: NAV_ICONS.list, tabs: [
      {tab:'rrhh', label:'Equipo'},
    ]});
  }

  return grupos;
}

function sectionNav(){
  const link = (tab, label) => `<div class="nav-link ${activeTab===tab?'active':''}" onclick="setTab('${tab}')">${label}</div>`;
  const grupos = construirGruposNav();

  // La pestaña activa sigue a la sección donde se está parado, salvo que se
  // haya elegido otra a mano (navGrupoPreview) sin haber navegado todavía.
  const grupoActivoKey = (navGrupoPreview && grupos.some(g=>g.key===navGrupoPreview))
    ? navGrupoPreview
    : (grupos.find(g => g.tabs.some(t => t.tab === activeTab)) || grupos[0]).key;
  const grupoActivo = grupos.find(g => g.key === grupoActivoKey);

  return `
    <div class="nav-pills">
      ${grupos.map(g => `
        <button class="nav-pill ${g.key===grupoActivoKey?'active':''}" onclick="setNavGrupoActivo('${g.key}')">
          ${g.icon}<span>${g.label}</span>
        </button>
      `).join('')}
    </div>
    <div class="nav-panel-title">${grupoActivo.label}</div>
    <div class="nav-columns">
      ${grupoActivo.tabs.map(it => link(it.tab, it.label)).join('')}
    </div>
  `;
}

function setTab(tab){
  flushPendingSaves();
  searchDebouncer.cancel();
  clearBulkSelections();
  activeTab = tab;
  navGrupoPreview = null; // al navegar de verdad, la pestaña superior vuelve a seguir a la sección real
  searchQuery = '';
  tablePage = 1;
  inicioReqExpandido = false;
  if(tab === 'requerimientos') marcarRequerimientosLeidos();
  renderApp();
}

function currentList(unassigned){
  const base = clientesEnSucursalActiva();
  let list;
  if(activeFolder==='todos') list = base;
  else if(activeFolder==='sin_asignar') list = unassigned;
  else list = base.filter(c => c.encargadoId === activeFolder);

  const q = (searchQuery||'').trim().toLowerCase();
  if(q){
    list = list.filter(c =>
      (c.name||'').toLowerCase().includes(q) ||
      (c.rut||'').toLowerCase().includes(q)
    );
  }
  return list;

function incorporarClienteForm(isAdmin){
  return `
    <div class="main-head">
      <div>
        <h2 class="display">Incorporar Cliente</h2>
        <div class="meta">Completa los datos para agregar un nuevo cliente a la cartera.</div>

          <input type="text" id="ob_rut" placeholder="12.345.678-9">
        </label>
        <label>Clave
          <input type="text" id="ob_clave" placeholder="Clave de acceso">
        </label>
        <label>Régimen tributario
          <select id="ob_regimen" onchange="toggleObPersonaNatural(this.value);">
            <option value="">Selecciona un régimen</option>
            ${REGIMENES_TRIBUTARIOS.map(r=>`<option value="${r}">${escapeHtml(r)}</option>`).join('')}
          </select>

          <input type="text" id="ob_rep" placeholder="Nombre(s) del/los representante(s) legal(es)">
        </label>
        <label id="ob_actividad_wrap">Actividad económica
          <input type="text" id="ob_actividad" placeholder="Ej: Servicios de asesoría contable">
        </label>
        <label>Valor servicio mensual (UF)
          <input type="number" id="ob_valor_mensual" placeholder="Ej: 5.5" min="0" step="0.1">
        </label>
        <label>Encargado
          ${isAdmin ? `<select id="ob_encargado">
            <option value="">Sin asignar</option>
            ${state.usuarios.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}
          </select>` : (() => {
            const opciones = carterasDeUsuario(currentUser).map(id => state.usuarios.find(u=>u.id===id)).filter(Boolean);
            if(opciones.length <= 1){
              const nombre = opciones[0] ? opciones[0].name : currentUser.name;
              const val = opciones[0] ? opciones[0].id : currentUser.id;
              return `<input type="text" value="${escapeHtml(nombre)}" disabled><input type="hidden" id="ob_encargado" value="${val}">`;
            }
            return `<select id="ob_encargado">${opciones.map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}</select>`;
          })()}
        </label>
      </div>
      <button class="btn" onclick="submitIncorporarCliente(${isAdmin})">Incorporar cliente</button>
    </div>
  `;
}

function toggleObPersonaNatural(regimen){
  const esPN = regimen === 'Persona Natural';
  const repWrap = document.getElementById('ob_rep_wrap');
  const actWrap = document.getElementById('ob_actividad_wrap');
  if(repWrap) repWrap.style.display = esPN ? 'none' : 'flex';
  if(actWrap) actWrap.style.display = esPN ? 'none' : 'flex';
}

async function submitIncorporarCliente(isAdmin){
  if(!currentUser.isAdmin) return showToast('Solo un administrador puede agregar clientes.');
  const name = document.getElementById('ob_name').value.trim();
  const rut = document.getElementById('ob_rut').value.trim();
  const clave = document.getElementById('ob_clave').value.trim();
  const regimen = document.getElementById('ob_regimen').value;
  const esPersonaNaturalNueva = regimen === 'Persona Natural';
  const representanteLegal = esPersonaNaturalNueva ? '' : document.getElementById('ob_rep').value.trim();
  const actividadEconomica = esPersonaNaturalNueva ? '' : document.getElementById('ob_actividad').value.trim();
  const valorInput = document.getElementById('ob_valor_mensual');
  const valorParsed = valorInput ? parseFloat(valorInput.value) : NaN;
  const valorServicioMensual = isNaN(valorParsed) ? null : valorParsed;
  const encargadoId = document.getElementById('ob_encargado').value || null;
  const encargadoUsuario = state.usuarios.find(u => u.id === encargadoId);
  const sucursal = encargadoUsuario && encargadoUsuario.sucursal !== 'Ambas' ? encargadoUsuario.sucursal : 'Concepcion';

  if(!name){ showToast('Escribe la razón social del cliente.'); return; }
  if(!rut){ showToast('Escribe el RUT del cliente.'); return; }

  state.clientes.push({
    id: uid('c'),
    name, rut, clave,
    regimenTributario: regimen,
    representanteLegal,
    actividadEconomica,
    valorServicioMensual,
    encargadoId,
    sucursal,
    notas: '',
    f29Estado: 'no_enviado',
    f29Requerido: false
  });
  await saveClientes();
  showToast('Cliente incorporado correctamente.');
  renderApp();
}

  if(activeFolder==='todos') return 'Todos los clientes';
  if(activeFolder==='sin_asignar') return 'Sin asignar';
  const e = state.usuarios.find(e=>e.id===activeFolder);
  return e ? e.name : 'Todos los clientes';
}

function adminMainContent(unassigned){
  const list = ordenarPorGrupo(currentList(unassigned));
  const q = (searchQuery||'').trim().toLowerCase();
  const { pageItems, totalPages, page } = paginate(list, tablePage);
  // Solo el Administrador da de alta a clientes nuevos. Para eliminar, se
  // suma el rol Contabilidad (además del Administrador, que ya podía);
  // Contabilidad también puede reasignar el encargado de cada cliente,
  // pero no crear clientes nuevos.
  const puedeAgregarCliente = currentUser.isAdmin;

// Sub-pestaña "Confección Iva" dentro de Obligaciones Tributarias.
// verTodo=true (Administrador/Contabilidad/TAX): igual que antes, con filtro
// de sucursal y chips por encargado. verTodo=false (Encargado/Asistente):
// solo su propia cartera, sin esos filtros (no tienen nada que filtrar).
function confeccionIvaContent(verTodo){
  if(verTodo){
    const nomina = clientesEnSucursalActiva().filter(c => c.f29Requerido || c.f29CasoEspecialMes === mesActualISO());
    const unassignedNomina = nomina.filter(c => !c.encargadoId || !state.usuarios.find(e=>e.id===c.encargadoId));

    let list;
    if(activeFolder==='todos') list = nomina;
    else if(activeFolder==='sin_asignar') list = unassignedNomina;
    else list = nomina.filter(c => c.encargadoId === activeFolder);

    const q = (searchQuery||'').trim().toLowerCase();
    if(q){
      list = list.filter(c => (c.name||'').toLowerCase().includes(q) || (c.rut||'').toLowerCase().includes(q));
    }

    const enviados = list.filter(c => c.f29Estado === 'enviado').length;
    const { pageItems, totalPages, page } = paginate(list, tablePage);

    const chips = state.usuarios
      .map(e => ({ e, n: nomina.filter(c => c.encargadoId === e.id).length }))
      .filter(({n}) => n > 0)
      .map(({e, n}) => `<div class="filter-chip ${activeFolder===e.id?'active':''}" onclick="setFolder('${e.id}')">${escapeHtml(e.name)} <span class="count">${n}</span></div>`)
      .join('');

    return `
      ${sucursalFilterBar()}
      <div class="filter-bar">
        <div class="filter-chip ${activeFolder==='todos'?'active':''}" onclick="setFolder('todos')">Todos <span class="count">${nomina.length}</span></div>
        ${chips}
        ${unassignedNomina.length ? `<div class="filter-chip ${activeFolder==='sin_asignar'?'active':''}" onclick="setFolder('sin_asignar')">Sin asignar <span class="count">${unassignedNomina.length}</span></div>` : ''}
      </div>
      <div class="main-head">
        <div>
          <h2 class="display">${escapeHtml(currentFolderLabel())}</h2>
          <div class="meta" id="f29Meta">${enviados} de ${list.length} enviado${list.length===1?'':'s'} · solo empresas de la nómina IVA cargada</div>
        </div>
        <input type="text" id="searchBox" placeholder="Buscar por nombre o RUT…" value="${escapeHtml(searchQuery||'')}" oninput="onSearch(this.value)" style="min-width:240px;">
      </div>
      ${list.length ? f29Table(pageItems, true) + paginationControls(page, totalPages) : `<div class="empty-state">
          <div class="display">${q ? 'Sin resultados' : 'Sin clientes en la nómina IVA'}</div>
          <div>${q ? 'Prueba con otro nombre o RUT.' : 'No hay clientes en esta cartera.'}</div>
        </div>`}
    `;
  }

  // Encargado / Asistente: solo su(s) cartera(s) asignada(s).
  const misCarteras = carterasDeUsuario(currentUser);
  const nomina = state.clientes.filter(c => misCarteras.includes(c.encargadoId) && (c.f29Requerido || c.f29CasoEspecialMes === mesActualISO()));
  const q = (searchQuery||'').trim().toLowerCase();
  const list = q ? nomina.filter(c => (c.name||'').toLowerCase().includes(q) || (c.rut||'').toLowerCase().includes(q)) : nomina;
  const enviados = list.filter(c => c.f29Estado === 'enviado').length;
  const { pageItems, totalPages, page } = paginate(list, tablePage);

  return `
    <div class="main-head">
      <div>
        <h2 class="display">Confección Iva</h2>
        <div class="meta" id="f29Meta">${escapeHtml(currentUser.name)} · ${enviados} de ${list.length} enviado${list.length===1?'':'s'} · solo empresas de la nómina IVA cargada</div>
      </div>
      <input type="text" id="searchBox" placeholder="Buscar por nombre o RUT…" value="${escapeHtml(searchQuery||'')}" oninput="onSearch(this.value)" style="min-width:240px;">
    </div>
    ${list.length ? f29Table(pageItems, false) + paginationControls(page, totalPages) : `<div class="empty-state">
        <div class="display">${q ? 'Sin resultados' : 'Sin clientes en la nómina IVA'}</div>
        <div>${q ? 'Prueba con otro nombre o RUT.' : 'El administrador aún no ha cargado la nómina para tu cartera.'}</div>
      </div>`}
  `;
}

// 'no_enviado' (pendiente) → 'guardado' (F-29 confeccionado/guardado, pero
// todavía no se presenta al SII) → 'enviado'. "Guardado" sigue contando
// como pendiente en los contadores de "sin enviar" (Inicio, nómina, etc.):
// solo cambia lo que se ve en el selector de esta tabla.
function f29ClassFor(estado){
  if(estado === 'enviado') return 'f29-ok';
  if(estado === 'guardado') return 'f29-guardado';
  return 'f29-pending';
}

function f29Table(list, showEncargado){
  return `
    ${f29BulkBar()}
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th style="width:34px;"><input type="checkbox" onchange="toggleSelectAllF29(this.checked)" title="Seleccionar todos en esta página"></th>
        <th>Razón social</th><th>Rut</th><th>Clave</th>${showEncargado?'<th>Encargado</th>':''}<th>Nómina</th><th>Estado</th>
      </tr></thead>
      <tbody>
        ${list.map(c => `
          <tr>
            <td><input type="checkbox" class="f29-check" data-id="${c.id}" ${f29Selected.has(c.id)?'checked':''} onchange="onF29CheckChange('${c.id}', this.checked)"></td>
            <td class="client-name">${escapeHtml(c.name)}</td>
            <td class="mono">${escapeHtml(c.rut||'—')}</td>
            <td class="mono">${escapeHtml(c.clave||'—')}</td>
            ${showEncargado ? `<td>${escapeHtml((state.usuarios.find(e=>e.id===c.encargadoId)||{}).name || "Sin asignar")}</td>` : ''}
            <td>${c.f29Requerido ? '<span class="role-badge admin" style="background:var(--gold);">En nómina</span>' : (c.f29CasoEspecialMes===mesActualISO() ? '<span class="role-badge encargado">Caso especial</span>' : '')}</td>
            <td>
              <select class="f29-select ${f29ClassFor(c.f29Estado)}" onchange="this.className = 'f29-select ' + f29ClassFor(this.value); setF29Status('${c.id}', this.value)">
                <option value="no_enviado" ${c.f29Estado!=='enviado' && c.f29Estado!=='guardado'?'selected':''}>No enviado</option>
                <option value="guardado" ${c.f29Estado==='guardado'?'selected':''}>Guardado</option>
                <option value="enviado" ${c.f29Estado==='enviado'?'selected':''}>Enviado</option>
              </select>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
}

async function setF29Status(clientId, value){
  const c = state.clientes.find(c => c.id === clientId);
  if(!c) return;
  const wasEnviado = c.f29Estado === 'enviado';
  c.f29Estado = value;
  await saveClientes();
  // Re-render parcial: en vez de reconstruir toda la tabla, solo se ajusta el
  // contador "X de Y enviados" (id="f29Meta") en +1/-1. El propio <select> ya
  // actualiza su color inline (ver f29Table).
  const nowEnviado = value === 'enviado';
  if(wasEnviado !== nowEnviado){
    const metaEl = document.getElementById('f29Meta');
    // Busca "N de M enviado(s)" en cualquier parte del texto (en la vista de
    // encargado va precedido del nombre, ej. "Stefania Sandoval · N de M…").
    if(metaEl){
      metaEl.textContent = metaEl.textContent.replace(/(\d+)( de \d+ enviado)/,
        (m, num, resto) => (parseInt(num, 10) + (nowEnviado ? 1 : -1)) + resto);
    }
  }
}

async function setRentaStatus(clientId, value){
  const c = state.clientes.find(c => c.id === clientId);

  c.rentaEstado = value;

      metaEl.textContent = metaEl.textContent.replace(/(\d+)( de \d+ enviado)/,
        (m, num, resto) => (parseInt(num, 10) + (nowEnviado ? 1 : -1)) + resto);
    }
  }
}

async function setRentaMontoUF(clientId, value){
  const c = state.clientes.find(c => c.id === clientId);
  if(!c) return;
  const v = parseFloat(value);
  c.rentaMontoUF = isNaN(v) ? null : v;
  await saveClientes();
  // Re-render parcial: solo se recalcula el total, sin reconstruir la tabla.
  const totalEl = document.getElementById('rentaTotalUF');
  if(totalEl){
    const filas = document.querySelectorAll('.renta-check');
    let suma = 0;
    filas.forEach(cb => {
      const cli = state.clientes.find(x => x.id === cb.dataset.id);
      if(cli) suma += (cli.rentaMontoUF||0);
    });
    totalEl.textContent = suma.toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' UF';
  }
}

// Sub-pestaña "Declaración Renta" dentro de Obligaciones Tributarias — mismo

let searchQuery = '';
// Debounce de ~300ms: mientras la persona escribe no se re-renderiza nada;
// recién 300ms después de la última tecla se aplica la búsqueda.
const searchDebouncer = makeDebouncer((v) => {
  searchQuery = v;
  tablePage = 1;
  clearBulkSelections();
  renderApp();
  const box = document.getElementById('searchBox');
  if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}, 300);
function onSearch(v){
  searchDebouncer.run(v);
}

let detailClientId = null;
let detailArchivoCategoria = 'General';

function escapeAttr(str){
  return escapeHtml(str).replace(/"/g, '&quot;');
}

function openClientDetail(id){
  detailClientId = id;
  detailArchivoCategoria = 'General';
  renderModal();
}

function setDetailArchivoCategoria(categoria){
  detailArchivoCategoria = categoria;
  renderModal();
}

function closeClientDetail(){
  detailClientId = null;
  renderModal();
}

function renderModal(){
  const root = document.getElementById('modalRoot');
  if(!root) return;
  if(!detailClientId){ root.innerHTML = ''; return; }
  const c = state.clientes.find(cl => cl.id === detailClientId);
  if(!c){ root.innerHTML = ''; return; }
  const isAdmin = currentUser.isAdmin;
  const encargadoNombre = (state.usuarios.find(e=>e.id===c.encargadoId)||{}).name || "Sin asignar";

  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeClientDetail()">
      <div class="modal-card">
        <div class="modal-head">
          <h3 class="display">Detalle del cliente</h3>
          <button class="switch-btn" onclick="closeClientDetail()">Cerrar</button>
        </div>
        <div class="onboard-grid">
          <label>Razón social

          </label>
          <label>Rut
            <input type="text" id="dt_rut" value="${escapeAttr(c.rut||'')}">
          </label>
          <label>Clave

          </label>

          <label id="dt_rep_wrap" style="display:${c.regimenTributario==='Persona Natural'?'none':'flex'};">Representante(s) legal(es)

          </label>
          <label id="dt_rep_rut_wrap" style="display:${c.regimenTributario==='Persona Natural'?'none':'flex'};">Rut representante legal

          <label>Encargado
            ${isAdmin ? `<select id="dt_encargado">
              <option value="">Sin asignar</option>

            </select>` : (() => {
              const opciones = carterasDeUsuario(currentUser).map(id => state.usuarios.find(u=>u.id===id)).filter(Boolean);

                return `<input type="text" value="${escapeAttr(encargadoNombre)}" disabled><input type="hidden" id="dt_encargado" value="${c.encargadoId||''}">`;
              }
              return `<select id="dt_encargado">${opciones.map(o=>`<option value="${o.id}" ${c.encargadoId===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}</select>`;
            })()}

          ${puedeVerTodasLasCarteras(currentUser) ? `<label>Grupo
            <select id="dt_grupo">
              <option value="" ${!c.grupo?'selected':''}>Sin grupo</option>
              ${gruposExistentes().map(g=>`<option value="${escapeAttr(g)}" ${c.grupo===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
              <option value="__nuevo__">+ Nuevo grupo…</option>
            </select>
          </label>` : ''}
          ${isAdmin ? `<label>Valor servicio mensual (UF)
            <input type="number" id="dt_valor_mensual" placeholder="Ej: 5.5" min="0" step="0.1" value="${c.valorServicioMensual != null ? c.valorServicioMensual : ''}">

          <label style="flex-direction:row;align-items:center;gap:8px;">
            <input type="checkbox" id="dt_renta_requerido" ${c.rentaRequerido?'checked':''} style="width:auto;">
