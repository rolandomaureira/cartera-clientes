async function submitRequerimiento(){
  const tipo = document.getElementById('reqTipo').value;
  const fechaCreacion = document.getElementById('reqFechaCreacion').value || todayISO();
  const dirigidoARaw = document.getElementById('reqDirigidoA').value;
  const dirigidoA = dirigidoARaw ? dirigidoARaw.split(',').filter(Boolean) : [];
  const fechaRespuesta = document.getElementById('reqFechaRespuesta').value || '';
  const estado = document.getElementById('reqEstado').value;
  const descripcion = document.getElementById('reqDescripcion').value.trim();

  if(!dirigidoA.length){ showToast('Selecciona al menos una persona en "Dirigido a".'); return; }
  if(!fechaRespuesta){ showToast('Indica la fecha límite del requerimiento.'); return; }

  const nuevoReq = {
    id: uid('r'),
    tipo, fechaCreacion, dirigidoA, fechaRespuesta, estado, descripcion,
    creadoPor: currentUser.id
  };
  state.requerimientos.push(nuevoReq);
  document.getElementById('reqDescripcion').value = '';
  await saveRequerimientos();
  enviarNotificacionCorreoRequerimiento(nuevoReq); // no bloqueante: si falla el correo, el requerimiento ya quedó guardado igual
  // Si había algún filtro activo (chip de urgencia, "Dirigido a" en una
  // persona puntual, o un rango de fecha límite) de una visita anterior, y
  // el requerimiento recién creado no calza con él, quedaba guardado pero
  // invisible en la lista — se limpian todos para garantizar que lo recién
  // creado siempre se vea.
  requerimientosFiltroUrgencia = 'todos';
  requerimientosFiltroDirigidoA = 'todos';
  requerimientosFiltroFechaDesde = '';
  requerimientosFiltroFechaHasta = '';
  showToast('Requerimiento creado.');
  renderApp();
}

// Aviso "en vivo" fuera de la app: el polling (sondearRequerimientosNuevos)
// solo avisa a quien ya tiene la página abierta. Para que también le llegue
// a alguien que no está navegando en ese momento, se manda un correo — el
// backend lo hace con MailApp (accion 'notificarRequerimiento' en Code.gs).
// Solo se les avisa a quienes tengan correo cargado (ver "Correo" en
// Usuarios y Roles / Configuración); si nadie lo tiene, no se manda nada.
async function enviarNotificacionCorreoRequerimiento(r){
  if(!BACKEND_URL) return;
  const destinatarios = dirigidoAIds(r)
    .map(id => state.usuarios.find(u => u.id === id))
    .filter(u => u && u.email)
    .map(u => ({ email: u.email, nombre: u.name }));
  if(!destinatarios.length) return;
  try{
    await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'notificarRequerimiento',
        token: API_TOKEN,
        destinatarios,
        creadorNombre: currentUser.name,
        tipo: r.tipo,
        descripcion: r.descripcion,
        fechaRespuesta: r.fechaRespuesta,
        urlApp: location.origin + location.pathname,
      })
    });
  }catch(e){
    console.error('No se pudo enviar el correo de aviso del requerimiento:', e);
  }
}

async function updateRequerimientoEstado(id, estado){
  const r = state.requerimientos.find(r => r.id === id);
  if(!r) return;
  r.estado = estado;
  // Fecha en que se marcó Resuelto, para el Reporte Semanal de Contabilidad.
  // Si se revierte el estado, se limpia (ya no cuenta como resuelto).
  r.fechaResolucion = estado === 'Resuelto' ? todayISO() : null;
  await saveRequerimientos();
}

async function derivarRequerimiento(id, destino){
  const r = state.requerimientos.find(r => r.id === id);
  if(!r) return;
  if(destino === 'administracion'){
    r.dirigidoA = ['Kevin Varela','Eduardo Llanos'].map(buscarUsuarioPorNombre).filter(Boolean).map(u=>u.id);
  }else if(destino === 'tax'){
    const tax = state.usuarios.find(u => u.rol === 'TAX');
    r.dirigidoA = tax ? [tax.id] : [];
  }
  await saveRequerimientos();
  renderApp();
  showToast('Requerimiento derivado.');
}

async function removeRequerimiento(id){
  if(!confirm('¿Eliminar este requerimiento? Esta acción no se puede deshacer.')) return;
  state.requerimientos = state.requerimientos.filter(r => r.id !== id);
  await saveRequerimientos();
  renderApp();
  showToast('Requerimiento eliminado.');
}

function formatoCLP(n){
  return Math.round(n).toLocaleString('es-CL');
}

const MESES_NOMBRE = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let ufAnualCache = {}; // año -> serie [{fecha, valor}]
let ufAnualLoading = {}; // año -> bool

async function cargarUFAnual(year){
  ufAnualLoading[year] = true;
  try{
    const res = await fetch(`https://mindicador.cl/api/uf/${year}`, { cache: 'no-store' });
    const data = await res.json();
    ufAnualCache[year] = data.serie || [];
  }catch(e){
    ufAnualCache[year] = [];
  }
  ufAnualLoading[year] = false;
  if(activeTab === 'dashboard' || activeTab === 'facturacion') renderApp();
}

// UF del último día disponible del mes (día calendario final si el mes ya
// terminó; el último día informado hasta ahora si el mes está en curso).
// Dispara en segundo plano la carga del año si aún no está en caché.
// Devuelve { valor, cargando } para poder distinguir "aún cargando el año"
// de "ya cargó, pero no hay dato de UF para ese mes" (ej. meses muy futuros).
function ufDelUltimoDiaDeMes(mes){
  const year = Number(mes.slice(0,4));
  if(!ufAnualCache[year]){
    if(!ufAnualLoading[year]) cargarUFAnual(year);
    return { valor: null, cargando: true };
  }
  const dato = ufPorMes(ufAnualCache[year])[mes];
  return { valor: dato ? dato.valor : null, cargando: false };
}

// Para cada mes del año, se queda con el valor de UF del ÚLTIMO día disponible en ese mes
// (el último día calendario si el mes ya terminó; el último día informado hasta ahora si el mes está en curso).
function ufPorMes(serie){
  const porMes = {};
  serie.forEach(item => {
    const key = item.fecha.slice(0,7); // "YYYY-MM"
    if(!porMes[key] || item.fecha > porMes[key].fecha) porMes[key] = item;
  });
  return porMes;
}

function dashboardFlujoUF(sumaUFMensual){
  const year = new Date().getFullYear();

  if(!ufAnualCache[year] && !ufAnualLoading[year]){
    cargarUFAnual(year); // se dispara en segundo plano; re-renderiza al llegar
  }

  if(!ufAnualCache[year]){
    return `
      <div class="panel" style="margin-bottom:32px;">
        <h3 class="text-sm font-bold text-gray-700 mb-2">Flujo de caja estimado (UF → CLP)</h3>
        <p class="text-sm text-gray-400">Cargando valores históricos de la UF…</p>
      </div>
    `;
  }

  const serie = ufAnualCache[year];
  if(!serie.length){
    return `
      <div class="panel" style="margin-bottom:32px;">
        <h3 class="text-sm font-bold text-gray-700 mb-2">Flujo de caja estimado (UF → CLP)</h3>
        <p class="text-sm text-[var(--danger)]">No se pudo obtener el historial de la UF (revisa tu conexión). <button onclick="cargarUFAnual(${year})" class="text-[var(--teal-dark)] underline">Reintentar</button></p>
      </div>
    `;
  }

  const porMes = ufPorMes(serie);
  const mesActual = new Date().getMonth(); // 0-indexado
  const masReciente = serie.reduce((max, item) => (!max || item.fecha > max.fecha) ? item : max, null);
  const ultimaUFConocida = masReciente ? masReciente.valor : 0;

  let acumulado = 0;
  const filas = [];
  for(let m = 0; m <= 11; m++){
    const key = `${year}-${String(m+1).padStart(2,'0')}`;
    const dato = porMes[key];
    const esProyectado = m > mesActual || !dato;
    const ufMes = dato ? dato.valor : ultimaUFConocida;

    const hayFacturacionReal = state.clientes.some(c => (c.facturacion||{})[key]);
    const facturadoRealUF = hayFacturacionReal ? state.clientes.reduce((s,c) => {
      const rec = (c.facturacion||{})[key];
      return s + (rec && rec.estado === 'Facturado' ? (rec.montoUF||0) : 0);
    }, 0) : sumaUFMensual;

    const clp = facturadoRealUF * ufMes;
    if(!esProyectado) acumulado += clp;
    filas.push({ mes: MESES_NOMBRE[m], ufMes, clp, esProyectado, esReal: hayFacturacionReal });
  }

  // Proyección: acumulado real (meses ya transcurridos) + meses restantes con la última UF conocida
  const acumuladoReal = acumulado;
  const flujoProyectadoRestante = filas.filter(f=>f.esProyectado).reduce((s,f)=>s+f.clp,0);
  const proyeccionAnual = acumuladoReal + flujoProyectadoRestante;

  const maxClp = Math.max(1, ...filas.map(f=>f.clp));

  return `
    <div class="panel" style="margin-bottom:32px;">
      <div class="flex items-center justify-between mb-1">
        <h3 class="text-sm font-bold text-gray-700">Flujo de caja estimado (UF → CLP), ${year}</h3>
      </div>
      <p class="text-xs text-gray-400 mb-5">Cada mes usa la UF de su último día disponible. Los meses aún no transcurridos (en gris) se proyectan con la última UF conocida ($${formatoCLP(ultimaUFConocida)}).</p>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-[#E7ECFA] rounded-xl p-4">
          <div class="text-xs font-semibold uppercase text-[var(--teal-dark)] mb-1">Acumulado real (a la fecha)</div>
          <div class="text-xl font-bold text-[var(--teal-dark)]">$${formatoCLP(acumuladoReal)}</div>
        </div>
        <div class="bg-gray-50 rounded-xl p-4">
          <div class="text-xs font-semibold uppercase text-gray-500 mb-1">Proyectado resto del año</div>
          <div class="text-xl font-bold text-gray-700">$${formatoCLP(flujoProyectadoRestante)}</div>
        </div>
        <div class="bg-green-50 rounded-xl p-4">
          <div class="text-xs font-semibold uppercase text-green-700 mb-1">Proyección total ${year}</div>
          <div class="text-xl font-bold text-green-800">$${formatoCLP(proyeccionAnual)}</div>
        </div>
      </div>

      <div class="space-y-2">
        ${filas.map(f => `
          <div class="flex items-center gap-3">
            <div class="w-20 text-xs text-gray-500">${f.mes}</div>
            <div class="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden">
              <div class="${f.esProyectado?'bg-gray-300':'bg-[var(--teal-dark)]'} h-4 rounded-full" style="width:${(f.clp/maxClp)*100}%"></div>
            </div>
            <div class="w-40 text-xs text-right ${f.esProyectado?'text-gray-400 italic':'text-gray-700'}">$${formatoCLP(f.clp)}${f.esProyectado?' (proy.)':(f.esReal?' (real)':' (estimado)')}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function dashboardContent(){
  const clientes = state.clientes;
  const total = clientes.length;
  const porSucursal = { Concepcion: clientes.filter(c=>c.sucursal==='Concepcion').length, Temuco: clientes.filter(c=>c.sucursal==='Temuco').length };

  // F-29: ahora son 3 estados (ver "Guardado", agregado en Confección Iva) —
  // el dashboard ya no puede resumir solo con un % de enviados.
  const nomina = clientes.filter(c => c.f29Requerido || c.f29CasoEspecialMes === mesActualISO());
  const f29Enviados = nomina.filter(c => c.f29Estado === 'enviado').length;
  const f29Guardados = nomina.filter(c => c.f29Estado === 'guardado').length;
  const f29Pendientes = nomina.length - f29Enviados - f29Guardados;
  const pctEnviado = nomina.length ? Math.round((f29Enviados/nomina.length)*100) : 0;

  const conValor = clientes.filter(c => typeof c.valorServicioMensual === 'number' && c.valorServicioMensual > 0);
  const sumaUFMensual = conValor.reduce((s,c) => s + c.valorServicioMensual, 0);
  const sumaUFConcepcion = conValor.filter(c=>c.sucursal==='Concepcion').reduce((s,c)=>s+c.valorServicioMensual,0);
  const sumaUFTemuco = conValor.filter(c=>c.sucursal==='Temuco').reduce((s,c)=>s+c.valorServicioMensual,0);

  const anioActual = String(new Date().getFullYear());
  const extraordinariosUF = clientes.reduce((s,c) => {
    const delAnio = (c.serviciosExtraordinarios||[]).filter(se => (se.fecha||'').startsWith(anioActual));
    return s + delAnio.reduce((s2,se) => s2 + (se.montoUF||0), 0);
  }, 0);

  // Requerimientos y Archivos: firma completa de todo lo que se ha ido
  // agregando a la app (notificaciones, archivos permanentes/temporales),
  // resumido acá para que el Administrador tenga panorama sin entrar a
  // cada sección por separado.
  const reqPendientes = state.requerimientos.filter(r => r.estado !== 'Resuelto');
  const hoyISO = todayISO();
  const reqVencidos = reqPendientes.filter(r => r.fechaRespuesta && r.fechaRespuesta < hoyISO);

  let totalArchivos = 0, archivosVencidos = 0;
  clientes.forEach(c => (c.archivos||[]).forEach(a => {
    totalArchivos++;
    if(a.tipo === 'temporal' && a.fechaVencimiento && a.fechaVencimiento < hoyISO) archivosVencidos++;
  }));

  const regimenCounts = {};
  clientes.forEach(c => {
    const r = c.regimenTributario || 'Sin registrar';
    regimenCounts[r] = (regimenCounts[r]||0) + 1;
  });
  const regimenOrdenado = Object.entries(regimenCounts).sort((a,b)=>b[1]-a[1]);
  const maxRegimen = Math.max(1, ...regimenOrdenado.map(([,n])=>n));

  const porEncargado = state.usuarios
    .map(u => ({ u, n: clientes.filter(c=>c.encargadoId===u.id).length }))
    .filter(({n}) => n > 0)
    .sort((a,b)=>b.n-a.n);
  const maxEncargado = Math.max(1, ...porEncargado.map(({n})=>n));

  // Clientes por grupo (columna "Grupo" de la restructuración de carteras,
  // ej. Concepción 2026): agrupa empresas relacionadas. Se omite el "Sin
  // grupo" del ranking — con cientos de clientes sin ese dato todavía, una
  // barra gigante ahí no aporta nada — y solo se muestra el panel si hay
  // al menos un grupo cargado.
  const grupoCounts = {};
  clientes.forEach(c => { if(c.grupo) grupoCounts[c.grupo] = (grupoCounts[c.grupo]||0) + 1; });
  const grupoOrdenado = Object.entries(grupoCounts).sort((a,b)=>b[1]-a[1]).slice(0, 12);
  const maxGrupo = Math.max(1, ...grupoOrdenado.map(([,n])=>n));
  const clientesConGrupo = clientes.filter(c => c.grupo).length;

  const sinRegimen = clientes.filter(c => !c.regimenTributario).length;
  const sinRepresentante = clientes.filter(c => !c.representanteLegal).length;
  const sinActividad = clientes.filter(c => !c.actividadEconomica && !c.codigoActividadEconomica).length;
  const sinValor = total - conValor.length;
  const sinGrupo = total - clientesConGrupo;

  const card = (label, value, sub, icon, color) => `
    <div class="stat">
      <div class="chip chip-${color}">${ICONS_DOC[icon]}</div>
      <div>
        <div class="v" style="font-size:1.25rem;">${value}</div>
        <div class="l">${label}</div>
        ${sub ? `<div style="font-size:0.72rem;margin-top:2px;color:#9a9689;">${sub}</div>` : ''}
      </div>
    </div>
  `;

  return `
    <div class="max-w-5xl">
      <div class="main-head">
        <div>
          <h2 class="display">Dashboard</h2>
          <div class="meta">Panorama general de la cartera para análisis financiero.</div>
        </div>
      </div>

      <div class="stats">
        ${card('Total clientes', total, `Concepción ${porSucursal.Concepcion} · Temuco ${porSucursal.Temuco}`, 'users', 'teal')}
        ${card('Nómina IVA vigente', nomina.length, `${f29Enviados} enviados · ${f29Guardados} guardados · ${f29Pendientes} pendientes (${pctEnviado}% enviado)`, 'percent', 'orange')}
        ${card('Cartera mensual (UF)', `${sumaUFMensual.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1})} UF`, `Concepción ${sumaUFConcepcion.toFixed(1)} UF · Temuco ${sumaUFTemuco.toFixed(1)} UF`, 'trend', 'green')}
        ${card(`Servicios extraordinarios ${anioActual}`, `${extraordinariosUF.toFixed(1)} UF`, 'Trabajos puntuales (fuera del mensual)', 'star', 'purple')}
        ${card('Requerimientos pendientes', reqPendientes.length, reqVencidos.length ? `${reqVencidos.length} vencidos` : 'Ninguno vencido', 'clipboard', 'blue')}
        ${card('Archivos cargados', totalArchivos, archivosVencidos ? `${archivosVencidos} temporales vencidos` : 'Sin temporales vencidos', 'doc', 'cyan')}
        ${card('Sin valor mensual cargado', sinValor, sinValor ? 'Dato clave para el flujo' : 'Todos con valor cargado', 'info', 'amber')}
        ${card('Sin grupo asignado', sinGrupo, clientesConGrupo ? `${clientesConGrupo} con grupo cargado` : 'Ningún cliente con grupo todavía', 'info', 'slate')}
      </div>

      ${dashboardFlujoUF(sumaUFMensual)}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="panel">
          <h3 class="text-sm font-bold text-gray-700 mb-4">Clientes por régimen tributario</h3>
          ${regimenOrdenado.map(([r,n]) => `
            <div class="mb-3">
              <div class="flex justify-between text-xs text-gray-600 mb-1"><span>${escapeHtml(r)}</span><span>${n}</span></div>
              <div class="w-full bg-gray-100 rounded-full h-2"><div class="bg-[var(--teal-dark)] h-2 rounded-full" style="width:${(n/maxRegimen)*100}%"></div></div>
            </div>
          `).join('')}
        </div>
        <div class="panel">
          <h3 class="text-sm font-bold text-gray-700 mb-4">Clientes por encargado</h3>
          ${porEncargado.map(({u,n}) => `
            <div class="mb-3">
              <div class="flex justify-between text-xs text-gray-600 mb-1"><span>${escapeHtml(u.name)} <span class="text-gray-400">(${escapeHtml(u.sucursal||'—')})</span></span><span>${n}</span></div>
              <div class="w-full bg-gray-100 rounded-full h-2"><div class="bg-green-500 h-2 rounded-full" style="width:${(n/maxEncargado)*100}%"></div></div>
            </div>
          `).join('')}
        </div>
      </div>

      ${grupoOrdenado.length ? `
      <div class="panel" style="margin-bottom:32px;">
        <h3 class="text-sm font-bold text-gray-700 mb-1">Clientes por grupo</h3>
        <p class="text-xs text-gray-400 mb-4">Top ${grupoOrdenado.length} grupos con más empresas (columna "Grupo" de la restructuración de carteras).</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
          ${grupoOrdenado.map(([g,n]) => `
            <div class="mb-3">
              <div class="flex justify-between text-xs text-gray-600 mb-1"><span>${escapeHtml(g)}</span><span>${n}</span></div>
              <div class="w-full bg-gray-100 rounded-full h-2"><div class="bg-purple-500 h-2 rounded-full" style="width:${(n/maxGrupo)*100}%"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      <div class="panel">
        <h3 class="text-sm font-bold text-gray-700 mb-4">Completitud de datos</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
          <div class="text-gray-600">Sin régimen tributario: <span class="font-bold text-gray-800">${sinRegimen}</span></div>
          <div class="text-gray-600">Sin representante legal: <span class="font-bold text-gray-800">${sinRepresentante}</span></div>
          <div class="text-gray-600">Sin actividad económica: <span class="font-bold text-gray-800">${sinActividad}</span></div>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- FACTURACIÓN (Tailwind) ---------------- */
const FACTURA_ESTADOS = ['Pendiente', 'Facturado', 'No Aplica'];
const FACTURA_ESTADO_CLASS = { 'Facturado': 'chip-green', 'Pendiente': 'chip-amber', 'No Aplica': 'chip-slate' };
function facturaEstadoClass(estado){
  return estadoPillClass(FACTURA_ESTADO_CLASS, estado, 'Pendiente');
}

function mesesDesdeEnero2026(){
  const meses = [];
  const anioInicio = 2026;
  const anioFin = Math.max(new Date().getFullYear(), 2026);
  for(let y = anioInicio; y <= anioFin; y++){
    for(let m = 1; m <= 12; m++) meses.push(`${y}-${String(m).padStart(2,'0')}`);
  }
  return meses;
}

function mesLabel(mes){
  const [y,m] = mes.split('-').map(Number);
  return `${MESES_NOMBRE[m-1]} ${y}`;
}

function facturaDisplay(c, mes){
  const rec = (c.facturacion || {})[mes];
  return rec ? rec : { estado: 'Pendiente', montoUF: (c.valorServicioMensual || 0) };
}

async function setFacturaEstado(clienteId, mes, estado){
  const c = state.clientes.find(c => c.id === clienteId);
  if(!c) return;
  if(!c.facturacion) c.facturacion = {};
  const actual = c.facturacion[mes] || { montoUF: c.valorServicioMensual || 0 };
  c.facturacion[mes] = { montoUF: actual.montoUF, estado };
  await saveClientes();
  refreshFacturacionSummary(mes);
}

async function setFacturaMonto(clienteId, mes, valor){
  const c = state.clientes.find(c => c.id === clienteId);
  if(!c) return;
  if(!c.facturacion) c.facturacion = {};
  const actual = c.facturacion[mes] || { estado: 'Pendiente' };
  const monto = parseFloat(valor);
  c.facturacion[mes] = { estado: actual.estado, montoUF: isNaN(monto) ? 0 : monto };
  await saveClientes();
  refreshFacturacionSummary(mes);
}

// Re-render parcial de Facturación: recalcula los totales (operación barata,
// son sumas sobre arreglos) y solo actualiza las tarjetas de resumen y las
// barras por encargado — sin reconstruir la tabla completa de clientes.
function refreshFacturacionSummary(mes){
  if(activeTab !== 'facturacion') return;
  const isAdmin = currentUser.isAdmin;
  const base = isAdmin ? clientesEnSucursalActiva() : state.clientes.filter(c => carterasDeUsuario(currentUser).includes(c.encargadoId));
  const resumenGlobal = resumenFacturacion(base, mes);

  const elEsperado = document.getElementById('facEsperado');
  const elFacturado = document.getElementById('facFacturado');
  const elPct = document.getElementById('facPct');
  const elFacturadoCLP = document.getElementById('facFacturadoCLP');
  const elFacturadoCLPNota = document.getElementById('facFacturadoCLPNota');
  if(elEsperado) elEsperado.textContent = `${resumenGlobal.esperado.toFixed(1)} UF`;
  if(elFacturado) elFacturado.textContent = `${resumenGlobal.facturado.toFixed(1)} UF`;
  if(elPct) elPct.textContent = `${resumenGlobal.pct}%`;
  if(elFacturadoCLP) elFacturadoCLP.textContent = resumenGlobal.ufMes ? '$'+formatoCLP(resumenGlobal.facturadoCLP) : (resumenGlobal.ufCargando ? 'Cargando UF…' : '—');
  if(elFacturadoCLPNota) elFacturadoCLPNota.textContent = resumenGlobal.ufMes ? `UF del ${mesLabel(mes)}: $${formatoCLP(resumenGlobal.ufMes)}` : (resumenGlobal.ufCargando ? 'Obteniendo UF del mes…' : 'UF no disponible para este mes');

  if(!isAdmin) return;
  state.usuarios.forEach(u => {
    const clientesEnc = base.filter(c => c.encargadoId === u.id);
    if(!clientesEnc.length) return;
    const r = resumenFacturacion(clientesEnc, mes);
    const rSucursal = resumenFacturacion(clientesDeSucursal(u.sucursal === 'Ambas' ? 'Concepcion' : u.sucursal), mes);
    const numsEl = document.getElementById(`facEncNums_${u.id}`);
    const barEl = document.getElementById(`facEncBar_${u.id}`);
    if(numsEl) numsEl.innerHTML = `${r.facturado.toFixed(1)} / ${r.esperado.toFixed(1)} UF · <b>${r.pct}%</b> <span class="text-gray-400">(sucursal: ${rSucursal.pct}%)</span>`;
    if(barEl){
      barEl.style.width = Math.min(r.pct, 100) + '%';
      barEl.className = (r.pct >= rSucursal.pct ? 'bg-green-500' : 'bg-amber-500') + ' h-2 rounded-full';
    }
  });
}

function clientesDeSucursal(sucursal){
  return state.clientes.filter(c => c.sucursal === sucursal);
}

function resumenFacturacion(listaClientes, mes){
  let esperado = 0, facturado = 0, facturadoCLP = 0;
  // UF del último día disponible del mes facturado, usada solo para expresar
  // en pesos lo que ya está marcado como "Facturado" (no lo "Esperado").
  const { valor: ufMes, cargando: ufCargando } = ufDelUltimoDiaDeMes(mes);
  listaClientes.forEach(c => {
    const f = facturaDisplay(c, mes);
    if(f.estado === 'No Aplica') return;
    esperado += (f.montoUF || 0);
    if(f.estado === 'Facturado'){
      facturado += (f.montoUF || 0);
      if(ufMes) facturadoCLP += (f.montoUF || 0) * ufMes;
    }
  });
  const pct = esperado > 0 ? Math.round((facturado/esperado)*100) : 0;
  return { esperado, facturado, pct, facturadoCLP, ufMes, ufCargando };
}

// Vista consolidada de cobranza: contacto, forma/fecha de pago pactada y el

  const ultimoRegistro = c => {

  };

  return `

// ==================== REMUNERACIONES (cartera separada) ====================
// Segunda línea de negocio, completamente aparte de la cartera contable:
// otra colección (clientesRemuneraciones, ver COLECCIONES_ESTADO/
// ID_POR_COLECCION_MERGE), porque un cliente de remuneraciones no necesita
// régimen tributario, F-29 ni las claves cifradas de un cliente contable.
// Reutiliza sí mismo mecanismo de guardado por fusión, y reutiliza
// facturaDisplay/resumenFacturacion (genéricos: solo esperan
// .facturacion/.valorServicioMensual en el objeto, no específicamente
// state.clientes) para la vista de Facturación de esta cartera.
let facturacionRemuneracionesMes = null;

function carteraRemuneracionesContent(){
  const verTodo = puedeVerTodasLasCarterasRemuneraciones(currentUser);
  const misCarteras = carterasDeUsuarioRemuneraciones(currentUser);
  const lista = verTodo ? (state.clientesRemuneraciones||[]) : (state.clientesRemuneraciones||[]).filter(c => misCarteras.includes(c.encargadoId));
  const usuariosOrdenados = [...state.usuarios].sort((a,b) => a.name.localeCompare(b.name, 'es'));

  const filaEditable = c => `
    <tr>
      <td class="client-name">${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.rut)}</td>
      <td>
        <select onchange="guardarCampoClienteRemuneraciones('${c.id}', 'encargadoId', this.value || null)">
          <option value="">Sin asignar</option>
          ${usuariosOrdenados.map(u=>`<option value="${u.id}" ${c.encargadoId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
        </select>
      </td>
      <td><input type="number" min="0" step="0.1" value="${c.valorServicioMensual!=null?c.valorServicioMensual:''}" style="max-width:80px;" onchange="guardarCampoClienteRemuneraciones('${c.id}', 'valorServicioMensual', parseFloat(this.value)||0)"></td>
      <td><input type="text" value="${escapeAttr(c.telefonoContacto||'')}" onchange="guardarCampoClienteRemuneraciones('${c.id}', 'telefonoContacto', this.value.trim())"></td>
      <td><input type="text" value="${escapeAttr(c.correoContacto||'')}" onchange="guardarCampoClienteRemuneraciones('${c.id}', 'correoContacto', this.value.trim())"></td>
      <td class="row-actions"><button class="btn danger small" onclick="eliminarClienteRemuneraciones('${c.id}')">Eliminar</button></td>
    </tr>
  `;

  const filaSoloLectura = c => {
    const enc = state.usuarios.find(u=>u.id===c.encargadoId);
    return `
    <tr>
      <td class="client-name">${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.rut)}</td>
      <td>${enc?escapeHtml(enc.name):'Sin asignar'}</td>
      <td>${c.valorServicioMensual!=null?c.valorServicioMensual:'—'}</td>
      <td>${escapeHtml(c.telefonoContacto||'—')}</td>
      <td>${escapeHtml(c.correoContacto||'—')}</td>
    </tr>
  `;
  };

  return `
    <div class="main-head">
      <div>
        <h2 class="display">Cartera de Remuneraciones</h2>
        <div class="meta">${lista.length} cliente${lista.length===1?'':'s'} · ${verTodo ? 'todos los clientes de Remuneraciones' : 'tu cartera de Remuneraciones'}</div>
      </div>
    </div>
    ${verTodo ? `
    <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:18px;">
      <h4 style="margin:0 0 10px;font-size:14px;">Incorporar cliente de Remuneraciones</h4>
      <div class="onboard-grid">
        <label>Razón social
          <input type="text" id="cr_name" placeholder="Nombre o razón social">
        </label>
        <label>Rut
          <input type="text" id="cr_rut" placeholder="12.345.678-9">
        </label>
        <label>Encargado
          <select id="cr_encargado">
            <option value="">Sin asignar</option>
            ${usuariosOrdenados.map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('')}
          </select>
        </label>
        <label>Valor servicio mensual (UF)
          <input type="number" id="cr_valor_mensual" min="0" step="0.1" placeholder="Ej: 3">
        </label>
        <label>Teléfono de contacto
          <input type="text" id="cr_telefono">
        </label>
        <label>Correo de contacto
          <input type="text" id="cr_correo">
        </label>
      </div>
      <button class="btn" onclick="submitIncorporarClienteRemuneraciones()">Incorporar cliente</button>
    </div>
    ` : ''}
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Cliente</th><th>Rut</th><th>Encargado</th><th>Valor (UF)</th><th>Teléfono</th><th>Correo</th>${verTodo?'<th></th>':''}</tr></thead>
      <tbody>
        ${lista.length ? lista.map(verTodo ? filaEditable : filaSoloLectura).join('') : `<tr><td colspan="${verTodo?7:6}" style="padding:32px;text-align:center;color:#8a8879;">Sin clientes de Remuneraciones.</td></tr>`}
      </tbody>
    </table>
    </div>
  `;
}

async function submitIncorporarClienteRemuneraciones(){
  const name = document.getElementById('cr_name').value.trim();
  const rut = document.getElementById('cr_rut').value.trim();
  const encargadoId = document.getElementById('cr_encargado').value || null;
  const valorParsed = parseFloat(document.getElementById('cr_valor_mensual').value);
  const telefonoContacto = document.getElementById('cr_telefono').value.trim();
  const correoContacto = document.getElementById('cr_correo').value.trim();
  if(!name) return showToast('Escribe la razón social del cliente.');
  if(!rut) return showToast('Escribe el RUT del cliente.');
  if(!state.clientesRemuneraciones) state.clientesRemuneraciones = [];
  state.clientesRemuneraciones.push({
    id: uid('cr'), name, rut, encargadoId,
    valorServicioMensual: isNaN(valorParsed) ? null : valorParsed,
    telefonoContacto, correoContacto, facturacion: {}
  });
  await saveClientesRemuneraciones();
  showToast('Cliente de Remuneraciones incorporado.');
  renderApp();
}

async function guardarCampoClienteRemuneraciones(id, campo, valor){
  const c = (state.clientesRemuneraciones||[]).find(x => x.id === id);
  if(!c) return;
  c[campo] = valor;
  await saveClientesRemuneraciones();
}

async function eliminarClienteRemuneraciones(id){
  if(!confirm('¿Eliminar este cliente de Remuneraciones? Esta acción no se puede deshacer.')) return;
  state.clientesRemuneraciones = (state.clientesRemuneraciones||[]).filter(c => c.id !== id);
  await saveClientesRemuneraciones();
  renderApp();
  showToast('Cliente de Remuneraciones eliminado.');
}

async function guardarFichaRRHH(id){
  const f = (state.rrhhFichas||[]).find(x => x.id === id);
  if(!f) return;
  const nombre = document.getElementById('rh_dt_nombre').value.trim();
  if(!nombre) return showToast('El nombre no puede quedar vacío.');
  f.nombre = nombre;
  f.rut = document.getElementById('rh_dt_rut').value.trim();
  f.cargo = document.getElementById('rh_dt_cargo').value.trim();
  f.fechaIngreso = document.getElementById('rh_dt_fecha_ingreso').value || null;
  f.jefaturaId = document.getElementById('rh_dt_jefatura').value || null;
  f.telefono = document.getElementById('rh_dt_telefono').value.trim();
  f.correo = document.getElementById('rh_dt_correo').value.trim();
  await saveRRHHFichas();
  showToast('Ficha guardada.');
  cerrarFichaRRHH();
  renderApp();
}

async function guardarDiasVacacionesRRHH(id){
  const f = (state.rrhhFichas||[]).find(x => x.id === id);
  if(!f) return;
  const dias = parseFloat(document.getElementById('rh_dt_dias_disponibles').value);
  f.diasVacacionesDisponibles = isNaN(dias) ? 0 : dias;
  await saveRRHHFichas();
  showToast('Días de vacaciones actualizados.');
  renderFichaRRHHModal();
}

// Bitácora de vacaciones/licencias: solo agrega registros nuevos, nunca
// edita ni borra los ya guardados — mismo criterio que historialCobranza.
async function agregarVacacionRRHH(id){
  const f = (state.rrhhFichas||[]).find(x => x.id === id);
  if(!f) return;
  const tipo = document.getElementById('rh_vac_tipo').value;
  const fechaInicio = document.getElementById('rh_vac_fecha_inicio').value;
  const fechaFin = document.getElementById('rh_vac_fecha_fin').value;
  const diasInput = document.getElementById('rh_vac_dias').value;
  const dias = parseFloat(diasInput);
  const nota = document.getElementById('rh_vac_nota').value.trim();
  if(!fechaInicio) return showToast('Selecciona la fecha de inicio.');
  if(!f.historialVacaciones) f.historialVacaciones = [];
  f.historialVacaciones.push({ id: uid('vac'), tipo, fechaInicio, fechaFin, dias: isNaN(dias) ? null : dias, nota, creadoPor: currentUser.id });
  await saveRRHHFichas();
  showToast('Registro agregado.');
  renderFichaRRHHModal();
}

async function subirArchivoRRHH(fichaId){
  const input = document.getElementById('rh_archivo_input');
  const file = input && input.files && input.files[0];
  if(!file){ showToast('Elige un archivo primero.'); return; }
  const LIMITE_BYTES = 5 * 1024 * 1024;
  if(file.size > LIMITE_BYTES){ showToast('El archivo es muy grande (máx. 5 MB).'); return; }

  const f = (state.rrhhFichas||[]).find(x => x.id === fichaId);
  if(!f) return;

  const categoriaDestino = fichaRRHHCategoria;
  const boton = document.getElementById('rh_archivo_btn');
  if(boton){ boton.disabled = true; boton.textContent = 'Subiendo…'; }
  try{
    const contenidoBase64 = await leerArchivoComoBase64(file);
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'subirArchivo',
        token: API_TOKEN,
        clienteId: 'rrhh',
        clienteNombre: f.nombre,
        nombreArchivo: file.name,
        mimeType: file.type || 'application/octet-stream',
        contenidoBase64
      })
    });
    const data = await res.json();
    if(!data || !data.ok){ showToast('No se pudo subir el documento.'); return; }

    if(!f.archivos) f.archivos = [];
    f.archivos.push({
      nombre: data.nombre || file.name, url: data.url, driveFileId: data.id,
      fecha: todayISO(), subidoPor: currentUser.name, categoria: categoriaDestino
    });
    await saveRRHHFichas();
    renderFichaRRHHModal();
    showToast('Documento subido.');
  }catch(err){
    console.error('Error al subir documento de RR.HH.:', err);
    showToast('Error al subir el documento.');
  }finally{
    if(boton){ boton.disabled = false; boton.textContent = `Subir a "${categoriaDestino}"`; }
  }
}

async function quitarArchivoRRHH(fichaId, index){
  const f = (state.rrhhFichas||[]).find(x => x.id === fichaId);
  if(!f || !f.archivos) return;
  f.archivos.splice(index, 1);
  await saveRRHHFichas();
  renderFichaRRHHModal();
}

function facturacionRemuneracionesContent(){

  const mes = facturacionRemuneracionesMes;
  const meses = mesesDesdeEnero2026();
  const verTodo = puedeVerTodasLasCarterasRemuneraciones(currentUser);
  const misCarteras = carterasDeUsuarioRemuneraciones(currentUser);
  const base = verTodo ? (state.clientesRemuneraciones||[]) : (state.clientesRemuneraciones||[]).filter(c => misCarteras.includes(c.encargadoId));
  const resumen = resumenFacturacion(base, mes);

  return `
    <div class="main-head">
      <div>
        <h2 class="display">Facturación · Remuneraciones</h2>
        <div class="meta">${verTodo ? 'Estado de facturación por cliente, mes a mes.' : 'Estado de facturación de tu cartera este mes (solo lectura).'}</div>
      </div>
      <select onchange="facturacionRemuneracionesMes=this.value; renderApp();">
        ${meses.map(m => `<option value="${m}" ${m===mes?'selected':''}>${mesLabel(m)}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin:16px 0;">
      <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 18px;min-width:150px;">
        <div style="font-size:11px;color:#8a8879;text-transform:uppercase;">Esperado</div>
        <div style="font-size:20px;font-weight:700;">${resumen.esperado.toFixed(1)} UF</div>
      </div>
      <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 18px;min-width:150px;">
        <div style="font-size:11px;color:#8a8879;text-transform:uppercase;">Facturado</div>
        <div style="font-size:20px;font-weight:700;color:#2e7d32;">${resumen.facturado.toFixed(1)} UF</div>
      </div>
      <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 18px;min-width:150px;">
        <div style="font-size:11px;color:#8a8879;text-transform:uppercase;">% Facturado</div>
        <div style="font-size:20px;font-weight:700;">${resumen.pct}%</div>
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Cliente</th><th>Encargado</th><th>Valor (UF)</th><th>Estado</th></tr></thead>
      <tbody>
        ${base.length ? base.map(c => {
          const enc = state.usuarios.find(u=>u.id===c.encargadoId);
          const f = facturaDisplay(c, mes);
          return `
          <tr>
            <td class="client-name">${escapeHtml(c.name)}</td>
            <td>${enc?escapeHtml(enc.name):'Sin asignar'}</td>
            <td>${verTodo ? `<input type="number" min="0" step="0.1" value="${f.montoUF}" style="max-width:80px;" onchange="setFacturaMontoRemuneraciones('${c.id}', '${mes}', this.value)">` : f.montoUF}</td>
            <td>${verTodo ? `
              <select onchange="setFacturaEstadoRemuneraciones('${c.id}', '${mes}', this.value)">
                ${['Pendiente','Facturado','No Aplica'].map(e=>`<option value="${e}" ${f.estado===e?'selected':''}>${e}</option>`).join('')}
              </select>
            ` : escapeHtml(f.estado)}</td>
          </tr>
        `;
        }).join('') : `<tr><td colspan="4" style="padding:32px;text-align:center;color:#8a8879;">Sin clientes de Remuneraciones.</td></tr>`}
      </tbody>
    </table>
    </div>
  `;
}

async function setFacturaEstadoRemuneraciones(clienteId, mes, estado){
  const c = (state.clientesRemuneraciones||[]).find(c => c.id === clienteId);
  if(!c) return;
  if(!c.facturacion) c.facturacion = {};
  const actual = c.facturacion[mes] || { montoUF: c.valorServicioMensual || 0 };
  c.facturacion[mes] = { montoUF: actual.montoUF, estado };
  await saveClientesRemuneraciones();
  renderApp();
}

async function setFacturaMontoRemuneraciones(clienteId, mes, valor){
  const c = (state.clientesRemuneraciones||[]).find(c => c.id === clienteId);
  if(!c) return;
  if(!c.facturacion) c.facturacion = {};
  const actual = c.facturacion[mes] || { estado: 'Pendiente' };
  const monto = parseFloat(valor);
  c.facturacion[mes] = { estado: actual.estado, montoUF: isNaN(monto) ? 0 : monto };
  await saveClientesRemuneraciones();
  renderApp();
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtUF(n){ n = Number(n) || 0; return n.toLocaleString("es-CL", {minimumFractionDigits:0, maximumFractionDigits:2}); }
function fmtCLP(n){ return "$" + Math.round(Number(n)||0).toLocaleString("es-CL"); }
function parseNum(v){
  if(typeof v === "number") return v;
  const s = String(v||"").trim().replace(/\./g,"").replace(",",".");
  return parseFloat(s) || 0;
}

function cfg(){ return state.configDocumentos; }
function logoSrc(){
  const l = cfg().logo;
  if(l === "none") return "";
  return l || DEFAULT_LOGO_DOCUMENTOS;
}
function fmtFechaDoc(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  const f = cfg().formatoFecha;
  if(f === "largo") return `${Number(d)} de ${MESES_DOC[Number(m)-1]} de ${y}`;
  if(f === "dd/mm/aaaa") return `${d}/${m}/${y}`;
  return `${d}-${m}-${y}`;
}
function padNum(n){ return String(n).padStart(Number(cfg().digitos)||3, "0"); }
function numeroDoc(doc){ return `${cfg().prefijo} ${padNum(doc.numero)}/${doc.anio}`; }
function nombreArchivoDoc(doc){
  const ref = (doc.ref || "").replace(/[\\/:*?"<>|]/g, "").trim();
  if(doc.tipo === "propuesta") return `P-${padNum(doc.numero)} ${ref}`.trim();
  return `MEMO N° ${padNum(doc.numero)}-${doc.anio} - ${ref}`.trim();
}

function firmanteDocById(id){ return (state.firmantesDocumentos||[]).find(f=>f.id===id); }
function firmanteDocByNombre(nombre){ return (state.firmantesDocumentos||[]).find(f=>f.nombre.toLowerCase()===String(nombre).toLowerCase()); }
// Adaptador: arma, a partir de un cliente REAL de state.clientes, la misma
// forma de objeto {nombre, grupo, saludo, email, ejecutivo, sociedades,
// socios} que este motor espera — sin duplicar la lista de clientes. grupo
// y correo reutilizan campos que el cliente ya tiene (c.grupo, ver Dashboard
// "Clientes por grupo"; c.correoContacto, ver Ficha de Cobranza); ejecutivo
// se resuelve desde c.encargadoId; solo saludo/sociedades/socios son campos
// nuevos que se agregan al cliente (ver sección "Memos y Propuestas" en
// renderModal).
function clienteDocById(id){
  if(!id) return null;
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return null;
  const encargado = state.usuarios.find(u=>u.id===c.encargadoId);
  return {
    id: c.id, nombre: c.name, grupo: c.grupo || '', saludo: c.saludo || '',
    email: c.correoContacto || '', ejecutivo: encargado ? encargado.name : '',
    sociedades: c.sociedades || [], socios: c.socios || [],
  };
}
function textoPara(cli){ return cli ? cli.nombre + (cli.grupo ? " | " + cli.grupo : "") : ""; }
function saludoCliente(cli){
  if(!cli) return "";
  if(cli.saludo) return cli.saludo;
  const first = (cli.nombre||"").trim().split(/\s+/)[0];
  return first ? `Estimado(a) ${first}:` : "Estimado cliente:";
}
function ciudadesDoc(){
  const c = (cfg().oficinas||[]).map(o=>o.ciudad).filter(Boolean);
  if(c.length <= 1) return c.join("");
  return c.slice(0,-1).join(", ") + " y " + c[c.length-1];
}

function ctxForDoc(fecha, cli){
  const y = Number(fecha.slice(0,4)), m = Number(fecha.slice(5,7));
  return { cli, anio:y, at: m <= 4 ? y : y+1, soc: cli ? cli.sociedades.slice() : [], socios: cli ? cli.socios.slice() : [] };
}
function honItemsDoc(list){ return (list.length ? list : ["[SOCIEDAD]"]).map(n=>({detalle:n.replace(/^Sociedad\s+/i,""), uf:0})); }
function buildModuloDoc(key, ctx){ return MODULOS_DOC.find(m=>m.key===key).build(ctx); }

// ---------- Render de texto / documento ----------
function fmtInlineDoc(text){
  let s = escapeHtml(text);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g, '<a href="$1">$1</a>');
  s = s.replace(/\[([^\]\n]{1,80})\]/g, '<mark class="ph">[$1]</mark>');
  return s.replace(/\n/g, "<br>");
}
function romanDoc(n){
  const map = [[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
  let r = ""; map.forEach(([v,s])=>{ while(n>=v){ r+=s; n-=v; } }); return r;
}
function labelNivel1Doc(n, fmt){
  if(fmt === "A.") return String.fromCharCode(64+n) + ".";
  if(fmt === "1.") return n + ".";
  if(fmt === "I.") return romanDoc(n).toUpperCase() + ".";
  if(fmt === "none") return "";
  return String.fromCharCode(96+n) + ")";
}
function headingLabelsDoc(doc){
  const labels = [];
  let n1 = 0, n2 = 0;
  doc.bloques.forEach((b,i)=>{
    if(b.t !== "h") return;
    if(b.nivel === 1){
      n2 = 0;
      if(b.num){ n1++; labels[i] = labelNivel1Doc(n1, doc.numeracion); }
    } else if(b.num){
      n2++; labels[i] = romanDoc(n2) + ")";
    }
  });
  return labels;
}
function isNumericCellDoc(c){ return /^[\s$+\-–]*[\d.,]+\s*%?$/.test(c.replace(/\*\*/g,"")) && /\d/.test(c); }
function renderTablaDoc(b){
  const rows = String(b.texto||"").split("\n").filter(l=>l.trim()!=="").map(l=>l.split("|").map(c=>c.trim()));
  if(!rows.length) return "";
  const cols = Math.max(...rows.map(r=>r.length));
  let html = '<table class="dt">';
  rows.forEach((r,ri)=>{
    const header = b.encabezado && ri === 0;
    html += "<tr>";
    for(let ci=0; ci<cols; ci++){
      const c = r[ci] || "";
      const tag = header ? "th" : "td";
      const cls = (!header && ci>0 && isNumericCellDoc(c)) ? ' class="n"' : "";
      html += `<${tag}${cls}>${fmtInlineDoc(c)}</${tag}>`;
    }
    html += "</tr>";
  });
  return '<div class="tbl-wrap">' + html + "</table></div>";
}
function renderULDoc(b){
  const lines = String(b.texto||"").split("\n").filter(l=>l.trim()!=="");
  let html = "<ul>", openSub = false, openLi = false;
  lines.forEach(l=>{
    const sub = /^\s*-\s+/.test(l);
    const txt = l.replace(/^\s*[-•]\s*/, "");
    if(sub && openLi){
      if(!openSub){ html += "<ul>"; openSub = true; }
      html += `<li>${fmtInlineDoc(txt)}</li>`;
    } else {
      if(openSub){ html += "</ul>"; openSub = false; }
      if(openLi) html += "</li>";
      html += `<li>${fmtInlineDoc(txt)}`;
      openLi = true;
    }
  });
  if(openSub) html += "</ul>";
  if(openLi) html += "</li>";
  return html + "</ul>";
}
function totalGrupoDoc(g){ return g.items.reduce((s,it)=>s + parseNum(it.uf), 0); }
function renderHonDoc(b){
  const clp = b.mostrarCLP && parseNum(b.valorUF) > 0;
  const vuf = parseNum(b.valorUF);
  let html = `<table class="dt"><thead><tr><th>Actividad</th><th>Periodicidad</th><th class="n">Honorarios UF</th>${clp?'<th class="n">Equivalente $</th>':""}</tr></thead><tbody>`;
  (b.grupos||[]).forEach(g=>{
    const tot = totalGrupoDoc(g);
    html += `<tr class="grp"><td colspan="${clp?4:3}">${fmtInlineDoc(g.actividad)}:</td></tr>`;
    g.items.forEach(it=>{
      html += `<tr><td class="ind">• ${fmtInlineDoc(it.detalle)}</td><td>${escapeHtml(g.periodicidad)}</td><td class="n">${fmtUF(parseNum(it.uf))}</td>${clp?`<td class="n">${fmtCLP(parseNum(it.uf)*vuf)}</td>`:""}</tr>`;
    });
    if(g.items.length > 1 || (b.grupos||[]).length > 1){
      html += `<tr class="tot"><td>Total</td><td>${escapeHtml(g.periodicidad)}</td><td class="n">${fmtUF(tot)}</td>${clp?`<td class="n">${fmtCLP(tot*vuf)}</td>`:""}</tr>`;
    }
  });
  html += "</tbody></table>";
  html = '<div class="tbl-wrap">' + html + "</div>";
  if(clp) html += `<p style="font-size:9pt;color:#555">Equivalente en pesos referencial, calculado con UF de $${vuf.toLocaleString("es-CL",{minimumFractionDigits:2, maximumFractionDigits:2})}.</p>`;
  return html;
}
function renderAcepDoc(b, doc){
  const hon = doc.bloques.find(x=>x.t==="hon");
  let html = '<div class="acep">';
  html += `<p style="text-align:left">${fmtInlineDoc(b.destinatario||"")}</p>`;
  html += "<p>De nuestra consideración:</p>";
  html += "<p>La presente tiene por objeto informarles que estamos de acuerdo con los términos de la presente proposición de trabajo y honorarios, los que se resumen a continuación:</p>";
  if(hon && hon.grupos && hon.grupos.length){
    html += '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Actividad</th><th>Periodicidad</th><th class="n">Honorarios UF</th></tr></thead><tbody>';
    hon.grupos.forEach(g=>{
      html += `<tr><td>${fmtInlineDoc(g.actividad)}</td><td>${escapeHtml(g.periodicidad)}</td><td class="n">${fmtUF(totalGrupoDoc(g))}</td></tr>`;
    });
    html += "</tbody></table></div>";
  } else {
    html += '<p><mark class="ph">[Agrega un bloque de Honorarios para generar el resumen]</mark></p>';
  }
  if(b.facturacion){
    html += "<p><strong>Datos para facturación y cobranza:</strong></p>";
    html += '<table class="form">' + ["Razón social","RUT","Nombre de contacto","Dirección de correo","Cargo"].map(k=>`<tr><td class="k">${k}</td><td>:&nbsp;</td><td class="v">&nbsp;</td></tr>`).join("") + "</table>";
  }
  html += '<div class="firmas"><div><div class="lin"></div>Firma aceptación</div><div><div class="lin"></div>Nombre y RUT</div><div><div class="lin"></div>Cargo y fecha</div></div>';
  return html + "</div>";
}
function footerHtmlDoc(){
  const c = cfg();
  const parts = (c.oficinas||[]).filter(o=>o.ciudad||o.direccion).map(o=>
    `${escapeHtml(o.direccion)}${o.ciudad?", "+escapeHtml(o.ciudad):""}${o.telefono?" · "+escapeHtml(o.telefono):""}`);
  const extra = [c.contacto, c.web].filter(Boolean).map(escapeHtml);
  return `<strong>${escapeHtml(c.firmaLegal)}</strong><br>${parts.join(" &nbsp;&#8226;&nbsp; ")}${extra.length?"<br>"+extra.join(" &nbsp;&#8226;&nbsp; "):""}`;
}
function renderDocBody(doc){
  const c = cfg();
  const labels = headingLabelsDoc(doc);
  const logo = logoSrc();
  let h = "";
  h += '<table class="lh"><tr>';
  if(logo) h += `<td class="lh-logo"><img src="${escapeHtml(logo)}" alt="${escapeHtml(c.firmaCorta)}"></td>`;
  h += `<td class="lh-name"><div class="legal">${escapeHtml(c.firmaLegal)}</div><div class="tag">Contabilidad &middot; Tributaria &middot; Remuneraciones</div></td>`;
  h += `<td class="lh-num"><table class="badge"><tr><td>${escapeHtml(numeroDoc(doc))}</td></tr></table></td>`;
  h += "</tr></table>";
  h += '<hr class="lh-rule"><hr class="lh-rule2">';
  h += '<table class="d-meta">';
  const meta = [["De", doc.de], [doc.labelPara || "Para", doc.para], ["Ref.", doc.ref], ["Fecha", fmtFechaDoc(doc.fecha)]];
  meta.forEach(([k,v])=>{ h += `<tr><td class="k">${escapeHtml(k)}</td><td class="s">:</td><td>${fmtInlineDoc(v||"")}</td></tr>`; });
  h += "</table>";
  if(doc.saludo) h += `<p style="margin-top:6px">${fmtInlineDoc(doc.saludo)}</p>`;
  doc.bloques.forEach((b,i)=>{
    switch(b.t){
      case "p": if(String(b.texto||"").trim()) h += `<p>${fmtInlineDoc(b.texto)}</p>`; break;
      case "h":
        if(b.nivel === 1) h += `<h4 class="h1">${labels[i]?labels[i]+" ":""}${fmtInlineDoc(b.texto)}</h4>`;
        else h += `<h5 class="h2">${labels[i]?labels[i]+" ":""}${fmtInlineDoc(b.texto)}</h5>`;
        break;
      case "ul": h += renderULDoc(b); break;
      case "tabla": h += renderTablaDoc(b); break;
      case "nota": h += `<div class="nota"><p>${b.titulo?`<strong>${fmtInlineDoc(b.titulo)}:</strong> `:""}${fmtInlineDoc(b.texto||"")}</p></div>`; break;
      case "salto": h += '<div class="salto"><span>salto de página</span></div>'; break;
      case "soc": {
        const items = String(b.texto||"").split("\n").map(s=>s.trim()).filter(Boolean);
        h += '<ol class="soc">' + items.map(s=>`<li>${fmtInlineDoc(s)}</li>`).join("") + "</ol>";
        break;
      }
      case "hon": h += renderHonDoc(b); break;
      case "acep": h += renderAcepDoc(b, doc); break;
    }
  });
  const f = doc.firmanteId ? firmanteDocById(doc.firmanteId) : null;
  const fn = f ? f.nombre : doc.firmaNombre;
  const fc = f ? f.cargo : doc.firmaCargo;
  if(doc.despedida || fn){
    h += '<div class="firma">';
    if(doc.despedida) h += `<p style="margin-bottom:0">${fmtInlineDoc(doc.despedida)}</p>`;
    if(fn){
      h += '<div class="esp"></div><div class="lin"></div>';
      h += `<strong>${escapeHtml(fn)}</strong>`;
      if(fc) h += `<br>${escapeHtml(fc)}`;
      h += `<br>${escapeHtml(c.firmaLegal)}`;
      if(f && f.email) h += `<br>${escapeHtml(f.email)}`;
    }
    h += "</div>";
  }
  if(doc.iniciales) h += `<div class="iniciales">${escapeHtml(doc.iniciales)}</div>`;
  return h;
}

// ---------- Validaciones (avisos, no bloquean el guardado) ----------
function validarDoc(doc){
  const w = [];
  const textos = [doc.de, doc.para, doc.ref, doc.saludo, doc.despedida];
  doc.bloques.forEach(b=>{
    if(b.texto) textos.push(b.texto);
    if(b.titulo) textos.push(b.titulo);
    if(b.t === "hon") (b.grupos||[]).forEach(g=>{ textos.push(g.actividad); g.items.forEach(it=>textos.push(it.detalle)); });
  });
  const ph = new Set();
  textos.forEach(t=>{ (String(t||"").match(/\[[^\]\n]{1,80}\]/g)||[]).forEach(m=>ph.add(m)); });
  if(ph.size) w.push(`Hay ${ph.size} dato(s) pendiente(s) entre corchetes: ${[...ph].slice(0,6).join(", ")}${ph.size>6?"…":""}`);
  if(!String(doc.ref||"").trim()) w.push("Falta la referencia (Ref.).");
  if(!String(doc.para||"").trim()) w.push("Falta el destinatario.");
  const dup = (state.documentosTrabajo||[]).find(d=>d.id!==doc.id && d.tipo===doc.tipo && Number(d.anio)===Number(doc.anio) && Number(d.numero)===Number(doc.numero));
  if(dup) w.push(`El N° ${padNum(doc.numero)}/${doc.anio} ya está usado por otro ${doc.tipo} ("${dup.ref}").`);
  const soc = doc.bloques.find(b=>b.t==="soc");
  const hons = doc.bloques.filter(b=>b.t==="hon");
  if(doc.tipo === "propuesta"){
    if(!hons.length) w.push("La propuesta no tiene tabla de honorarios.");
    if(!doc.bloques.some(b=>b.t==="acep")) w.push("La propuesta no incluye carta de aceptación.");
  }
  if(soc && hons.length){
    const norm = s=>String(s).toLowerCase().replace(/^sociedad\s+/,"").replace(/\s+(limitada|ltda\.?|spa|s\.a\.)$/,"").replace(/[^a-z0-9áéíóúñ ]/g,"").trim();
    const detalles = [];
    hons.forEach(h=>(h.grupos||[]).forEach(g=>g.items.forEach(it=>detalles.push(norm(it.detalle)))));
    const faltan = String(soc.texto||"").split("\n").map(s=>s.trim()).filter(Boolean)
      .filter(s=>!/^\[.*\]$/.test(s))
      .filter(s=>{ const n = norm(s); return n && !detalles.some(d=>d && (d.includes(n) || n.includes(d))); });
    if(faltan.length) w.push(`Sociedades listadas sin honorario asignado: ${faltan.join("; ")}.`);
  }
  hons.forEach(h=>(h.grupos||[]).forEach(g=>{
    const ceros = g.items.filter(it=>parseNum(it.uf)===0).map(it=>it.detalle);
    if(ceros.length) w.push(`"${g.actividad}": ${ceros.length} ítem(s) con 0 UF (${ceros.slice(0,3).join(", ")}${ceros.length>3?"…":""}).`);
  }));
  return w;
}

function honMensualDoc(d){
  let t = 0;
  d.bloques.filter(b=>b.t==="hon").forEach(h=>(h.grupos||[]).forEach(g=>{ if(g.periodicidad==="Mensual") t += totalGrupoDoc(g); }));

}

async function crearDocumentoDesdePlantilla(plantillaKey){
  const p = PLANTILLAS_DOC.find(x=>x.key===plantillaKey);
  if(!p) return;
  const fecha = document.getElementById('docNuevoFecha').value || todayISO();
  const clienteId = document.getElementById('docNuevoCliente').value || null;
  const cli = clienteDocById(clienteId);
  const ctx = ctxForDoc(fecha, cli);
  const contenido = p.build(ctx);
  await crearYAbrirDocumento(p.tipo, contenido, fecha, clienteId, cli);
}

async function crearDocumentoDesdePlantillaUsuario(plantillaUsuarioId){
  const p = (state.plantillasUsuarioDocumentos||[]).find(x=>x.id===plantillaUsuarioId);
  if(!p) return;
  const fecha = document.getElementById('docNuevoFecha').value || todayISO();
  const clienteId = document.getElementById('docNuevoCliente').value || null;
  const cli = clienteDocById(clienteId);
  const contenido = clone(p.contenido);
  if(cli){
    contenido.para = textoPara(cli);
    contenido.saludo = saludoCliente(cli);
    contenido.bloques.forEach(b=>{ if(b.t==='soc' && cli.sociedades.length) b.texto = cli.sociedades.join('\n'); });
  }
  await crearYAbrirDocumento(p.tipo, contenido, fecha, clienteId, cli);
}

// Crea el documento pidiendo el N° al backend (bajo lock — ver
// asignarCorrelativo en Code.gs) y recién entonces lo agrega a
// state.documentosTrabajo. Si el backend falla, no se crea nada con un
// número inventado (mismo criterio que el control de Propuestas original).
async function crearYAbrirDocumento(tipo, contenido, fecha, clienteId, cli){
  const anio = Number(fecha.slice(0,4));
  showToast('Asignando número…');
  const numero = await obtenerCorrelativo(tipo, anio);
  if(numero == null){ showToast('No se pudo asignar el número. Intenta de nuevo.'); return; }
  const firm = contenido.firmanteId ? firmanteDocById(contenido.firmanteId) : (contenido.firmante ? firmanteDocByNombre(contenido.firmante) : null);
  const deDefault = tipo === 'propuesta'
    ? (firm ? `Sr. ${firm.nombre} / ${cfg().firmaCorta}` : cfg().firmaCorta)
    : (contenido.deFirmante && firm ? firm.nombre : cfg().firmaCorta);
  const doc = {
    id: uid('doc'), tipo, numero, anio, fecha, estado: 'Borrador',
    clienteId: clienteId || null,
    de: contenido.de !== undefined ? contenido.de : deDefault,
    labelPara: tipo === 'propuesta' ? 'Dirigida a' : 'Para',
    para: contenido.para !== undefined ? contenido.para : (cli ? textoPara(cli) : '[DESTINATARIO]'),
    ref: contenido.ref || '',
    saludo: contenido.saludo !== undefined ? contenido.saludo : (cli ? saludoCliente(cli) : (tipo==='propuesta' ? 'Estimado(a) [NOMBRE]:' : 'Estimado cliente:')),
    numeracion: contenido.numeracion || 'a)',
    bloques: clone(contenido.bloques || []),
    despedida: contenido.despedida !== undefined ? contenido.despedida : 'Atentamente,',
    firmanteId: firm ? firm.id : '',
    firmaNombre: firm ? '' : (contenido.firmaNombre || ''),
    firmaCargo: firm ? '' : (contenido.firmaCargo || ''),
    iniciales: contenido.iniciales || '', notas: '',
    creadoPor: currentUser.id, creado: new Date().toISOString(), modificado: new Date().toISOString(),
  };
  if(!state.documentosTrabajo) state.documentosTrabajo = [];
  state.documentosTrabajo.push(doc);
  await saveDocumentosTrabajo();
  showToast(`${tipo==='propuesta'?'Propuesta':'Memo'} N° ${numero}/${anio} creado.`);
  abrirEditorDocumento(doc.id);
}

async function eliminarPlantillaUsuario(id){
  if(!confirm('¿Eliminar esta plantilla guardada?')) return;
  state.plantillasUsuarioDocumentos = (state.plantillasUsuarioDocumentos||[]).filter(p=>p.id!==id);
  await saveConfig();
  renderApp();
}

async function cambiarEstadoDocumento(id, estado){
  const d = (state.documentosTrabajo||[]).find(x=>x.id===id);
  if(!d) return;
  d.estado = estado;
  d.modificado = new Date().toISOString();
  await saveDocumentosTrabajo();
  renderApp();
}

async function duplicarDocumento(id){
  const src = (state.documentosTrabajo||[]).find(d=>d.id===id);
  if(!src) return;
  const fecha = todayISO();
  const anio = Number(fecha.slice(0,4));
  showToast('Asignando número…');
  const numero = await obtenerCorrelativo(src.tipo, anio);
  if(numero == null){ showToast('No se pudo asignar el número. Intenta de nuevo.'); return; }
  const copy = clone(src);
  copy.id = uid('doc'); copy.fecha = fecha; copy.anio = anio; copy.numero = numero; copy.estado = 'Borrador';
  copy.creadoPor = currentUser.id; copy.creado = copy.modificado = new Date().toISOString();
  state.documentosTrabajo.push(copy);
  await saveDocumentosTrabajo();
  showToast(`Duplicado como N° ${numero}/${anio}.`);
  abrirEditorDocumento(copy.id);
}

async function eliminarDocumento(id){
  const d = (state.documentosTrabajo||[]).find(x=>x.id===id);
  if(!d) return;
  if(!confirm(`¿Eliminar ${numeroDoc(d)} — "${d.ref}"? Esta acción no se puede deshacer.`)) return;
  state.documentosTrabajo = state.documentosTrabajo.filter(x=>x.id!==id);
  if(docEditorId === id) docEditorId = null;
  await saveDocumentosTrabajo();
  renderApp();
  showToast('Documento eliminado.');
}

function abrirEditorDocumento(id){
  docEditorId = id;
  bloqueEnfocadoDoc = -1;
  setTab('documentos-trabajo-editor');
}

const TIPO_LABEL_BLOQUE = {p:'Párrafo', h:'Título', ul:'Viñetas', tabla:'Tabla', nota:'Nota destacada', salto:'Salto de página', soc:'Sociedades', hon:'Honorarios', acep:'Carta de aceptación'};

function bloqueEditorHtml(b, i){
  const opt = (value, label, sel) => `<option value="${escapeAttr(value)}" ${String(value)===String(sel)?'selected':''}>${escapeHtml(label)}</option>`;
  let body = '';
  switch(b.t){
    case 'p':
      body = `<textarea onchange="actualizarBloqueDoc(${i}, 'texto', this.value)" rows="${Math.min(8, Math.max(2, Math.ceil(String(b.texto||'').length/70)))}">${escapeHtml(b.texto)}</textarea>`;
      break;
    case 'h':
      body = `<input type="text" value="${escapeAttr(b.texto)}" onchange="actualizarBloqueDoc(${i}, 'texto', this.value)">
        <div class="inl"><label>Nivel <select onchange="actualizarBloqueNivelDoc(${i}, this.value)">${opt(1,'Título (a, b, c)',b.nivel)}${opt(2,'Subtítulo (i, ii, iii)',b.nivel)}</select></label>
        <label><input type="checkbox" ${b.num?'checked':''} onchange="actualizarBloqueDoc(${i}, 'num', this.checked)"> Numerar</label></div>`;
      break;
    case 'ul':
      body = `<textarea onchange="actualizarBloqueDoc(${i}, 'texto', this.value)" rows="${Math.min(12, Math.max(3, String(b.texto||'').split('\n').length+1))}">${escapeHtml(b.texto)}</textarea>
        <div class="hint">Una viñeta por línea. Empieza con "- " para una sub-viñeta.</div>`;
      break;
    case 'tabla':
      body = `<textarea onchange="actualizarBloqueDoc(${i}, 'texto', this.value)" rows="${Math.min(14, Math.max(3, String(b.texto||'').split('\n').length+1))}" style="font-family:'IBM Plex Mono',monospace;font-size:0.8rem;white-space:pre;">${escapeHtml(b.texto)}</textarea>
        <div class="inl"><label><input type="checkbox" ${b.encabezado?'checked':''} onchange="actualizarBloqueDoc(${i}, 'encabezado', this.checked)"> Primera fila es encabezado</label></div>
        <div class="hint">Una fila por línea; separa columnas con | (barra vertical).</div>`;
      break;
    case 'nota':
      body = `<input type="text" value="${escapeAttr(b.titulo)}" placeholder="Título (ej. Ten presente)" style="margin-bottom:6px;" onchange="actualizarBloqueDoc(${i}, 'titulo', this.value)">
        <textarea onchange="actualizarBloqueDoc(${i}, 'texto', this.value)" rows="3">${escapeHtml(b.texto)}</textarea>`;
      break;
    case 'salto':
      body = `<div class="hint" style="margin:0;">Al imprimir, el contenido siguiente comienza en una hoja nueva.</div>`;
      break;
    case 'soc':
      body = `<textarea onchange="actualizarBloqueDoc(${i}, 'texto', this.value)" rows="${Math.min(10, Math.max(3, String(b.texto||'').split('\n').length+1))}">${escapeHtml(b.texto)}</textarea>
        <div class="inl"><button class="btn ghost small" type="button" onclick="cargarSociedadesEnBloque(${i})">Cargar sociedades del cliente</button><span class="hint" style="margin:0;">Una por línea, se numeran solas.</span></div>`;
      break;
    case 'hon':
      body = (b.grupos||[]).map((g,gi)=>`
        <div class="hon-group">
          <div style="display:flex;gap:6px;">
            <input type="text" value="${escapeAttr(g.actividad)}" placeholder="Actividad" style="flex:1;" onchange="honActualizarCampo(${i}, ${gi}, 'actividad', this.value)">
            <select onchange="honActualizarCampo(${i}, ${gi}, 'periodicidad', this.value)">${PERIODICIDADES_DOC.map(p=>opt(p,p,g.periodicidad)).join('')}</select>
            <button class="btn small danger" type="button" onclick="honEliminarGrupo(${i}, ${gi})" title="Eliminar grupo">✕</button>
          </div>
          <table>${g.items.map((it,ii)=>`
            <tr><td><input type="text" value="${escapeAttr(it.detalle)}" onchange="honActualizarItem(${i}, ${gi}, ${ii}, 'detalle', this.value)"></td>
            <td class="uf" style="width:80px;"><input type="text" inputmode="decimal" value="${escapeAttr(String(it.uf).replace('.',','))}" onchange="honActualizarItem(${i}, ${gi}, ${ii}, 'uf', this.value)"></td>
            <td style="width:28px;"><button class="btn ghost small" type="button" onclick="honEliminarItem(${i}, ${gi}, ${ii})" title="Quitar">✕</button></td></tr>`).join('')}
          </table>
          <div class="inl" style="justify-content:space-between;">
            <span><button class="btn ghost small" type="button" onclick="honAgregarItem(${i}, ${gi})">+ Ítem</button>
            <button class="btn ghost small" type="button" onclick="honCargarSociedades(${i}, ${gi})">Cargar sociedades</button>
            <button class="btn ghost small" type="button" onclick="honCargarSocios(${i}, ${gi})">Cargar socios</button></span>
            <span class="hon-sub">Total: <strong>${fmtUF(totalGrupoDoc(g))}</strong> UF</span>
          </div>
        </div>`).join('') + `
        <div class="inl" style="justify-content:space-between;">
          <button class="btn ghost small" type="button" onclick="honAgregarGrupo(${i})">+ Grupo de honorarios</button>
          <span><label><input type="checkbox" ${b.mostrarCLP?'checked':''} onchange="actualizarBloqueDoc(${i}, 'mostrarCLP', this.checked)"> Mostrar equivalente en $</label>
          UF $ <input type="text" value="${escapeAttr(b.valorUF)}" style="width:100px;" placeholder="39.727,96" onchange="actualizarBloqueDoc(${i}, 'valorUF', this.value)">
          <button class="btn ghost small" type="button" onclick="honConsultarUF(${i})" title="Consulta el valor de la UF de hoy en mindicador.cl">UF hoy</button></span>
        </div>`;
      break;
    case 'acep':
      body = `<label class="hint" style="margin:0;">Destinatario</label><textarea rows="4" onchange="actualizarBloqueDoc(${i}, 'destinatario', this.value)">${escapeHtml(b.destinatario)}</textarea>
        <div class="inl"><label><input type="checkbox" ${b.facturacion?'checked':''} onchange="actualizarBloqueDoc(${i}, 'facturacion', this.checked)"> Incluir datos para facturación y cobranza</label></div>
        <div class="hint">El resumen de honorarios se genera automáticamente desde el bloque de Honorarios.</div>`;
      break;
  }
  let tipo = TIPO_LABEL_BLOQUE[b.t] || b.t;
  if(b.t === 'h' && b.nivel === 2) tipo = 'Subtítulo';
  return `<div class="block ${i===bloqueEnfocadoDoc?'focus':''}" onfocusin="bloqueEnfocadoDoc=${i};" onclick="bloqueEnfocadoDoc=${i};">
    <div class="block-head"><span class="tipo">${tipo}</span>
      <span class="ctl"><button onclick="moverBloqueDoc(${i},-1)" title="Subir" type="button">↑</button><button onclick="moverBloqueDoc(${i},1)" title="Bajar" type="button">↓</button><button onclick="duplicarBloqueDoc(${i})" title="Duplicar" type="button">⧉</button><button onclick="eliminarBloqueDoc(${i})" class="del" title="Eliminar" type="button">✕</button></span>
    </div>${body}</div>`;
}

async function tocarDocEnEdicion(){
  await saveDocumentosTrabajo();
  renderApp();
}

function actualizarMetaDoc(campo, valor){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  doc[campo] = valor;
  if(campo === 'fecha' && valor){
    const y = Number(valor.slice(0,4));
    if(y) doc.anio = y;
  }
  doc.modificado = new Date().toISOString();
  tocarDocEnEdicion();
}

function agregarBloqueDoc(tipo){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  const cli = clienteDocById(doc.clienteId);
  const nb = {
    p: ()=>PDoc(''), h1: ()=>H1Doc(''), h2: ()=>H2Doc(''), ul: ()=>ULDoc(['']),
    tabla: ()=>TABLADoc([['Columna 1','Columna 2'],['','']]),
    nota: ()=>NOTADoc('Ten presente',''), salto: ()=>SALTODoc(),
    soc: ()=>SOCDoc(cli ? cli.sociedades : ['']),
    hon: ()=>HONDoc([{actividad:'[SERVICIO]', periodicidad:'Mensual', items:honItemsDoc(cli ? cli.sociedades : [])}]),
    acep: ()=>ACEPDoc(),
  }[tipo]();
  const at = bloqueEnfocadoDoc >= 0 && bloqueEnfocadoDoc < doc.bloques.length ? bloqueEnfocadoDoc + 1 : doc.bloques.length;
  doc.bloques.splice(at, 0, nb);
  bloqueEnfocadoDoc = at;
  doc.modificado = new Date().toISOString();
  tocarDocEnEdicion();
}

function insertarModuloDoc(){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  const key = document.getElementById('docModSelect').value;
  const ctx = ctxForDoc(doc.fecha || todayISO(), clienteDocById(doc.clienteId));
  const nuevos = buildModuloDoc(key, ctx);
  const at = bloqueEnfocadoDoc >= 0 && bloqueEnfocadoDoc < doc.bloques.length ? bloqueEnfocadoDoc + 1 : doc.bloques.length;
  doc.bloques.splice(at, 0, ...nuevos);
  bloqueEnfocadoDoc = at + nuevos.length - 1;
  doc.modificado = new Date().toISOString();
  tocarDocEnEdicion();
}

function moverBloqueDoc(i, dir){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  const j = i + dir;
  if(j < 0 || j >= doc.bloques.length) return;
  [doc.bloques[i], doc.bloques[j]] = [doc.bloques[j], doc.bloques[i]];
  bloqueEnfocadoDoc = j;
  tocarDocEnEdicion();
}
function duplicarBloqueDoc(i){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  doc.bloques.splice(i+1, 0, clone(doc.bloques[i]));
  bloqueEnfocadoDoc = i+1;
  tocarDocEnEdicion();
}
function eliminarBloqueDoc(i){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  const b = doc.bloques[i];
  if(['hon','acep','tabla'].includes(b.t) || String(b.texto||'').length > 120){ if(!confirm('¿Eliminar este bloque?')) return; }
  doc.bloques.splice(i,1);
  bloqueEnfocadoDoc = Math.min(i, doc.bloques.length-1);
  tocarDocEnEdicion();
}
function actualizarBloqueDoc(i, campo, valor){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  doc.bloques[i][campo] = valor;
  tocarDocEnEdicion();
}
function actualizarBloqueNivelDoc(i, valor){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  doc.bloques[i].nivel = Number(valor);
  tocarDocEnEdicion();
}
function cargarSociedadesEnBloque(i){
  const doc = currentDocEnEdicion();
  const cli = clienteDocById(doc.clienteId);
  if(!cli || !cli.sociedades.length){ showToast('El documento no tiene un cliente con sociedades registradas.'); return; }
  doc.bloques[i].texto = cli.sociedades.join('\n');
  tocarDocEnEdicion();
}
function aplicarDatosClienteDoc(){
  const doc = currentDocEnEdicion();
  const cli = clienteDocById(doc.clienteId);
  if(!cli){ showToast('Selecciona primero un cliente.'); return; }
  doc.para = textoPara(cli);
  doc.saludo = saludoCliente(cli);
  doc.bloques.forEach(b=>{ if(b.t==='soc' && cli.sociedades.length) b.texto = cli.sociedades.join('\n'); });
  tocarDocEnEdicion();
}

// ---- Honorarios ----
function honAgregarGrupo(i){
  const doc = currentDocEnEdicion();
  doc.bloques[i].grupos.push({actividad:'[SERVICIO]', periodicidad:'Mensual', items:[{detalle:'', uf:0}]});
  tocarDocEnEdicion();
}
function honEliminarGrupo(i, gi){
  if(!confirm('¿Eliminar este grupo de honorarios?')) return;
  const doc = currentDocEnEdicion();
  doc.bloques[i].grupos.splice(gi,1);
  tocarDocEnEdicion();
}
function honAgregarItem(i, gi){
  const doc = currentDocEnEdicion();
  doc.bloques[i].grupos[gi].items.push({detalle:'', uf:0});
  tocarDocEnEdicion();
}
function honEliminarItem(i, gi, ii){
  const doc = currentDocEnEdicion();
  doc.bloques[i].grupos[gi].items.splice(ii,1);
  tocarDocEnEdicion();
}
function honActualizarCampo(i, gi, campo, valor){
  const doc = currentDocEnEdicion();
  doc.bloques[i].grupos[gi][campo] = valor;
  tocarDocEnEdicion();
}
function honActualizarItem(i, gi, ii, campo, valor){
  const doc = currentDocEnEdicion();
  doc.bloques[i].grupos[gi].items[ii][campo] = campo === 'uf' ? parseNum(valor) : valor;
  tocarDocEnEdicion();
}
function honCargarSociedades(i, gi){
  const doc = currentDocEnEdicion();
  const cli = clienteDocById(doc.clienteId);
  if(!cli || !cli.sociedades.length){ showToast('El documento no tiene un cliente con sociedades registradas.'); return; }
  const g = doc.bloques[i].grupos[gi];
  g.items = cli.sociedades.map(n=>{ const prev = g.items.find(it=>it.detalle===n.replace(/^Sociedad\s+/i,'')); return {detalle:n.replace(/^Sociedad\s+/i,''), uf:prev?prev.uf:0}; });
  tocarDocEnEdicion();
}
function honCargarSocios(i, gi){
  const doc = currentDocEnEdicion();
  const cli = clienteDocById(doc.clienteId);
  if(!cli || !cli.socios.length){ showToast('El documento no tiene un cliente con socios registrados.'); return; }
  doc.bloques[i].grupos[gi].items = cli.socios.map(n=>({detalle:n, uf:0}));
  tocarDocEnEdicion();
}
async function honConsultarUF(i){
  try{
    const r = await fetch('https://mindicador.cl/api/uf');
    const j = await r.json();
    const v = j.serie && j.serie[0] && j.serie[0].valor;
    if(!v) throw new Error('sin datos');
    const doc = currentDocEnEdicion();
    doc.bloques[i].valorUF = v.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
    doc.bloques[i].mostrarCLP = true;
    tocarDocEnEdicion();
  }catch(err){
    showToast('No se pudo obtener la UF (sin conexión o servicio no disponible). Ingrésala manualmente.');
  }
}

// ---- Imprimir / exportar ----
function imprimirDocumentoActual(){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  const w = validarDoc(doc).filter(x=>x.startsWith('Hay '));
  if(w.length && !confirm(w[0] + '\n\n¿Imprimir de todas formas?')) return;
  const prevTitle = document.title;
  document.title = nombreArchivoDoc(doc);
  document.body.classList.add('imprimiendo-doc');
  window.print();
  document.body.classList.remove('imprimiendo-doc');
  document.title = prevTitle;
  if(doc.estado === 'Borrador'){
    const siguiente = doc.tipo==='propuesta' ? 'Enviada' : 'Emitido';
    if(confirm(`¿Marcar el documento como "${siguiente}"?`)){
      doc.estado = siguiente;
      tocarDocEnEdicion();
    }
  }
}

function descargarWordDocumentoActual(){
  const doc = currentDocEnEdicion();
  if(!doc) return;
  const css = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${escapeHtml(nombreArchivoDoc(doc))}</title>
    <style>${css}
    body{background:white;font-family:Calibri,Arial,sans-serif;font-size:11pt;}
    .paper{box-shadow:none;padding:0;max-width:none;}
    .salto{page-break-before:always;border:none;} .salto span{display:none;}
    @page{size:21cm 29.7cm;margin:2cm 2cm 2cm 2cm;}
    </style></head><body><div class="paper" style="--doc:${escapeAttr(cfg().colorDoc)};">${renderDocBody(doc)}<div class="doc-footer">${footerHtmlDoc()}</div></div></body></html>`;
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivoDoc(doc) + '.doc';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function abrirModalGuardarPlantilla(){
  const doc = currentDocEnEdicion();
  const modal = document.getElementById('modalPlantillaDoc');
  if(!modal) return;
  document.getElementById('plNombreDoc').value = doc.ref || '';
  document.getElementById('plDescDoc').value = '';
  modal.classList.add('open');
}
function cerrarModalGuardarPlantilla(){
  const modal = document.getElementById('modalPlantillaDoc');
  if(modal) modal.classList.remove('open');
}
async function guardarPlantillaUsuario(){
  const nombre = document.getElementById('plNombreDoc').value.trim();
  if(!nombre){ showToast('Ingresa un nombre para la plantilla.'); return; }
  const doc = currentDocEnEdicion();
  const c = clone(doc);
  ['id','numero','anio','fecha','estado','creado','modificado','notas','creadoPor'].forEach(k=>delete c[k]);
  if(!state.plantillasUsuarioDocumentos) state.plantillasUsuarioDocumentos = [];
  state.plantillasUsuarioDocumentos.push({id:uid('pld'), nombre, desc:document.getElementById('plDescDoc').value.trim(), tipo:doc.tipo, contenido:c});
  await saveConfig();
  cerrarModalGuardarPlantilla();
  showToast('Plantilla guardada. Aparece en "Documentos → Mis plantillas".');
  renderApp();
}

  r.onload = async ev => {

function onFacturaCheckChange(id, checked){
  if(checked) facturaSelected.add(id); else facturaSelected.delete(id);

  if(bar) bar.style.display = facturaSelected.size ? 'flex' : 'none';
  const cnt = document.getElementById('facSelCount');
  if(cnt) cnt.textContent = facturaSelected.size;
}

function toggleSelectAllFactura(checked){
  document.querySelectorAll('.fac-check').forEach(cb => {
    cb.checked = checked;
    if(checked) facturaSelected.add(cb.dataset.id); else facturaSelected.delete(cb.dataset.id);
  });
  const bar = document.getElementById('facBulkBar');
  if(bar) bar.style.display = facturaSelected.size ? 'flex' : 'none';
  const cnt = document.getElementById('facSelCount');
  if(cnt) cnt.textContent = facturaSelected.size;

async function aplicarAccionMasivaFacturacion(mes){
  if(!facturaSelected.size) return;
  const estadoSel = document.getElementById('facBulkEstado');
  const estado = estadoSel ? estadoSel.value : 'Facturado';
  facturaSelected.forEach(id => {
    const c = state.clientes.find(c => c.id === id);
    if(!c) return;
    if(!c.facturacion) c.facturacion = {};
    const actual = c.facturacion[mes] || { montoUF: c.valorServicioMensual || 0 };
    c.facturacion[mes] = { montoUF: actual.montoUF, estado };
  });
  await saveClientes();
  facturaSelected.clear();
  renderApp();
  showToast('Estado actualizado en lote.');
}
