            <div style="margin-bottom:10px;">
              ${archivosCategoria.map(({a,i}) => `
                <div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line);">
                  <a href="${escapeAttr(a.url)}" target="_blank" rel="noopener" style="color:var(--teal-dark);text-decoration:underline;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.nombre)}</a>

              return `<div style="margin-bottom:10px;padding-top:8px;border-top:1px dashed var(--line);">
                <div style="font-size:11px;color:#8a8879;margin-bottom:6px;">También adjuntos desde el módulo de Propuestas:</div>
                ${archivosPropuestas.map(({a,p}) => `

                    <a href="${escapeAttr(a.url)}" target="_blank" rel="noopener" style="color:var(--teal-dark);text-decoration:underline;flex:1;">${escapeHtml(a.nombre)}</a>

          })()}

            <label>Correo de contacto
              <input type="text" id="dt_correo_contacto" placeholder="correo@cliente.cl" value="${escapeAttr(c.correoContacto||'')}">

                ${['Transferencia','Efectivo','Cheque','Débito automático','Otro'].map(f=>`<option value="${f}" ${c.formaPago===f?'selected':''}>${f}</option>`).join('')}
              </select>

            <label>Fecha de pago pactada

          <div style="margin-bottom:8px;">
            <div style="font-size:12px;font-weight:600;color:#6b6a5f;margin-bottom:6px;">Historial de cobranza</div>
            ${(c.historialCobranza||[]).slice().reverse().map(h => `
              <div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line);">
                <span class="mono" style="color:#8a8879;font-size:11px;min-width:76px;">${escapeHtml(h.fecha||'')}</span>
                <span style="min-width:90px;">${h.monto != null ? formatoCLP(h.monto) : '—'}</span>
                <span style="min-width:100px;">${escapeHtml(h.estado||'')}</span>
                <span style="flex:1;color:#6b6a5f;">${escapeHtml(h.nota||'')}</span>

          <h4 style="margin:0 0 10px;font-size:14px;">Servicios extraordinarios</h4>
          <div style="margin-bottom:10px;">
            ${(c.serviciosExtraordinarios||[]).map(s => `
              <span class="encargado-chip">${escapeHtml(s.fecha||'—')} · ${escapeHtml(s.descripcion)} · ${s.montoUF} UF
                <button onclick="quitarServicioExtra('${c.id}','${s.id}')" title="Eliminar">×</button>
              </span>

          </div>
          <div class="form-inline">
            <input type="date" id="extraFecha" value="${todayISO()}" style="max-width:150px;">
            <input type="text" id="extraDesc" placeholder="Descripción (ej: Término de giro)">

          </div>

        <div style="margin-top:10px;margin-bottom:20px;border-top:1px solid var(--line);padding-top:16px;">
          <h4 style="margin:0 0 10px;font-size:14px;">Memos y Propuestas</h4>
          <div class="hint" style="margin:-6px 0 10px;font-size:11px;color:#8a8879;">Se usan al redactar memos y propuestas para este cliente (ver Memos y Propuestas en el nav) — no afectan el resto de la ficha.</div>
          <div class="onboard-grid" style="margin-bottom:12px;">
            <label style="grid-column:1 / -1;">Saludo (vacío = se genera uno automático)
              <input type="text" id="dt_saludo_doc" placeholder="Ej: Estimado Joaquín:" value="${escapeAttr(c.saludo||'')}">
            </label>
            <label>Sociedades (una por línea)
              <textarea id="dt_sociedades_doc" rows="4" placeholder="Sociedad Inmobiliaria San Cristóbal Limitada">${escapeHtml((c.sociedades||[]).join('\n'))}</textarea>
            </label>
            <label>Socios / personas naturales (una por línea, para Operación Renta)
              <textarea id="dt_socios_doc" rows="4" placeholder="Joaquín Puig">${escapeHtml((c.socios||[]).join('\n'))}</textarea>

function toggleDtPersonaNatural(regimen){
  const esPN = regimen === 'Persona Natural';
  ['dt_actividad_wrap','dt_codigo_actividad_wrap','dt_rep_wrap','dt_rep_rut_wrap'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.style.display = esPN ? 'none' : 'flex';
  });
}

function mesActualISO(){
  return new Date().toISOString().slice(0,7);
}

// Trae del backend las claves de Previred/Clave Única/Facturación del
// cliente que se está viendo (ver obtenerCredencialesClienteBackend) y las
// muestra en sus campos, que hasta ahora estaban en blanco y de solo
// lectura. Si no se pincha este botón, esos campos se guardan intactos
// (ver valorClaveOculta) sin exponer ni tocar la clave real.
async function mostrarCredencialesCliente(id){
  const btn = document.getElementById('btnMostrarClaves');
  const estado = document.getElementById('mostrarClavesEstado');
  if(btn){ btn.disabled = true; btn.textContent = 'Cargando…'; }
  const datos = await obtenerCredencialesClienteBackend(id);
  if(!datos){
    if(btn){ btn.disabled = false; btn.textContent = 'Mostrar claves'; }
    showToast('No se pudieron obtener las claves. Intenta de nuevo.');
    return;
  }
  [
    ['dt_previred_clave', (datos.datosPrevired||{}).clave || ''],
    ['dt_claveunica_clave', (datos.claveUnica||{}).clave || ''],
    ['dt_factura_clave', (datos.datosFacturacion||{}).claveFacturador || ''],
    ['dt_factura_clave_cert', (datos.datosFacturacion||{}).claveCertificado || '']
  ].forEach(([elId, valor]) => {
    const el = document.getElementById(elId);
    if(el){ el.value = valor; el.readOnly = false; }
  });
  if(btn) btn.remove();
  if(estado) estado.textContent = 'Claves mostradas.';
}

// Para los campos de clave que empiezan ocultos (readonly, value=""): si
// nadie pinchó "Mostrar claves" se reenvía el valor cifrado original tal
// cual (data-original) para no perderlo; si se mostraron y/o editaron, se
// guarda lo que quedó escrito.
function valorClaveOculta(elId){
  const el = document.getElementById(elId);
  if(!el) return '';
  if(el.readOnly) return el.dataset.original || '';
  return el.value.trim();
}

async function saveClientDetail(id){
  const c = state.clientes.find(cl => cl.id === id);
  if(!c) return;
  c.name = document.getElementById('dt_name').value.trim();
  c.rut = document.getElementById('dt_rut').value.trim();
  c.clave = document.getElementById('dt_clave').value.trim();
  c.regimenTributario = document.getElementById('dt_regimen').value;
  const esPersonaNaturalDetalle = c.regimenTributario === 'Persona Natural';
  c.actividadEconomica = esPersonaNaturalDetalle ? '' : document.getElementById('dt_actividad').value.trim();
  c.codigoActividadEconomica = esPersonaNaturalDetalle ? '' : document.getElementById('dt_codigo_actividad').value.trim();
  c.representanteLegal = esPersonaNaturalDetalle ? '' : document.getElementById('dt_rep').value.trim();
  c.representanteLegalRut = esPersonaNaturalDetalle ? '' : document.getElementById('dt_rep_rut').value.trim();
  const casoEspecialCheck = document.getElementById('dt_iva_caso_especial');
  c.f29CasoEspecialMes = (casoEspecialCheck && casoEspecialCheck.checked) ? mesActualISO() : null;
  c.datosPrevired = {
    activo: document.getElementById('dt_previred_activo').checked,
    rut: document.getElementById('dt_previred_rut').value.trim(),
    clave: valorClaveOculta('dt_previred_clave')
  };
  c.claveUnica = {
    activo: document.getElementById('dt_claveunica_activo').checked,
    rut: document.getElementById('dt_claveunica_rut').value.trim(),
    clave: valorClaveOculta('dt_claveunica_clave')
  };
  c.datosFacturacion = {
    activo: document.getElementById('dt_factura_activo').checked,
    rutFacturador: document.getElementById('dt_factura_rut').value.trim(),
    claveFacturador: valorClaveOculta('dt_factura_clave'),
    claveCertificado: valorClaveOculta('dt_factura_clave_cert')
  };
  const encSel = document.getElementById('dt_encargado');
  if(currentUser.isAdmin || (encSel && encSel.tagName === 'SELECT')){
    if(encSel) c.encargadoId = encSel.value || null;
  }
  const grupoSel = document.getElementById('dt_grupo');
  if(grupoSel){
    if(grupoSel.value === '__nuevo__'){
      const nombre = prompt('Nombre del nuevo grupo:');
      if(nombre && nombre.trim()) c.grupo = nombre.trim();
    }else{
      c.grupo = grupoSel.value || null;
    }
  }
  const valorInput = document.getElementById('dt_valor_mensual');
  if(valorInput){
    const v = parseFloat(valorInput.value);
    c.valorServicioMensual = isNaN(v) ? null : v;
  }
  const rentaCheck = document.getElementById('dt_renta_requerido');
  if(rentaCheck) c.rentaRequerido = rentaCheck.checked;
  const premiumCheck = document.getElementById('dt_es_premium');
  if(premiumCheck) c.esPremium = premiumCheck.checked;
  c.telefonoContacto = document.getElementById('dt_telefono_contacto').value.trim();
  c.correoContacto = document.getElementById('dt_correo_contacto').value.trim();
  c.formaPago = document.getElementById('dt_forma_pago').value;
  c.fechaPago = document.getElementById('dt_fecha_pago').value || null;

  c.socios = document.getElementById('dt_socios_doc').value.split('\n').map(s=>s.trim()).filter(Boolean);

}

// Convierte un File del input a base64 puro (sin el prefijo data:...;base64,).
function leerArchivoComoBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// Insignia junto al nombre del archivo: nada para "permanente"; para
// "temporal" muestra la fecha de vencimiento, o "Vencido" en rojo si ya
// pasó (el archivo desaparece solo la próxima vez que alguien abra la app,
// ver limpiarArchivosVencidos()).
function badgeTipoArchivo(a){
  if(a.tipo !== 'temporal') return '';
  const vencido = a.fechaVencimiento && a.fechaVencimiento < todayISO();
  const estilo = vencido ? 'background:#FBE9E7;color:#A3402F;' : 'background:#FFF4D6;color:#8a6d1d;';
  return `<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:9999px;white-space:nowrap;${estilo}">${vencido ? 'Vencido' : `Vence ${escapeHtml(a.fechaVencimiento)}`}</span>`;
}

// Vista consolidada: un renglón por archivo, de todos los clientes y
// trabajos especiales que el usuario actual puede ver (misma regla de
// alcance que "Cartera de Clientes" para clientes — todo si
// puedeVerTodasLasCarteras, si no solo su(s) cartera(s) —; para trabajos
// especiales, todos si puedeVerTodasLasCarteras, si no solo los propios).
// No es una colección propia: cada archivo sigue viviendo dentro de
// c.archivos o t.archivos, esto solo los junta. Esta es también la ÚNICA
// pantalla desde la que se pueden AGREGAR archivos nuevos a un trabajo
// especial (ver el bloque "Adjuntar archivo a un trabajo especial" más
// abajo) — Trabajos Especiales solo los muestra, ya no permite subirlos.
function archivosContent(){
  const verTodo = puedeVerTodasLasCarteras(currentUser);
  const misCarteras = carterasDeUsuario(currentUser);
  const clientesVisibles = verTodo ? state.clientes : state.clientes.filter(c => misCarteras.includes(c.encargadoId));
  const trabajosVisibles = verTodo ? (state.trabajosEspeciales||[]) : (state.trabajosEspeciales||[]).filter(t => t.asignadoA === currentUser.id);

  const reunionesVisibles = state.reuniones||[];

  let filas = [];
  clientesVisibles.forEach(c => {
    (c.archivos||[]).forEach((archivo, index) => filas.push({ origenTipo:'cliente', origenNombre: c.name, clienteId: c.id, archivo, index }));
  });
  trabajosVisibles.forEach(t => {
    (t.archivos||[]).forEach((archivo, index) => filas.push({ origenTipo:'trabajo', origenNombre: `Trabajo especial: ${t.titulo}`, trabajoId: t.id, archivo, index }));
  });
  reunionesVisibles.forEach(r => {
    (r.archivos||[]).forEach((archivo, index) => filas.push({ origenTipo:'reunion', origenNombre: `Reunión: ${r.lugar||r.conQuien||r.fecha}`, reunionId: r.id, archivo, index }));
  });

  const q = (searchQuery||'').trim().toLowerCase();
  if(q){
    filas = filas.filter(({origenNombre, archivo}) =>
      (origenNombre||'').toLowerCase().includes(q) || (archivo.nombre||'').toLowerCase().includes(q)
    );
  }
  const hoy = todayISO();
  if(archivosFiltroTipo === 'permanente') filas = filas.filter(({archivo}) => archivo.tipo !== 'temporal');
  else if(archivosFiltroTipo === 'temporal') filas = filas.filter(({archivo}) => archivo.tipo === 'temporal');
  else if(archivosFiltroTipo === 'vencido') filas = filas.filter(({archivo}) => archivo.tipo === 'temporal' && archivo.fechaVencimiento && archivo.fechaVencimiento < hoy);
  if(archivosFiltroCategoria !== 'todas') filas = filas.filter(({archivo}) => categoriaArchivo(archivo) === archivosFiltroCategoria);

  filas.sort((a,b) => (b.archivo.fecha||'').localeCompare(a.archivo.fecha||''));

  const { pageItems, totalPages, page } = paginate(filas, tablePage);
  const totalSinFiltrar = clientesVisibles.reduce((n, c) => n + (c.archivos ? c.archivos.length : 0), 0)
    + trabajosVisibles.reduce((n, t) => n + (t.archivos ? t.archivos.length : 0), 0)
    + reunionesVisibles.reduce((n, r) => n + (r.archivos ? r.archivos.length : 0), 0);

  const chip = (tipo, label) => `<div class="filter-chip ${archivosFiltroTipo===tipo?'active':''}" onclick="setArchivosFiltroTipo('${tipo}')">${label}</div>`;
  const chipCategoria = (cat, label) => `<div class="filter-chip ${archivosFiltroCategoria===cat?'active':''}" onclick="setArchivosFiltroCategoria('${escapeAttr(cat)}')">${escapeHtml(label)}</div>`;

  return `
    <div class="main-head">
      <div>
        <h2 class="display">Archivos</h2>
        <div class="meta">${filas.length} de ${totalSinFiltrar} archivo${totalSinFiltrar===1?'':'s'} · ${verTodo ? 'de todos los clientes' : 'de tu cartera'}</div>
      </div>
      <input type="text" id="searchBox" placeholder="Buscar por cliente, trabajo especial o nombre de archivo…" value="${escapeHtml(searchQuery||'')}" oninput="onSearch(this.value)" style="min-width:240px;">
    </div>
    ${trabajosVisibles.length ? `
    <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px;">
      <h4 style="margin:0 0 10px;font-size:14px;">Adjuntar archivo a un trabajo especial</h4>
      <div class="form-inline">
        <select id="archivosTeSelect" style="min-width:220px;">
          <option value="">Selecciona un trabajo especial…</option>
          ${trabajosVisibles.map(t=>`<option value="${t.id}">${escapeHtml(t.titulo)}</option>`).join('')}
        </select>
        <input type="file" id="archivosTeInput" style="flex:1;">
        <button class="btn secondary small" id="archivosTeBtn" onclick="subirArchivoTrabajoDesdeArchivos()">Subir archivo</button>
      </div>
      <div style="font-size:11px;color:#8a8879;margin-top:6px;">Máximo 5 MB por archivo. Los archivos de clientes se agregan desde la ficha de cada cliente.</div>
    </div>
    ` : ''}
    <div class="filter-bar" style="margin-bottom:10px;">
      ${chip('todos', 'Todos')}
      ${chip('permanente', 'Permanentes')}
      ${chip('temporal', 'Temporales')}
      ${chip('vencido', 'Vencidos')}
    </div>
    <div class="filter-bar" style="margin-bottom:14px;flex-wrap:wrap;">
      ${chipCategoria('todas', 'Todas las carpetas')}
      ${CATEGORIAS_ARCHIVO.map(cat => chipCategoria(cat, cat)).join('')}
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Origen</th><th>Archivo</th><th></th><th>Subido</th><th></th></tr></thead>
      <tbody>
        ${pageItems.length ? pageItems.map(({origenTipo, origenNombre, clienteId, trabajoId, reunionId, archivo, index}) => `
          <tr>
            <td class="client-name">${escapeHtml(origenNombre)}</td>
            <td><a href="${escapeAttr(archivo.url)}" target="_blank" rel="noopener" style="color:var(--teal-dark);text-decoration:underline;">${escapeHtml(archivo.nombre)}</a></td>
            <td>${badgeTipoArchivo(archivo)}</td>
            <td style="color:#8a8879;font-size:12px;white-space:nowrap;">${escapeHtml(archivo.fecha||'')}${archivo.subidoPor?` · ${escapeHtml(archivo.subidoPor)}`:''}</td>
            <td class="row-actions"><button class="btn danger small" onclick="${origenTipo==='cliente' ? `quitarArchivoCliente('${clienteId}', ${index})` : origenTipo==='trabajo' ? `quitarArchivoTrabajoEspecial('${trabajoId}', ${index})` : `quitarArchivoReunion('${reunionId}', ${index})`}">Quitar</button></td>
          </tr>
        `).join('') : `<tr><td colspan="5" style="padding:32px;text-align:center;color:#8a8879;">${q || archivosFiltroTipo!=='todos' || archivosFiltroCategoria!=='todas' ? 'No hay archivos que coincidan con el filtro.' : 'Todavía no se ha subido ningún archivo.'}</td></tr>`}
      </tbody>
    </table>
    </div>
    ${paginationControls(page, totalPages)}
  `;
}

async function subirArchivoTrabajoDesdeArchivos(){
  const sel = document.getElementById('archivosTeSelect');
  const input = document.getElementById('archivosTeInput');
  const boton = document.getElementById('archivosTeBtn');
  const trabajoId = sel && sel.value;
  if(!trabajoId) return showToast('Selecciona un trabajo especial.');
  if(!input || !input.files || !input.files[0]) return showToast('Elige un archivo primero.');
  if(boton){ boton.disabled = true; boton.textContent = 'Subiendo…'; }
  try{
    await subirArchivoTrabajoEspecial(trabajoId, input);
    if(sel) sel.value = '';
  }finally{
    if(boton){ boton.disabled = false; boton.textContent = 'Subir archivo'; }
  }
}

async function subirArchivoCliente(clienteId){
  const input = document.getElementById('dt_archivo_input');
  const file = input && input.files && input.files[0];
  if(!file){ showToast('Elige un archivo primero.'); return; }
  const LIMITE_BYTES = 5 * 1024 * 1024;
  if(file.size > LIMITE_BYTES){ showToast('El archivo es muy grande (máx. 5 MB).'); return; }

  const c = state.clientes.find(cl => cl.id === clienteId);
  if(!c) return;

  const boton = document.getElementById('dt_archivo_btn');
  if(boton){ boton.disabled = true; boton.textContent = 'Subiendo…'; }
  try{
    const contenidoBase64 = await leerArchivoComoBase64(file);
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'subirArchivo',
        token: API_TOKEN,
        clienteId,
        clienteNombre: c.name,
        nombreArchivo: file.name,
        mimeType: file.type || 'application/octet-stream',
        contenidoBase64
      })
    });
    const data = await res.json();
    if(!data || !data.ok){ showToast('No se pudo subir el archivo.'); return; }

    const tipoSel = document.getElementById('dt_archivo_tipo');
    const tipoArchivo = (tipoSel && tipoSel.value === 'temporal') ? 'temporal' : 'permanente';
    const fechaSubida = todayISO();
    const categoriaDestino = (detailArchivoCategoria === 'Informes Premium' && !currentUser.isAdmin) ? 'General' : detailArchivoCategoria;
    if(!c.archivos) c.archivos = [];
    c.archivos.push({
      nombre: data.nombre || file.name, url: data.url, driveFileId: data.id,
      fecha: fechaSubida, subidoPor: currentUser.name,
      tipo: tipoArchivo, fechaVencimiento: tipoArchivo === 'temporal' ? sumarDias(fechaSubida, 30) : null,
      categoria: categoriaDestino
    });
    await saveClientes();
    renderModal();
    showToast('Archivo subido.');
  }catch(err){
    console.error('Error al subir archivo:', err);
    showToast('Error al subir el archivo.');
  }finally{
    if(boton){ boton.disabled = false; boton.textContent = 'Subir archivo'; }
  }
}

async function quitarArchivoCliente(clienteId, index){
  const c = state.clientes.find(cl => cl.id === clienteId);
  if(!c || !c.archivos) return;
  c.archivos.splice(index, 1);
  await saveClientes();
  renderModal();
}

async function eliminarArchivoBackend(driveFileId){
  if(!BACKEND_URL) return;
  try{
    await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'eliminarArchivo', token: API_TOKEN, driveFileId })
    });
  }catch(e){
    console.error('No se pudo eliminar en Drive un archivo temporal vencido:', e);
  }
}

// Se corre una vez al cargar la app (ver init()): saca de cada cliente los
// archivos "temporal" cuya fechaVencimiento ya pasó, guarda el cambio, y de
// paso intenta borrar el archivo real en Drive (best-effort — si falla, el
// archivo ya salió de la lista igual, y solo queda huérfano en Drive, sin
// romper nada en la app). Los archivos "permanente" nunca se tocan acá.
async function limpiarArchivosVencidos(){
  const hoy = todayISO();
  const vencidos = [];
  state.clientes.forEach(c => {
    if(!c.archivos || !c.archivos.length) return;
    const conservados = c.archivos.filter(a => {
      const yaVencio = a.tipo === 'temporal' && a.fechaVencimiento && a.fechaVencimiento < hoy;
      if(yaVencio) vencidos.push(a);
      return !yaVencio;
    });
    if(conservados.length !== c.archivos.length) c.archivos = conservados;
  });
  if(!vencidos.length) return;
  await saveClientes();
  vencidos.forEach(a => { if(a.driveFileId) eliminarArchivoBackend(a.driveFileId); });
}

// colorTexto: cuando la fila tiene un color de fondo personal (ver
// puedeColorearClientes), se pasa el color de letra ya calculado para
// contraste — sin esto, el gris fijo de .client-notes podría volverse
// ilegible sobre un fondo oscuro.
function clientMeta(c, colorTexto){
  const parts = [];
  if(c.regimenTributario) parts.push(`Régimen: ${escapeHtml(c.regimenTributario)}`);
  if(c.representanteLegal) parts.push(`Rep. legal: ${escapeHtml(c.representanteLegal)}`);
  if(c.actividadEconomica) parts.push(`Actividad: ${escapeHtml(c.actividadEconomica)}`);
  if(c.codigoActividadEconomica) parts.push(`Cód. actividad: ${escapeHtml(c.codigoActividadEconomica)}`);
  if(c.datosPrevired && c.datosPrevired.activo) parts.push('Previred');
  if(c.claveUnica && c.claveUnica.activo) parts.push('Clave Única');
  if(c.datosFacturacion && c.datosFacturacion.activo) parts.push('Factura');
  if(c.notas) parts.push(escapeHtml(c.notas));
  if(!parts.length) return '';
  const estilo = colorTexto ? ` style="color:${colorTexto};opacity:0.85;"` : '';
  return `<div class="client-notes"${estilo}>${parts.join(' · ')}</div>`;
}

// Ordena por grupo (alfabético, "" al final) y por nombre dentro de cada
// grupo, para que al paginar los clientes de un mismo grupo queden juntos
// (ver filasConEncabezadoDeGrupo). Solo se usa en la vista "Cartera de
// Clientes" — el resto de las tablas (F-29, Renta, Facturación, Tareas)
// no se tocan.
function ordenarPorGrupo(list){
  return [...list].sort((a, b) => {
    const ga = a.grupo || '';
    const gb = b.grupo || '';
    if(ga !== gb){
      if(!ga) return 1;
      if(!gb) return -1;
      return ga.localeCompare(gb, 'es');
    }
    return (a.name||'').localeCompare(b.name||'', 'es');
  });
}

// Inserta una fila de encabezado cada vez que cambia c.grupo dentro de la
// lista ya ordenada (ver ordenarPorGrupo). Si en esta página/lista solo hay
// un grupo (o ninguno), no vale la pena mostrar el encabezado — se pinta
// plano, igual que antes de que existiera esta función. Si puedeEditarGrupo
// es true (Administrador, TAX o Contabilidad — ver puedeVerTodasLasCarteras),
// el encabezado incluye un botón para renombrar el grupo completo de una
// sola vez.
function filasConEncabezadoDeGrupo(list, renderFila, puedeEditarGrupo){
  const distintos = new Set(list.map(c => c.grupo || ''));
  if(distintos.size <= 1) return list.map(renderFila).join('');
  let filas = '';
  let grupoAnterior;
  list.forEach(c => {
    const grupo = c.grupo || '';
    if(grupo !== grupoAnterior){
      grupoAnterior = grupo;
      const etiqueta = grupo ? escapeHtml(grupo) : 'Sin grupo';
      const renombrar = (puedeEditarGrupo && grupo) ? `<button onclick="renombrarGrupo('${escapeAttr(grupo)}')" style="margin-left:10px;font-size:11px;font-weight:600;text-transform:none;letter-spacing:normal;color:var(--teal-dark);background:none;border:none;cursor:pointer;text-decoration:underline;">Renombrar grupo</button>` : '';
      filas += `<tr><td colspan="99" style="background:var(--paper-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;padding:8px 16px;color:#6b6a5f;border-top:2px solid var(--line);">${etiqueta}${renombrar}</td></tr>`;
    }
    filas += renderFila(c);
  });
  return filas;
}

// Nombres de grupo ya usados en toda la cartera (no solo la página o
// sucursal actual), para ofrecerlos como opciones al asignar/reasignar y
// evitar duplicados por variaciones de escritura ("Grupo A" vs "grupo a").
function gruposExistentes(){
  return [...new Set(state.clientes.map(c => (c.grupo||'').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'es'));
}

// Selector reutilizable para asignar/reasignar el grupo de un cliente:
// "Sin grupo", cada grupo ya existente, y una opción para crear uno nuevo.
function grupoSelectHtml(c){
  return `
    <select onchange="cambiarGrupoCliente('${c.id}', this.value)">
      <option value="" ${!c.grupo?'selected':''}>Sin grupo</option>
      ${gruposExistentes().map(g => `<option value="${escapeAttr(g)}" ${c.grupo===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
      <option value="__nuevo__">+ Nuevo grupo…</option>
    </select>
  `;
}

async function cambiarGrupoCliente(clienteId, valor){
  const c = state.clientes.find(c => c.id === clienteId);
  if(!c) return;
  if(valor === '__nuevo__'){
    const nombre = prompt('Nombre del nuevo grupo:');
    if(!nombre || !nombre.trim()){ renderApp(); return; } // cancelado o vacío: se revierte el <select> al re-renderizar
    c.grupo = nombre.trim();
  }else{
    c.grupo = valor || null;
  }
  await saveClientes();
  renderApp();
  showToast('Grupo actualizado.');
}

// Renombra un grupo completo: todos los clientes que hoy comparten
// `grupoActual` pasan al nuevo nombre de una sola vez, sin tener que
// editarlos cliente por cliente.
async function renombrarGrupo(grupoActual){
  const nuevo = prompt(`Nuevo nombre para el grupo "${grupoActual}":`, grupoActual);
  if(!nuevo || !nuevo.trim() || nuevo.trim() === grupoActual) return;
  const nuevoNombre = nuevo.trim();
  const afectados = state.clientes.filter(c => (c.grupo||'') === grupoActual);
  afectados.forEach(c => { c.grupo = nuevoNombre; });
  await saveClientes();
  renderApp();
  showToast(`Grupo renombrado (${afectados.length} cliente${afectados.length===1?'':'s'}).`);
}

/* ---------------------------------------------------------------------
 * Color personal por cliente — SOLO Pablo Prieto y Sara Barriga, cada uno
 * con lo suyo (mismo patrón de gate por nombre que puedeDerivarTax()).
 * Es una preferencia puramente visual, al estilo del relleno de celda de
 * Excel: se guarda en localStorage del propio navegador, separado por id
 * de usuario, y NUNCA se sube al backend compartido — así que jamás la ve
 * el resto del equipo, ni siquiera si ambos usan el mismo computador.
 * ------------------------------------------------------------------- */
function puedeColorearClientes(u){
  return !!u && (u.name === 'Pablo Prieto' || u.name === 'Sara Barriga');
}

// Mismos dos bloques que ofrece Excel al pintar celdas: "Colores del tema"
// y "Colores estándar".
const PALETA_COLORES_CLIENTE = {
  tema: ['#FFFFFF','#000000','#E7E6E6','#44546A','#4472C4','#ED7D31','#A5A5A5','#FFC000','#5B9BD5','#70AD47'],
  estandar: ['#C00000','#FF0000','#FFC000','#FFFF00','#92D050','#00B050','#00B0F0','#0070C0','#002060','#7030A0'],
};

function coloresClientesStorageKey(){
  return 'bpo1_coloresClientes_' + currentUser.id;
}

function cargarColoresClientes(){
  try{ return JSON.parse(localStorage.getItem(coloresClientesStorageKey()) || '{}'); }catch(e){ return {}; }
}

function guardarColoresClientes(mapa){
  try{ localStorage.setItem(coloresClientesStorageKey(), JSON.stringify(mapa)); }catch(e){ /* localStorage no disponible (modo privado, cuota llena, etc.): se ignora sin bloquear la app */ }
}

// Negro (--ink) o el crema claro de la paleta (--white) como color de
// letra, según cuál tenga mejor contraste contra el fondo elegido —
// fórmula YIQ, de sobra para decidir claro/oscuro sin librerías externas.
// Así la letra queda siempre legible sin importar qué color se elija.
function colorTextoParaFondo(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
  if(!m) return null;
  const r = parseInt(m[1],16), g = parseInt(m[2],16), b = parseInt(m[3],16);
  const yiq = (r*299 + g*587 + b*114) / 1000;
  return yiq >= 140 ? 'var(--ink)' : 'var(--white)';
}

let colorPickerAbiertoPara = null; // id del cliente con el selector de color desplegado, o null
let colorPickerPos = null; // {top, left} en px de viewport, calculado al abrir (ver toggleColorPicker)

// La tabla tiene overflow:hidden (para las esquinas redondeadas), así que un
// popover posicionado relativo a la celda quedaría recortado si la fila
// está cerca del borde. Por eso se usa position:fixed con coordenadas
// calculadas a partir del botón que se clickeó, en vez de depender de un
// ancestro con position:relative.
function toggleColorPicker(ev, clienteId){
  // Sin stopPropagation, el mismo clic que abre el selector llega al
  // listener de "clic afuera = cerrar" (más abajo) y lo cierra de inmediato
  // — mismo problema, y misma solución, que ya resolvió toggleNotifPanel().
  ev.stopPropagation();
  if(colorPickerAbiertoPara === clienteId){
    colorPickerAbiertoPara = null;
    colorPickerPos = null;
  }else{
    const r = ev.currentTarget.getBoundingClientRect();
    colorPickerPos = {
      top: r.bottom + 6,
      left: Math.min(r.left, window.innerWidth - 206), // 190px de ancho + margen, sin salirse por la derecha
    };
    colorPickerAbiertoPara = clienteId;
  }
  renderApp();
}

function aplicarColorCliente(clienteId, colorHex){

}

/* ---------------- REQUERIMIENTOS (Tailwind) ---------------- */
const REQ_TIPOS = ['Contable', 'Impuestos (TAX)', 'Administrativo'];
// ---------------- REPORTE SEMANAL (solo rol Contabilidad) ----------------
let reporteSemanaLunes = null; // ISO del lunes de la semana que se está viendo

function semanaActualLunes(){
  const hoy = todayISO();
  const dow = new Date(hoy + 'T00:00:00Z').getUTCDay(); // 0=domingo
  const offsetLunes = (dow + 6) % 7;
  return sumarDias(hoy, -offsetLunes);
}

function cambiarSemanaReporte(delta){
  if(!reporteSemanaLunes) reporteSemanaLunes = semanaActualLunes();
  reporteSemanaLunes = sumarDias(reporteSemanaLunes, delta * 7);
  renderApp();
}

// Resume la semana para Contabilidad: requerimientos resueltos esa semana +
// requerimientos creados esa semana que todavía siguen pendientes. Botón
// "Descargar PDF" usa window.print() (el usuario elige "Guardar como PDF"
// en el diálogo de impresión) — no depende de ninguna librería externa.
function reporteSemanalContent(){
  if(!esRolContabilidad(currentUser.rol)){
    return `<div class="empty-state"><div class="display">No disponible</div><div>Esta sección es exclusiva del rol Contabilidad.</div></div>`;
  }
  if(!reporteSemanaLunes) reporteSemanaLunes = semanaActualLunes();
  const lunes = reporteSemanaLunes;
  const domingo = sumarDias(lunes, 6);

  const resueltos = state.requerimientos.filter(r => r.fechaResolucion && r.fechaResolucion >= lunes && r.fechaResolucion <= domingo);
  // Un pendiente no desaparece del reporte al pasar de semana: sigue
  // apareciendo en cada semana siguiente (mientras haya existido para esa
  // fecha) hasta que se resuelva. Por eso no se filtra por fechaCreacion
  // dentro de la semana — solo que ya existiera para el domingo de esa
  // semana y que, a esa fecha, todavía siguiera sin resolver.
  const pendientes = state.requerimientos.filter(r =>
    r.fechaCreacion && r.fechaCreacion <= domingo &&
    (r.estado !== 'Resuelto' || (r.fechaResolucion && r.fechaResolucion > domingo))
  );

  const filaReq = r => `
    <tr class="border-t border-gray-100">
      <td class="px-4 py-2 text-gray-800">${escapeHtml(r.tipo)}${r.descripcion ? `<div style="font-size:12px;color:#9ca3af;">${escapeHtml(r.descripcion)}</div>` : ''}</td>
      <td class="px-4 py-2 text-gray-500">${escapeHtml(nombresDirigidoA(r))}</td>
      <td class="px-4 py-2 text-gray-500">${escapeHtml(nombreCreador(r) || '—')}</td>
      <td class="px-4 py-2 text-gray-500">${escapeHtml(r.fechaCreacion || '—')}</td>
    </tr>
  `;

  const tabla = (titulo, lista) => `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden my-6">
      <div class="p-4 border-b border-gray-100"><h3 class="text-sm font-bold text-gray-700">${titulo} (${lista.length})</h3></div>
      <div style="overflow-x:auto;">
      <table class="w-full text-sm">
        <thead class="bg-gray-50"><tr>
          <th class="text-left px-4 py-2 font-semibold text-gray-600">Tipo</th>
          <th class="text-left px-4 py-2 font-semibold text-gray-600">Dirigido a</th>
          <th class="text-left px-4 py-2 font-semibold text-gray-600">Creado por</th>
          <th class="text-left px-4 py-2 font-semibold text-gray-600">Creación</th>
        </tr></thead>
        <tbody>
          ${lista.length ? lista.map(filaReq).join('') : `<tr><td colspan="4" class="px-4 py-6 text-center text-gray-400">Sin registros esta semana.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;

  return `
    <div class="max-w-4xl">
      <div class="flex items-center justify-between mb-1 flex-wrap gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800 mb-1">Reporte Semanal</h2>
          <p class="text-sm text-gray-500">Semana del ${lunes} al ${domingo}.</p>
        </div>
        <div class="flex items-center gap-2 no-print">
          <button onclick="cambiarSemanaReporte(-1)" class="btn secondary small">← Semana anterior</button>
          <button onclick="cambiarSemanaReporte(1)" class="btn secondary small">Semana siguiente →</button>
          <button onclick="window.print()" class="btn small">Descargar PDF</button>
        </div>
      </div>
      ${tabla('Requerimientos resueltos', resueltos)}
      ${tabla('Pendientes al cierre de esta semana', pendientes)}
    </div>
  `;
}

const REQ_ESTADOS = ['Pendiente', 'En trámite', 'Resuelto'];
// Reemplaza las pastillas Tailwind rojo/amarillo/verde por el sistema de
// chips de Memos y Propuestas (mismo criterio para Trabajos Especiales,
// Facturación y Obligaciones Tributarias: ver estadoPillClass más abajo).
function estadoPillClass(mapa, estado, porDefecto){
  return `estado-pill ${mapa[estado] || mapa[porDefecto]}`;
}
const REQ_ESTADO_CLASS = { 'Pendiente': 'chip-red', 'En trámite': 'chip-amber', 'Resuelto': 'chip-green' };
function reqEstadoClass(estado){
  return estadoPillClass(REQ_ESTADO_CLASS, estado, 'Pendiente');
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

// Reglas de "Dirigido a" por tipo de requerimiento.
function buscarUsuarioPorNombre(nombre){
  return state.usuarios.find(u => u.name === nombre);

// Lista completa: cualquier usuario (encargado, asistente, admin, TAX,
// Contabilidad, etc.) puede ser destinatario de un requerimiento, sin
// importar el "Tipo" elegido. Selección múltiple por checkboxes.
function renderDirigidoAField(tipo, seleccionPrevia){
  const seleccionados = new Set(seleccionPrevia || []);
  const opciones = [...state.usuarios].sort((a,b) => a.name.localeCompare(b.name, 'es'));

      ${opciones.length ? opciones.map(o => `
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;color:#374151;">
          <input type="checkbox" class="reqDirigidoACheck" value="${o.id}" ${seleccionados.has(o.id)?'checked':''} onchange="actualizarReqDirigidoA()">
          ${escapeHtml(o.name)}${o.rol ? ` <span style="color:#9ca3af;">· ${escapeHtml(o.rol)}</span>` : ''}
        </label>
      `).join('') : `<span style="font-size:13px;color:#9ca3af;">No hay usuarios registrados.</span>`}

function actualizarReqDirigidoA(){
  const seleccionados = Array.from(document.querySelectorAll('.reqDirigidoACheck:checked')).map(cb => cb.value);
  const hidden = document.getElementById('reqDirigidoA');
  if(hidden) hidden.value = seleccionados.join(',');
}

function dirigidoAIds(r){
  if(Array.isArray(r.dirigidoA)) return r.dirigidoA;
  return r.dirigidoA ? [r.dirigidoA] : [];
}

// "Nuevo": el requerimiento está dirigido al usuario actual y todavía no lo
// ha visto (no aparece en r.leidoPor). Se marca como leído al entrar a la
// pestaña "Requerimientos" (ver setTab).
function diasFaltantes(fechaISO){
  if(!fechaISO) return null;
  const objetivo = new Date(fechaISO + 'T00:00:00Z').getTime();
  const hoy = new Date(todayISO() + 'T00:00:00Z').getTime();
  return Math.round((objetivo - hoy) / 86400000);
}

// Insignia con los días transcurridos desde la creación, mientras el
// requerimiento siga sin resolver. Se pone en rojo/ámbar/azul según qué tan
// atrasado esté.
// Insignia con los días que faltan hasta la fecha de vencimiento
// (fechaRespuesta), mientras el requerimiento siga sin resolver. Negativo
// significa que ya venció.
function badgeDiasFaltantes(r){
  if(r.estado === 'Resuelto') return '';
  const dias = diasFaltantes(r.fechaRespuesta);
  if(dias === null) return '';
  if(dias < 0){
    return `<span style="display:inline-block;font-size:11px;font-weight:600;border-radius:9999px;padding:2px 8px;white-space:nowrap;background:#FEE2E2;color:#B91C1C;">Vencido hace ${-dias} día${-dias===1?'':'s'}</span>`;
  }
  const estilo = dias <= 2 ? 'background:#FEE2E2;color:#B91C1C;' : dias <= 7 ? 'background:#FEF3C7;color:#92400E;' : 'background:#E0E7FF;color:#3730A3;';
  const texto = dias === 0 ? 'Vence hoy' : `${dias} día${dias===1?'':'s'} restante${dias===1?'':'s'}`;
  return `<span style="display:inline-block;font-size:11px;font-weight:600;border-radius:9999px;padding:2px 8px;white-space:nowrap;${estilo}">${texto}</span>`;
}

// Dado el id de un destinatario de un requerimiento, devuelve los ids de
// las personas que también deben poder verlo por la relación
// encargado<->asistente: si el destinatario es un asistente, sus
// encargados (carterasVisibles); si es un encargado, los asistentes que
// lo tengan asignado en su carterasVisibles.
function relacionadosParaVisibilidad(usuarioId){
  const u = state.usuarios.find(x => x.id === usuarioId);
  if(!u) return [];
  if(esRolAsistente(u.rol)) return u.carterasVisibles || [];
  return state.usuarios.filter(a => esRolAsistente(a.rol) && (a.carterasVisibles||[]).includes(usuarioId)).map(a => a.id);
}

// Administrador, TAX y Contabilidad ven todos los requerimientos; cualquiera
// ve los que creó y los dirigidos a él; y, por la relación encargado<->
// asistente, también ve los dirigidos a su contraparte.
function puedeVerRequerimiento(r, u){
  if(puedeVerTodasLasCarteras(u)) return true;
  if(r.creadoPor === u.id) return true;
  const directos = dirigidoAIds(r);
  if(directos.includes(u.id)) return true;
  return directos.some(id => relacionadosParaVisibilidad(id).includes(u.id));
}

function esNoLeidoParaMi(r){
  return dirigidoAIds(r).includes(currentUser.id) && !(r.leidoPor||[]).includes(currentUser.id);
}

async function marcarRequerimientosLeidos(){
  let cambio = false;
  state.requerimientos.forEach(r => {
    if(dirigidoAIds(r).includes(currentUser.id)){
      if(!r.leidoPor) r.leidoPor = [];
      if(!r.leidoPor.includes(currentUser.id)){
        r.leidoPor.push(currentUser.id);
        cambio = true;
      }
    }
  });
  if(cambio) await saveRequerimientos();
}

/* ---------------- Campana de notificaciones ---------------- */
// Reutiliza esNoLeidoParaMi(): un requerimiento recién dirigido a
// currentUser y que todavía no marcó como leído es, ni más ni menos, una
// notificación pendiente. No hay una colección separada que mantener en
// sync — se deriva de state.requerimientos en cada render.
let notifPanelOpen = false;

function misNotificacionesRequerimientos(){
  return state.requerimientos
    .filter(esNoLeidoParaMi)
    .sort((a,b) => (b.fechaCreacion||'').localeCompare(a.fechaCreacion||''));
}

function inicialesUsuario(nombre){
  if(!nombre) return '?';
  const partes = nombre.trim().split(/\s+/);
  return ((partes[0]||'')[0] + (partes[1]?partes[1][0]:'')).toUpperCase();
}

function toggleNotifPanel(ev){
  // Sin esto, el mismo clic que abre la campana también la cierra: al
  // volver a pintar #notifBox (innerHTML) el botón original queda
  // desconectado del DOM, así que cuando el clic sigue burbujeando hasta el
  // listener de "cerrar si el clic fue afuera" (más abajo), wrap.contains
  // ya no reconoce ese nodo viejo y lo trata como un clic externo.
  if(ev) ev.stopPropagation();
  notifPanelOpen = !notifPanelOpen;
  renderNotifBell();
}

function cerrarNotifPanel(){
  if(notifPanelOpen){ notifPanelOpen = false; renderNotifBell(); }
}

// Al abrir una notificación se va a Requerimientos, que ya marca todo lo
// dirigido a mí como leído (ver setTab) — mismo efecto de "abrir y que se
// limpien las notificaciones" que se espera de una campana tipo Facebook.
function irANotificacion(){
  notifPanelOpen = false;
  setTab('requerimientos');
}

function renderNotifBell(){
  const box = document.getElementById('notifBox');
  if(!box || !currentUser) return;
  const notifs = misNotificacionesRequerimientos();
  const count = notifs.length;
  box.innerHTML = `
    <div class="notif-wrap" id="notifWrap">
      <button class="notif-bell" onclick="toggleNotifPanel(event)" title="Notificaciones" aria-label="Notificaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        ${count > 0 ? `<span class="notif-badge">${count > 9 ? '9+' : count}</span>` : ''}
      </button>
      ${notifPanelOpen ? `
        <div class="notif-panel">
          <div class="notif-panel-head">Notificaciones</div>
          ${notifs.length ? notifs.map(r => `
            <div class="notif-item" onclick="irANotificacion()">
              <div class="notif-avatar">${escapeHtml(inicialesUsuario(nombreCreador(r)))}</div>
              <div style="flex:1;">
                <div class="notif-text"><b>${escapeHtml(nombreCreador(r) || 'Alguien')}</b> te asignó un requerimiento solicitado: <b>${escapeHtml(r.tipo)}</b></div>
                <div class="notif-time">${escapeHtml(r.fechaCreacion || '')}</div>
              </div>
              <div class="notif-dot"></div>
            </div>
          `).join('') : `<div class="notif-empty">No tienes notificaciones nuevas.</div>`}
        </div>
      ` : ''}
    </div>
  `;
}

// Clic afuera del panel = se cierra (comportamiento estándar de dropdown
// de notificaciones). El clic sobre la campana en sí queda adentro de
// #notifWrap, así que no interfiere con toggleNotifPanel().
document.addEventListener('click', (ev) => {
  if(!notifPanelOpen) return;
  const wrap = document.getElementById('notifWrap');
  if(wrap && !wrap.contains(ev.target)) cerrarNotifPanel();
});

function nombreCreador(r){
  if(!r.creadoPor) return '';
  const u = state.usuarios.find(u => u.id === r.creadoPor);
  return u ? u.name : '';
}

function nombresDirigidoA(r){
  const nombres = dirigidoAIds(r).map(id => (state.usuarios.find(u=>u.id===id)||{}).name).filter(Boolean);
  return nombres.length ? nombres.join(', ') : 'Sin asignar';
}

/* ---------------- Notificaciones en vivo (polling) ---------------- */
// El backend es Apps Script + Sheets, sin websockets ni push real. Para que
// un requerimiento recién creado avise "en vivo" a quienes fue dirigido sin
// que tengan que recargar la página, cada cierto tiempo se vuelve a pedir
// SOLO la llave 'requerimientos' y se compara contra lo que ya había en
// memoria por id: lo nuevo dirigido a currentUser dispara un toast y
// refresca la campana. No reemplaza el resto de `state` ni interrumpe a
// nadie que esté escribiendo en un formulario.
const REQUERIMIENTOS_POLL_MS = 20000;
let requerimientosPollTimer = null;

function iniciarPollingRequerimientos(){
  if(requerimientosPollTimer) return;
  requerimientosPollTimer = setInterval(sondearRequerimientosNuevos, REQUERIMIENTOS_POLL_MS);
}

function detenerPollingRequerimientos(){
  if(requerimientosPollTimer){ clearInterval(requerimientosPollTimer); requerimientosPollTimer = null; }
}

async function sondearRequerimientosNuevos(){
  if(!currentUser || !BACKEND_URL) return;
  // Si hay un guardado de requerimientos pendiente o en curso (p.ej. se acaba
  // de crear/editar uno hace instantes), no se pisa con lo que devuelva el
  // servidor: ese guardado todavía no llegó, y aplicar la respuesta vieja
  // haría "desaparecer" momentáneamente el cambio recién hecho localmente.
  // Se reintenta solo en el próximo ciclo, cuando el guardado ya se hizo.
  if(requerimientosSaveDebouncer.isPending()) return;
  const res = await kvGet('requerimientos');
  if(!res) return;
  let nuevos;
  try{ nuevos = JSON.parse(res.value); }catch(e){ return; }
  if(!Array.isArray(nuevos)) return;

  const idsAntes = new Set(state.requerimientos.map(r => r.id));
  const recienDirigidosAMi = nuevos.filter(r =>
    !idsAntes.has(r.id) && esNoLeidoParaMi(r) && r.creadoPor !== currentUser.id
  );

  state.requerimientos = nuevos;
  recienDirigidosAMi.forEach(r => {
    showToast(`${nombreCreador(r) || 'Alguien'} te asignó un requerimiento: ${r.tipo}`);

  // nuevo aparezca sin recargar — salvo que tenga el foco en un campo del
  // formulario de creación, para no borrarle a la persona lo que está
  // escribiendo.
  const enFormulario = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement && document.activeElement.tagName);
  if(activeTab === 'requerimientos' && !enFormulario && recienDirigidosAMi.length){
    renderApp();

}

/* ---------------- CALENDARIO TRIBUTARIO (Inicio) ---------------- */

// Feriados fijos + Semana Santa (Viernes y Sábado Santo, calculados con el
// algoritmo de Gauss/Meeus para la Pascua). NOTA: no incluye los feriados que
// la ley chilena traslada a lunes/viernes por decreto específico de cada año
// (ej. 12 y 31 de octubre) ni feriados regionales — cubre los feriados
// nacionales fijos y Semana Santa, suficiente para calcular el corrimiento
// del plazo del F-29 pedido en este calendario.
function festivosChile(year){
  const fijos = [
    `${year}-01-01`, `${year}-05-01`, `${year}-05-21`, `${year}-07-16`,
    `${year}-08-15`, `${year}-09-18`, `${year}-09-19`, `${year}-10-12`,
    `${year}-11-01`, `${year}-12-08`, `${year}-12-25`,
  ];
  const pascua = domingoDePascua(year);
  return new Set([...fijos, sumarDias(pascua, -2), sumarDias(pascua, -1)]);
}

function domingoDePascua(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c/4), k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const mes = Math.floor((h + l - 7*m + 114) / 31);
  const dia = ((h + l - 7*m + 114) % 31) + 1;
  return `${year}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}

function sumarDias(fechaISO, dias){
  const [y,m,d] = fechaISO.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + dias);
  return dt.toISOString().slice(0,10);
}

function esFinDeSemana(fechaISO){
  const [y,m,d] = fechaISO.split('-').map(Number);
  const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay(); // 0=domingo, 6=sábado
  return dow === 0 || dow === 6;
}

function esDiaHabil(fechaISO, festivosSet){
  return !esFinDeSemana(fechaISO) && !festivosSet.has(fechaISO);
}

function siguienteDiaHabil(fechaISO, festivosSet){
  let f = fechaISO;
  while(!esDiaHabil(f, festivosSet)) f = sumarDias(f, 1);
  return f;
}

function ultimoDiaHabilDelMes(year, mes1a12, festivosSet){
  const ultimoDiaCalendario = new Date(Date.UTC(year, mes1a12, 0)).getUTCDate();
  let f = `${year}-${String(mes1a12).padStart(2,'0')}-${String(ultimoDiaCalendario).padStart(2,'0')}`;
  while(!esDiaHabil(f, festivosSet)) f = sumarDias(f, -1);
  return f;
}

// Plazos tributarios fijos que caen dentro del mes (year, mes1a12).
function eventosTributariosDelMes(year, mes1a12){
  const festivosSet = new Set([...festivosChile(year), ...festivosChile(year+1)]); // por si el 20 corre a enero
  const eventos = [];

  const f29Base = `${year}-${String(mes1a12).padStart(2,'0')}-20`;
  eventos.push({ fecha: siguienteDiaHabil(f29Base, festivosSet), tipo: 'f29', label: 'Pago F-29' });

  eventos.push({ fecha: ultimoDiaHabilDelMes(year, mes1a12, festivosSet), tipo: 'acuse', label: 'Acuse de recibo' });

  eventos.push({ fecha: `${year}-${String(mes1a12).padStart(2,'0')}-13`, tipo: 'cotizaciones', label: 'Pago de cotizaciones' });

  if(mes1a12 === 4){
    eventos.push({ fecha: `${year}-04-30`, tipo: 'renta', label: 'Envío Declaración Renta' });
  }
  return eventos;
}

function cambiarMesCalendario(delta){
  const [y,m] = calendarioMes.split('-').map(Number);
  let ny = y, nm = m + delta;
  if(nm < 1){ nm = 12; ny--; } else if(nm > 12){ nm = 1; ny++; }
  calendarioMes = `${ny}-${String(nm).padStart(2,'0')}`;
  renderApp();
}

// Requerimientos pendientes (no Resuelto) que el usuario actual puede ver,
// con fecha de respuesta, listos para pintarse en el calendario.
function requerimientosParaCalendario(){
  return state.requerimientos.filter(r => r.fechaRespuesta && r.estado !== 'Resuelto' && puedeVerRequerimiento(r, currentUser));
}

// Eventos (fijos + reuniones) que caen en la semana calendario (lunes a
// domingo) que contiene la fecha de hoy — independiente del mes que se esté
// navegando en el mini calendario.
function eventosDeLaSemanaActual(){
  const hoy = todayISO();
  const dow = new Date(hoy + 'T00:00:00Z').getUTCDay(); // 0=domingo
  const offsetLunes = (dow + 6) % 7;
  const lunes = sumarDias(hoy, -offsetLunes);
  const domingo = sumarDias(lunes, 6);

  const mesesRelevantes = new Set([lunes.slice(0,7), domingo.slice(0,7)]);
  let fijos = [];
  mesesRelevantes.forEach(ym => {
    const [yy, mm] = ym.split('-').map(Number);
    fijos.push(...eventosTributariosDelMes(yy, mm));
  });
  fijos = fijos.filter(e => e.fecha >= lunes && e.fecha <= domingo).map(e => ({ ...e, esReunion: false }));

  const reuniones = (state.reuniones||[])
    .filter(r => r.fecha && r.fecha >= lunes && r.fecha <= domingo)
    .map(r => ({ fecha: r.fecha, hora: r.hora, tipo: 'reunion', label: r.lugar, id: r.id, esReunion: true }));

  const requerimientos = requerimientosParaCalendario()
    .filter(r => r.fechaRespuesta >= lunes && r.fechaRespuesta <= domingo)
    .map(r => ({ fecha: r.fechaRespuesta, tipo: 'requerimiento', label: `${r.tipo}${r.descripcion ? ' — ' + r.descripcion : ''}`, id: r.id, esReunion: false, esRequerimiento: true }));

  const eventos = [...fijos, ...reuniones, ...requerimientos].sort((a,b) => a.fecha.localeCompare(b.fecha) || (a.hora||'').localeCompare(b.hora||''));
  return { lunes, domingo, eventos };
}

// Grilla del mini calendario tributario (mes navegable + eventos por día).
// Usada por el panel "Calendario tributario" de Inicio.
function calendarioMiniGrid(){
  if(!calendarioMes) calendarioMes = new Date().toISOString().slice(0,7);
  const [year, mesStr] = calendarioMes.split('-');
  const y = Number(year), m = Number(mesStr);

  const eventosFijos = eventosTributariosDelMes(y, m).filter(e => e.fecha.startsWith(calendarioMes));
  const reunionesDelMes = (state.reuniones||[]).filter(r => r.fecha && r.fecha.startsWith(calendarioMes));

  const porDia = {};
  eventosFijos.forEach(e => {
    const dia = Number(e.fecha.split('-')[2]);
    (porDia[dia] = porDia[dia] || []).push({ ...e, esReunion: false });
  });
  reunionesDelMes.forEach(r => {
    const dia = Number(r.fecha.split('-')[2]);
    (porDia[dia] = porDia[dia] || []).push({ tipo: 'reunion', label: r.lugar, hora: r.hora, id: r.id, esReunion: true });
  });
  requerimientosParaCalendario()
    .filter(r => r.fechaRespuesta.startsWith(calendarioMes))
    .forEach(r => {
      const dia = Number(r.fechaRespuesta.split('-')[2]);
      (porDia[dia] = porDia[dia] || []).push({ tipo: 'requerimiento', label: `${r.tipo}${r.descripcion ? ' — ' + r.descripcion : ''}`, id: r.id, esReunion: false, esRequerimiento: true });
    });

  const diasEnMes = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const primerDow = new Date(Date.UTC(y, m-1, 1)).getUTCDay(); // 0=domingo
  const offsetLunes = (primerDow + 6) % 7; // celdas vacías antes del día 1 (semana empieza lunes)

  const celdas = [];
  for(let i=0;i<offsetLunes;i++) celdas.push(null);
  for(let d=1; d<=diasEnMes; d++) celdas.push(d);
  while(celdas.length % 7 !== 0) celdas.push(null);

  return `
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
      <button onclick="cambiarMesCalendario(-1)" style="border:none;background:none;cursor:pointer;color:#6b6a5f;font-size:15px;padding:2px 6px;">←</button>
      <span style="font-size:12px;font-weight:600;min-width:92px;text-align:center;">${mesLabel(calendarioMes)}</span>
      <button onclick="cambiarMesCalendario(1)" style="border:none;background:none;cursor:pointer;color:#6b6a5f;font-size:15px;padding:2px 6px;">→</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:9px;color:#9a9689;margin-bottom:3px;">
      ${DIAS_SEMANA_CORTO.map(d=>`<div>${d[0]}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px;">
      ${celdas.map(d => {
        if(!d) return `<div></div>`;
        const fechaISO = `${calendarioMes}-${String(d).padStart(2,'0')}`;
        const esHoy = fechaISO === todayISO();
        const eventosDia = porDia[d] || [];
        return `
          <div style="min-height:30px;border-radius:5px;padding:2px 0 3px;cursor:pointer;${esHoy?'box-shadow:inset 0 0 0 1.5px var(--teal-dark);':''}" onclick="abrirReunionModal('${fechaISO}')" title="Agregar reunión el ${fechaISO}">
            <div style="font-size:10px;color:#8a8879;text-align:center;">${d}</div>
            <div style="display:flex;justify-content:center;gap:2px;margin-top:2px;">
              ${eventosDia.slice(0,3).map(e => `<span onclick="event.stopPropagation(); ${e.esReunion ? `verReunion('${e.id}')` : e.esRequerimiento ? `setTab('requerimientos')` : ''}" style="display:inline-block;width:5px;height:5px;border-radius:50%;${CALENDARIO_COLOR_TIPO[e.tipo]||''}" title="${escapeAttr(e.esReunion ? `${e.hora} · ${e.label}` : e.label)}"></span>`).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:7px;font-size:9px;color:#8a8879;">
      ${CALENDARIO_LEYENDA.map(([tipo,label]) => `<span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;${CALENDARIO_COLOR_TIPO[tipo]}"></span>${label}</span>`).join('')}
    </div>
  `;
}

// Lista de eventos (plazos fijos + reuniones) de la semana calendario actual.

async function submitReunion(){
  const fecha = document.getElementById('reunFecha').value;
  const hora = document.getElementById('reunHora').value;
  const lugar = document.getElementById('reunLugar').value.trim();
  const conQuien = document.getElementById('reunConQuien').value.trim();
  const temas = document.getElementById('reunTemas').value.trim();
  const participantes = Array.from(document.querySelectorAll('.reun-participante:checked')).map(cb => cb.value);
  const checkAgendaEduardo = document.getElementById('reunAgendaEduardo');
  const agendaDe = (checkAgendaEduardo && checkAgendaEduardo.checked) ? EDUARDO_ID : null;
  if(!fecha) return showToast('Selecciona una fecha.');
  if(!hora) return showToast('Selecciona una hora.');
  if(!lugar) return showToast('Escribe el lugar de la reunión.');
  if(!state.reuniones) state.reuniones = [];
  state.reuniones.push({ id: uid('reu'), fecha, hora, lugar, conQuien, temas, participantes, agendaDe, creadoPor: currentUser.id });
  await saveReuniones();
  cerrarReunionModal();
  showToast('Reunión agendada.');
  renderApp();
}

async function eliminarReunion(id){
  if(!confirm('¿Eliminar esta reunión? Esta acción no se puede deshacer.')) return;
  state.reuniones = (state.reuniones||[]).filter(r => r.id !== id);
  await saveReuniones();
  cerrarReunionModal();
  renderApp();
  showToast('Reunión eliminada.');
}

// Adjunta una minuta a una reunión ya agendada, reutilizando el mismo
// backend de subida que usan los archivos de clientes (subirArchivoDrive),
// con un nombre de subcarpeta fijo para que todas las minutas queden juntas
// en Drive. La carpeta "Minutas de Reuniones" en la vista consolidada de
// Archivos (ver archivosContent) se arma listando estos archivos.
async function subirArchivoReunion(reunionId){
  const input = document.getElementById('reunArchivoInput');
  const file = input && input.files && input.files[0];
  if(!file){ showToast('Elige un archivo primero.'); return; }
  const LIMITE_BYTES = 5 * 1024 * 1024;
  if(file.size > LIMITE_BYTES){ showToast('El archivo es muy grande (máx. 5 MB).'); return; }

  const r = (state.reuniones||[]).find(x => x.id === reunionId);
  if(!r) return;

  const boton = document.getElementById('reunArchivoBtn');
  if(boton){ boton.disabled = true; boton.textContent = 'Subiendo…'; }
  try{
    const contenidoBase64 = await leerArchivoComoBase64(file);
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'subirArchivo',
        token: API_TOKEN,
        clienteId: 'reuniones',
        clienteNombre: 'Minutas de Reuniones',
        nombreArchivo: file.name,
        mimeType: file.type || 'application/octet-stream',
        contenidoBase64
      })
    });
    const data = await res.json();
    if(!data || !data.ok){ showToast('No se pudo subir la minuta.'); return; }

    if(!r.archivos) r.archivos = [];
    r.archivos.push({
      nombre: data.nombre || file.name, url: data.url, driveFileId: data.id,
      fecha: todayISO(), subidoPor: currentUser.name, categoria: 'Minutas de Reuniones'
    });
    await saveReuniones();
    renderReunionModal();
    showToast('Minuta adjuntada.');
  }catch(err){
    console.error('Error al subir minuta:', err);
    showToast('Error al subir la minuta.');
  }finally{
    if(boton){ boton.disabled = false; boton.textContent = 'Adjuntar minuta'; }
  }
}

async function quitarArchivoReunion(reunionId, index){
  const r = (state.reuniones||[]).find(x => x.id === reunionId);
  if(!r || !r.archivos) return;
  r.archivos.splice(index, 1);
  await saveReuniones();
  renderReunionModal();
}

// agendamiento. La reunión sigue apareciendo también en el calendario
// general (calendarioMiniGrid/tareasSemanaLista) — esto solo la destaca

      ${pasadas.length ? `

async function submitTrabajoEspecial(linea){
  linea = linea || 'contabilidad';
  const titulo = document.getElementById('teTitulo').value.trim();
  const descripcion = document.getElementById('teDescripcion').value.trim();
  const clienteId = document.getElementById('teCliente').value || null;
  const asignadoA = document.getElementById('teAsignado').value;
  const fechaLimite = document.getElementById('teFechaLimite').value;
  const montoParsed = parseFloat(document.getElementById('teMontoUF').value);
  const montoUF = isNaN(montoParsed) ? null : montoParsed;
  if(!titulo) return showToast('Escribe un título para el trabajo.');
  if(!asignadoA) return showToast('Selecciona a quién se asigna.');
  state.trabajosEspeciales.push({
    id: uid('te'), titulo, descripcion, clienteId, asignadoA, montoUF, linea,
    asignadoPor: currentUser.id, fechaCreacion: todayISO(), fechaLimite, estado: 'Pendiente', archivos: []
  });
  await saveTrabajosEspeciales();
  showToast('Trabajo especial asignado.');
  renderApp();
}

async function setTrabajoEspecialEstado(id, estado){
  const t = state.trabajosEspeciales.find(t => t.id === id);
  if(!t) return;
  t.estado = estado;
  await saveTrabajosEspeciales();
}

async function removeTrabajoEspecial(id){
  if(!confirm('¿Eliminar este trabajo especial? Esta acción no se puede deshacer.')) return;
  state.trabajosEspeciales = state.trabajosEspeciales.filter(t => t.id !== id);
  await saveTrabajosEspeciales();
  renderApp();
  showToast('Trabajo especial eliminado.');
}

// Adjuntos de un trabajo especial (Word, Excel, PDF, imágenes, etc): solo
// lectura — para agregar o quitar uno hay que ir a la sección "Archivos"
// (ver archivosContent()), que es el único lugar desde donde se suben.
// Aquí solo se listan como referencia rápida mientras se revisa el trabajo.
function trabajoArchivosViewHtml(t){
  const archivos = t.archivos || [];
  if(!archivos.length) return `<span class="text-xs text-gray-400">Sin archivos</span>`;
  return `
    <div class="flex flex-wrap items-center gap-1.5">
      ${archivos.map(a => `
        <a href="${escapeAttr(a.url)}" target="_blank" rel="noopener" class="inline-flex items-center bg-gray-100 rounded-full px-2.5 py-1 text-xs text-[var(--teal-dark)] hover:underline max-w-[140px] truncate">${escapeHtml(a.nombre)}</a>
      `).join('')}
    </div>
  `;
}

async function subirArchivoTrabajoEspecial(trabajoId, inputEl){
  const file = inputEl && inputEl.files && inputEl.files[0];
  if(!file) return;
  const LIMITE_BYTES = 5 * 1024 * 1024;
  if(file.size > LIMITE_BYTES){ showToast('El archivo es muy grande (máx. 5 MB).'); inputEl.value = ''; return; }
  const t = state.trabajosEspeciales.find(x => x.id === trabajoId);
  if(!t) return;
  try{
    const contenidoBase64 = await leerArchivoComoBase64(file);
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'subirArchivo',
        token: API_TOKEN,
        clienteId: 'te_' + t.id,
        clienteNombre: 'Trabajo especial - ' + (t.titulo || '').slice(0, 60),
        nombreArchivo: file.name,
        mimeType: file.type || 'application/octet-stream',
        contenidoBase64
      })
    });
    const data = await res.json();
    if(!data || !data.ok){ showToast('No se pudo subir el archivo.'); return; }
    if(!t.archivos) t.archivos = [];
    t.archivos.push({ nombre: data.nombre || file.name, url: data.url, driveFileId: data.id, fecha: todayISO(), subidoPor: currentUser.name });
    await saveTrabajosEspeciales();
    showToast('Archivo adjuntado.');
    renderApp();
  }catch(err){
    console.error('Error al subir archivo de trabajo especial:', err);
    showToast('Error al subir el archivo.');
  }finally{
    inputEl.value = '';
  }
}

async function quitarArchivoTrabajoEspecial(trabajoId, index){
  const t = state.trabajosEspeciales.find(x => x.id === trabajoId);
  if(!t || !t.archivos) return;
  t.archivos.splice(index, 1);
  await saveTrabajosEspeciales();

}

// Encabezado de sección (Vencidos/Próximos a vencer/Pendientes/Resueltos)
// entre filas de la tabla de Requerimientos. Si la lista ya viene filtrada
// a una sola categoría (chip activo, o simplemente no hay variedad), no
// tiene sentido repetir el encabezado — se pinta plano.
function filasRequerimientosConEncabezado(list, renderFila){
  const distintos = new Set(list.map(categoriaUrgenciaRequerimiento));
  if(distintos.size <= 1) return list.map(renderFila).join('');
  let filas = '';
  let catAnterior;
  list.forEach(r => {
    const cat = categoriaUrgenciaRequerimiento(r);
    if(cat !== catAnterior){
      catAnterior = cat;
      filas += `<tr><td colspan="7" style="padding:8px 16px;background:var(--paper-2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#6b6a5f;border-top:2px solid var(--ink);">${ETIQUETA_URGENCIA_REQUERIMIENTO[cat]}</td></tr>`;
    }
    filas += renderFila(r);
  });
  return filas;
}
