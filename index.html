/* ==================== F-29 (estimación de impuestos mensuales) ====================
 * Sección aparte de "Confección Iva" (que solo registra el estado de envío
 * del F-29 real ante el SII, ver f29Table()/setF29Status() en Obligaciones
 * Tributarias). Esta sección CALCULA una estimación mensual de IVA, PPM y
 * retenciones por cliente, a partir de un formato de trabajo interno
 * (planilla "Propuesta F-29"), y arma un resumen ejecutivo imprimible/PDF
 * con los conceptos por los que el cliente pagará.
 *
 * Alcance deliberadamente acotado: cubre IVA (ventas/compras habituales),
 * PPM y las retenciones de renta más comunes (honorarios, sueldos, etc.),
 * que es el caso de la enorme mayoría de los clientes. Mecanismos poco
 * frecuentes del Formulario 29 real (cambio de sujeto, créditos especiales,
 * tributación simplificada, impuestos adicionales a bebidas/licores, etc.)
 * NO se modelan campo por campo — se cubren con la sección genérica
 * "Ajustes adicionales" (líneas libres +/-), para no tener que replicar las
 * ~140 líneas del formulario oficial.
 */

const F29_VENTAS_EXENTAS = [
  'Exportaciones',
  'Ventas y/o Servicios Exentos del Giro',
  'Ventas y/o Servicios exentos que no son del giro',
  'Facturas de Compra recibidas con retención total',
  'Facturas de Compra recibidas con retención parcial',
];

const F29_VENTAS_AFECTAS = [
  { label:'Facturas emitidas', tasa:0.19 },
  { label:'Facturas por Inmuebles', tasa:0.19 },
  { label:'Facturas por Activo Fijo', tasa:0.19 },
  { label:'Boletas', tasa:0.19 },
  { label:'Comprobantes de pago', tasa:0.19 },
  { label:'Notas de débito emitidas', tasa:0.19 },
  { label:'Notas de crédito emitidas por factura', tasa:0.19, resta:true },
  { label:'Notas de crédito emitidas por boletas', tasa:0.19, resta:true },
  { label:'Facturas de compra retención parcial', tasa:0.15 },
  { label:'Liquidación Factura', tasa:0.19 },
];

const F29_COMPRAS_SIN_DERECHO = [
  'Internas afectas',
  'Importaciones',
  'Internas exentas o no gravadas',
];

const F29_COMPRAS_CON_DERECHO = [
  { label:'Facturas recibidas', tasa:0.19 },
  { label:'Facturas de Compra emitidas con retención 19%', tasa:0.19 },
  { label:'Facturas de Compra emitidas con retención 11%', tasa:0.19 },
  { label:'Facturas activo fijo', tasa:0.19 },
  { label:'Notas de crédito recibidas', tasa:0.19, resta:true },
  { label:'Notas de débito recibidas', tasa:0.19 },
  { label:'Declaraciones de Ingreso (importaciones)', tasa:0.19 },
  { label:'Impuesto específico Diesel Agrícola', tasa:1 },
  { label:'Impuesto específico Diesel Transportistas', tasa:1 },
];

// tasa:null → el monto ingresado ES la retención (no se multiplica por nada),
// para casos como la retención única a trabajadores que no sale de aplicar
// un % fijo. En los demás, "monto" es la base imponible y "tasa" es editable
// (estas tasas cambian por ley de tanto en tanto).
const F29_RETENCIONES_RENTA = [
  { label:'Retención Impuesto Único a los Trabajadores', tasa:null },
  { label:'Retención Art. 42 N°2 LIR (Honorarios)', tasa:0.1525 },
  { label:'Retención Art. 48 LIR (Directores/Consejeros)', tasa:0.10 },
  { label:'Retención Art. 42 N°1 LIR (Sueldos, reintegro préstamo tasa 0%)', tasa:0.03 },
  { label:'Retención Art. 42 N°2 LIR (Honorarios, reintegro préstamo tasa 0%)', tasa:0.03 },
];

function periodoActualISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function periodoAnteriorISO(periodo){
  const [y, m] = periodo.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function periodoLabel(periodo){
  const [y, m] = periodo.split('-').map(Number);
  return `${MESES_NOMBRE[m-1]} ${y}`;
}

// Sugerencia de fecha límite: día 20 del mes siguiente al período tributario
// (cuando el F-29 real se paga), corrida al siguiente día hábil. Editable
// por el usuario porque el día exacto varía según el medio de declaración.
function fechaLimiteF29Sugerida(periodo){
  const [y, m] = periodo.split('-').map(Number);
  const d = new Date(y, m, 1); // m (1-based del período) cae en el mes siguiente al pasarlo como índice 0-based
  const ySig = d.getFullYear(), mSig = d.getMonth() + 1;
  const festivosSet = new Set([...festivosChile(ySig), ...festivosChile(ySig+1)]);
  return siguienteDiaHabil(`${ySig}-${String(mSig).padStart(2,'0')}-20`, festivosSet);
}

function obtenerEstimacionF29(clienteId, periodo){
  return (state.estimacionesF29||[]).find(e => e.clienteId === clienteId && e.periodo === periodo);
}

function nuevaEstimacionF29Vacia(clienteId, periodo){
  const anterior = obtenerEstimacionF29(clienteId, periodoAnteriorISO(periodo));
  const calcAnterior = anterior ? calcularF29(anterior) : null;
  return {
    id: uid('f29e'),
    clienteId, periodo,
    ventasExentas: F29_VENTAS_EXENTAS.map(() => ({ docs:'', monto:0 })),
    ventasAfectas: F29_VENTAS_AFECTAS.map(c => ({ docs:'', monto:0, tasa:c.tasa })),
    comprasSinDerecho: F29_COMPRAS_SIN_DERECHO.map(() => ({ docs:'', monto:0 })),
    comprasConDerecho: F29_COMPRAS_CON_DERECHO.map(c => ({ docs:'', monto:0, tasa:c.tasa })),
    remanenteCreditoFiscalAnterior: calcAnterior ? calcAnterior.remanenteCreditoFiscalSiguiente : 0,
    retenciones: F29_RETENCIONES_RENTA.map(c => ({ monto:0, tasa:c.tasa })),
    ppmTasa: 0.01,
    ajustesAdicionales: [],
    fechaLimitePago: fechaLimiteF29Sugerida(periodo),
    notas: '',
    creadoPor: currentUser.name,
    fechaCreacion: todayISO(),
  };
}

// Cálculo puro: no lee ni escribe estado global, solo transforma la
// estimación en los totales del resumen ejecutivo. Se recalcula en cada
// render de la pestaña F-29 (no hay nada cacheado).
function calcularF29(est){
  const totalExentos = (est.ventasExentas||[]).reduce((s,r) => s + (Number(r.monto)||0), 0);

  let totalNetosAfectos = 0, totalDebitos = 0;
  const ventasAfectasDetalle = (est.ventasAfectas||[]).map((r,i) => {
    const cfg = F29_VENTAS_AFECTAS[i];
    const monto = Number(r.monto) || 0;
    const debito = Math.round(monto * (Number(r.tasa)||0));
    const signo = cfg.resta ? -1 : 1;
    totalNetosAfectos += signo * monto;
    totalDebitos += signo * debito;
    return { label: cfg.label, monto, debito, resta: !!cfg.resta };
  });

  const totalComprasSinDerecho = (est.comprasSinDerecho||[]).reduce((s,r) => s + (Number(r.monto)||0), 0);

  let totalCreditos = 0;
  const comprasConDerechoDetalle = (est.comprasConDerecho||[]).map((r,i) => {
    const cfg = F29_COMPRAS_CON_DERECHO[i];
    const monto = Number(r.monto) || 0;
    const credito = Math.round(monto * (Number(r.tasa)||0));
    const signo = cfg.resta ? -1 : 1;
    totalCreditos += signo * credito;
    return { label: cfg.label, monto, credito, resta: !!cfg.resta };
  });

  const remanenteCreditoFiscalAnterior = Number(est.remanenteCreditoFiscalAnterior) || 0;
  const totalCreditosConRemanente = totalCreditos + remanenteCreditoFiscalAnterior;

  const retencionesDetalle = (est.retenciones||[]).map((r,i) => {
    const cfg = F29_RETENCIONES_RENTA[i];
    const monto = cfg.tasa == null ? (Number(r.monto)||0) : Math.round((Number(r.monto)||0) * (Number(r.tasa)||0));
    return { label: cfg.label, monto };
  });
  const totalRetenciones = retencionesDetalle.reduce((s,r) => s + r.monto, 0);

  const ppmBase = totalNetosAfectos + totalExentos;
  const ppmTasa = Number(est.ppmTasa) || 0;
  const ppmMonto = Math.round(ppmBase * ppmTasa);

  const ivaDeterminado = totalDebitos - totalCreditosConRemanente;
  const ivaAPagar = Math.max(ivaDeterminado, 0);
  const remanenteCreditoFiscalSiguiente = Math.max(-ivaDeterminado, 0);

  let ajustesNeto = 0;
  const ajustesDetalle = (est.ajustesAdicionales||[]).map(a => {
    const monto = Number(a.monto) || 0;
    const signado = a.signo === 'resta' ? -monto : monto;
    ajustesNeto += signado;
    return { concepto: a.concepto, monto, signo: a.signo, signado };
  });

  const totalAPagar = ivaAPagar + totalRetenciones + ppmMonto + ajustesNeto;

  return {
    totalExentos, totalNetosAfectos, totalDebitos, ventasAfectasDetalle,
    totalComprasSinDerecho, totalCreditos, comprasConDerechoDetalle,
    remanenteCreditoFiscalAnterior, totalCreditosConRemanente,
    ivaDeterminado, ivaAPagar, remanenteCreditoFiscalSiguiente,
    retencionesDetalle, totalRetenciones,
    ppmBase, ppmTasa, ppmMonto,
    ajustesDetalle, ajustesNeto,
    totalAPagar,
  };
}

// Carga (o crea) el borrador en memoria f29FormActual para el cliente y
// período actualmente elegidos. Se clona con JSON.parse/stringify para que
// los cambios en el formulario no muten state.estimacionesF29 hasta que se
// presione "Calcular y guardar estimación" (ver guardarEstimacionF29).
function cargarFormularioF29(){
  if(!estimacionF29ClienteId || !estimacionF29Periodo){ f29FormActual = null; return; }
  const existente = obtenerEstimacionF29(estimacionF29ClienteId, estimacionF29Periodo);
  f29FormActual = existente ? JSON.parse(JSON.stringify(existente)) : nuevaEstimacionF29Vacia(estimacionF29ClienteId, estimacionF29Periodo);
}

function setEstimacionF29Cliente(id){
  estimacionF29ClienteId = id;
  f29FormActual = null;
  renderApp();
}

function setEstimacionF29Periodo(periodo){
  estimacionF29Periodo = periodo;
  f29FormActual = null;
  renderApp();
}

// Estas dos NO llaman renderApp() (perdería el foco/cursor en cada tecleo).
// En cambio llaman a actualizarF29EnVivo(), que recalcula con calcularF29()
// y actualiza por DOM directo solo las celdas de totales, la barra de
// estado y el resumen ejecutivo — sin tocar los inputs. El botón "Guardar
// estimación" solo persiste el borrador que ya se ve calculado en pantalla.
function f29SetRowCampo(seccion, idx, campo, valor){
  if(!f29FormActual) return;
  const row = f29FormActual[seccion] && f29FormActual[seccion][idx];
  if(!row) return;
  row[campo] = campo === 'docs' ? valor : (parseFloat(valor) || 0);
  actualizarF29EnVivo();
}

function f29SetCampo(campo, valor){
  if(!f29FormActual) return;
  f29FormActual[campo] = (campo === 'fechaLimitePago' || campo === 'notas') ? valor : (parseFloat(valor) || 0);
  actualizarF29EnVivo();
}

// Recalcula F-29 en vivo cada vez que se edita un monto/tasa/remanente,
// actualizando por DOM directo (nunca renderApp()) las celdas de totales de
// cada tabla, la barra de estado y el resumen ejecutivo. Este último es una
// tarjeta de solo lectura (sin inputs), así que regenerarla entera en cada
// tecleo es segura y no pierde foco en ningún campo.
function actualizarF29EnVivo(){
  if(!f29FormActual) return;
  const calc = calcularF29(f29FormActual);
  const setTexto = (id, texto) => { const el = document.getElementById(id); if(el) el.textContent = texto; };

  setTexto('f29subtotal-monto-ventasExentas', '$' + formatoCLP(calc.totalExentos));

  calc.ventasAfectasDetalle.forEach((r,i) => setTexto(`f29rowcalc-ventasAfectas-${i}`, '$' + formatoCLP(r.debito)));
  setTexto('f29subtotal-monto-ventasAfectas', '$' + formatoCLP(calc.totalNetosAfectos));
  setTexto('f29subtotal-calc-ventasAfectas', '$' + formatoCLP(calc.totalDebitos));

  setTexto('f29subtotal-monto-comprasSinDerecho', '$' + formatoCLP(calc.totalComprasSinDerecho));

  calc.comprasConDerechoDetalle.forEach((r,i) => setTexto(`f29rowcalc-comprasConDerecho-${i}`, '$' + formatoCLP(r.credito)));
  const totalNetoComprasConDerecho = calc.comprasConDerechoDetalle.reduce((s,r) => s + (r.resta ? -1 : 1) * r.monto, 0);
  setTexto('f29subtotal-monto-comprasConDerecho', '$' + formatoCLP(totalNetoComprasConDerecho));
  setTexto('f29subtotal-calc-comprasConDerecho', '$' + formatoCLP(calc.totalCreditos));

  calc.retencionesDetalle.forEach((r,i) => setTexto(`f29rowcalc-retenciones-${i}`, '$' + formatoCLP(r.monto)));
  setTexto('f29subtotal-retenciones', '$' + formatoCLP(calc.totalRetenciones));

  setTexto('f29PpmBase', '$' + formatoCLP(calc.ppmBase));
  setTexto('f29PpmMonto', '$' + formatoCLP(calc.ppmMonto));

  setTexto('f29BarDebito', '$' + formatoCLP(calc.totalDebitos));
  setTexto('f29BarCredito', '$' + formatoCLP(calc.totalCreditosConRemanente));
  setTexto('f29BarIva', (calc.ivaDeterminado < 0 ? '−' : '') + '$' + formatoCLP(Math.abs(calc.ivaDeterminado)));
  setTexto('f29BarTotal', '$' + formatoCLP(Math.max(calc.totalAPagar, 0)));

  const resumenCard = document.getElementById('f29ResumenCard');
  if(resumenCard){
    const cliente = state.clientes.find(c => c.id === f29FormActual.clienteId);
    if(cliente) resumenCard.innerHTML = resumenEjecutivoF29Html(cliente, f29FormActual.periodo, calc, f29FormActual);
  }
}

function f29AgregarAjuste(){
  if(!f29FormActual) return;
  const concepto = (document.getElementById('f29AjusteConcepto').value||'').trim();
  const monto = parseFloat(document.getElementById('f29AjusteMonto').value) || 0;
  const signo = document.getElementById('f29AjusteSigno').value;
  if(!concepto) return showToast('Escribe un concepto para el ajuste.');
  if(!monto) return showToast('Ingresa un monto para el ajuste.');
  f29FormActual.ajustesAdicionales.push({ concepto, monto, signo });
  renderApp();
}

function f29QuitarAjuste(idx){
  if(!f29FormActual) return;
  f29FormActual.ajustesAdicionales.splice(idx, 1);
  renderApp();
}

async function guardarEstimacionF29(){
  if(!f29FormActual) return;
  f29FormActual.actualizadoPor = currentUser.name;
  f29FormActual.fechaActualizacion = todayISO();
  const copia = JSON.parse(JSON.stringify(f29FormActual));
  if(!state.estimacionesF29) state.estimacionesF29 = [];
  const idx = state.estimacionesF29.findIndex(e => e.id === copia.id);
  if(idx >= 0) state.estimacionesF29[idx] = copia; else state.estimacionesF29.push(copia);
  await saveEstimacionesF29();
  await marcarF29GuardadoSiPeriodoActual(copia.clienteId, copia.periodo);
  showToast('Estimación F-29 calculada y guardada.');
  renderApp();
}

// Si la estimación recién guardada es la del mes en curso, refleja el avance
// también en la nómina de "Confección Iva" (Obligaciones Tributarias), para
// no tener que marcar "Guardado" dos veces a mano. No retrocede un estado
// "Enviado" (si el F-29 real ya se presentó al SII, eso manda por sobre la
// estimación) ni pisa un "Guardado" ya puesto por otro medio.
async function marcarF29GuardadoSiPeriodoActual(clienteId, periodo){
  if(periodo !== periodoActualISO()) return;
  const c = state.clientes.find(c => c.id === clienteId);
  if(!c || c.f29Estado === 'enviado' || c.f29Estado === 'guardado') return;
  c.f29Estado = 'guardado';
  await saveClientes();
}

    const label = cfg.label || cfg;
    return `

            <td class="py-2 pr-3 text-right font-bold mono" id="f29subtotal-monto-${seccion}">$${formatoCLP(totalMonto)}</td>

// Tarjeta final: es lo único que queda visible al imprimir/descargar PDF
// (todo lo demás en estimacionF29Content() está envuelto en .no-print).
function resumenEjecutivoF29Html(cliente, periodo, calc, est){
  const conceptos = [];
  if(calc.ivaAPagar > 0) conceptos.push({ label:'Impuesto determinado', monto: calc.ivaAPagar });
  if(calc.ppmMonto > 0) conceptos.push({ label:'PPM (Pago Provisional Mensual)', monto: calc.ppmMonto });
  calc.retencionesDetalle.forEach(r => { if(r.monto > 0) conceptos.push({ label: r.label, monto: r.monto }); });
  calc.ajustesDetalle.forEach(a => { if(a.signado !== 0) conceptos.push({ label: a.concepto, monto: a.signado }); });

// html2pdf.js (192 KB comprimidos) se usa solo para este botón, así que se
// carga bajo demanda recién cuando se pide un PDF por primera vez — antes se
// descargaba siempre, de forma bloqueante, en el <head>, aunque la enorme
// mayoría de las visitas nunca lo usa. Queda en caché (la promesa) para que
// un segundo PDF en la misma sesión no la vuelva a pedir.
let html2pdfCargaPromise = null;
function asegurarHtml2pdf(){
  if(typeof html2pdf !== 'undefined') return Promise.resolve();
  if(!html2pdfCargaPromise){
    html2pdfCargaPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      s.onload = () => resolve();
      s.onerror = () => { html2pdfCargaPromise = null; reject(new Error('No se pudo cargar html2pdf')); };
      document.head.appendChild(s);
    });
  }
  return html2pdfCargaPromise;
}

// Genera el PDF del Resumen Ejecutivo F-29 directamente con html2pdf.js, sin
// pasar por el diálogo de impresión del navegador. Si la librería no llega a
// cargar (por ejemplo, sin conexión a internet), cae de respaldo al diálogo
// de impresión de siempre para no dejar a la persona sin ninguna salida.
function descargarResumenF29Pdf(){
  const el = document.getElementById('f29ResumenCardInner');
  if(!el) return;
  const boton = document.getElementById('f29BotonPdf');
  const textoOriginal = boton ? boton.textContent : '';
  if(boton){ boton.textContent = 'Preparando PDF…'; boton.disabled = true; }

  asegurarHtml2pdf().then(() => {
    const cliente = state.clientes.find(c => c.id === estimacionF29ClienteId);
    const slug = (s) => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'cliente';
    const nombreArchivo = `F29_${slug(cliente && cliente.name)}_${estimacionF29Periodo||''}.pdf`;

    if(boton) boton.textContent = 'Generando PDF…';
    html2pdf().set({
      margin: 10,
      filename: nombreArchivo,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, backgroundColor: '#FBFAF6' },
      jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
    }).from(el).save().catch(() => {
      showToast('No se pudo generar el PDF. Intenta de nuevo.');
    }).finally(() => {
      if(boton){ boton.textContent = textoOriginal; boton.disabled = false; }
    });
  }).catch(() => {
    showToast('No se pudo cargar el generador de PDF; se abre el diálogo de impresión.');
    window.print();
    if(boton){ boton.textContent = textoOriginal; boton.disabled = false; }
  });
}

// Declaraciones juradas de renta más comunes por año tributario. Roster fijo:
// todas las empresas con régimen tributario definido y distinto de "Persona Natural".
function empresasParaDeclaracionesJuradas(verTodo){
  const base = verTodo ? clientesEnSucursalActiva() : state.clientes.filter(c => carterasDeUsuario(currentUser).includes(c.encargadoId));
  return base.filter(c => c.regimenTributario && c.regimenTributario !== 'Persona Natural');
}

let declaracionesJuradasAnio = null;
function aniosDeclaracionesJuradas(){
  const actual = Math.max(new Date().getFullYear(), 2026);
  const anios = [];
  for(let y = 2026; y <= actual + 1; y++) anios.push(String(y));
  return anios;
}

async function toggleDeclaracionJurada(clienteId, anio, idx, checked){
  const c = state.clientes.find(c => c.id === clienteId);
  if(!c) return;
  const dj = state.declaracionesJuradasPlantilla[idx];
  if(!dj) return;
  if(!c.declaracionesJuradas) c.declaracionesJuradas = {};
  if(!c.declaracionesJuradas[anio]) c.declaracionesJuradas[anio] = {};
  c.declaracionesJuradas[anio][dj] = checked;
  await saveClientes();
  // Re-render parcial: solo se actualiza el % de esta fila, no toda la tabla.
  const plantilla = state.declaracionesJuradasPlantilla;
  const registro = c.declaracionesJuradas[anio];
  const hechas = plantilla.filter(t => registro[t]).length;
  const pct = plantilla.length ? Math.round((hechas/plantilla.length)*100) : 0;
  const pctCell = document.getElementById(`djPct_${clienteId}_${anio}`);
  if(pctCell){
    pctCell.textContent = pct + '%';
    pctCell.className = `text-center px-3 py-3 font-semibold ${pct===100?'text-green-600':'text-gray-500'}`;
  }
}

async function agregarDeclaracionJuradaPlantilla(){
  const input = document.getElementById('nuevaDJInput');
  const val = input.value.trim();
  if(!val) return;
  if(state.declaracionesJuradasPlantilla.includes(val)) return showToast('Esa declaración ya existe en la lista.');
  state.declaracionesJuradasPlantilla.push(val);
  await saveConfig();
  renderApp();
}

async function quitarDeclaracionJuradaPlantilla(index){
  state.declaracionesJuradasPlantilla.splice(index, 1);
  await saveConfig();
  renderApp();
}

async function submitObligacion(){
  const clienteSel = document.getElementById('obCliente');
  const clienteId = clienteSel.value;
  const tipo = document.getElementById('obTipo').value;
  const periodo = document.getElementById('obPeriodo').value.trim();
  const fechaLimite = document.getElementById('obFechaLimite').value;
  if(!clienteId) return showToast('Selecciona un cliente.');
  state.obligaciones.push({ id: uid('ob'), clienteId, tipo, periodo, fechaLimite, estado: 'Pendiente' });
  await saveObligaciones();
  showToast('Obligación agregada.');
  renderApp();
}

async function setObligacionEstado(id, estado){
  const o = state.obligaciones.find(o => o.id === id);
  if(!o) return;
  o.estado = estado;
  await saveObligaciones();
}

async function removeObligacion(id){
  if(!confirm('¿Eliminar esta obligación tributaria? Esta acción no se puede deshacer.')) return;
  state.obligaciones = state.obligaciones.filter(o => o.id !== id);
  await saveObligaciones();
  renderApp();
  showToast('Obligación eliminada.');
}

async function toggleTarea(clienteId, mes, idx, checked){
  const c = state.clientes.find(c => c.id === clienteId);
  if(!c) return;
  const tarea = state.tareasPlantilla[idx];
  if(!tarea) return;
  if(!c.tareas) c.tareas = {};
  if(!c.tareas[mes]) c.tareas[mes] = {};
  c.tareas[mes][tarea] = checked;
  await saveClientes();
  // Re-render parcial: solo se actualiza el % anual de esta fila (cliente +
  // tarea), no toda la tabla.
  const anio = mes.slice(0,4);
  const meses = mesesDelAnio(anio);
  const hechos = meses.filter(m => ((c.tareas||{})[m]||{})[tarea]).length;
  const pct = Math.round((hechos/12)*100);
  const pctCell = document.getElementById(`tareaPct_${clienteId}_${idx}`);
  if(pctCell){
    pctCell.textContent = pct + '%';
    pctCell.className = `text-center px-3 py-3 font-semibold ${pct===100?'text-green-600':'text-gray-500'}`;
  }
}

async function agregarTareaPlantilla(){
  const input = document.getElementById('nuevaTareaInput');
  const val = input.value.trim();
  if(!val) return;
  if(state.tareasPlantilla.includes(val)) return showToast('Esa tarea ya existe.');
  state.tareasPlantilla.push(val);
  await saveConfig();
  renderApp();
}

async function quitarTareaPlantilla(index){
  state.tareasPlantilla.splice(index, 1);

  renderApp();
}

/* ---------------- EXPORTAR CSV ---------------- */
function descargarCSV(filename, rows){
  const csv = rows.map(r => r.map(v => {
    const s = (v===null||v===undefined) ? '' : String(v);
    if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportarCarteraCSV(){

  const rows = [['Razon Social','Rut','Clave','Encargado','Sucursal','Regimen Tributario','Representante Legal','Actividad Economica','Codigo Actividad','Valor Mensual UF']];
  list.forEach(c => {

function exportarFacturacionCSV(mes){

  descargarCSV(`facturacion_${mes}.csv`, rows);

// Usuarios que hoy tienen al menos un cliente bajo su propio id (candidatos
// como "origen" para derivar una cartera completa).
function origenesConCartera(){
  const ids = new Set(state.clientes.map(c => c.encargadoId).filter(Boolean));
  return [...state.usuarios].filter(u => ids.has(u.id)).sort((a,b) => a.name.localeCompare(b.name, 'es'));
}

// Deriva de una sola vez toda la cartera de "origen" hacia "destino". Si el
// destino es Asistente (no puede ser "dueño" de cartera en este modelo), se
// le agrega acceso de visualización vía carterasVisibles, sin tocarle el
// encargadoId a los clientes. Para cualquier otro rol, los clientes pasan a
// tener a destino como nuevo encargado.
async function derivarCarteraMasiva(){
  const origenId = document.getElementById('derivarCarteraOrigen').value;
  const destinoId = document.getElementById('derivarCarteraDestino').value;
  if(!origenId || !destinoId){ showToast('Selecciona quién entrega y quién recibe la cartera.'); return; }
  if(origenId === destinoId){ showToast('Elige dos personas distintas.'); return; }

  const origen = state.usuarios.find(u => u.id === origenId);
  const destino = state.usuarios.find(u => u.id === destinoId);
  if(!origen || !destino) return;
  const clientesOrigen = state.clientes.filter(c => c.encargadoId === origenId);
  if(!clientesOrigen.length){ showToast('Ese usuario no tiene clientes en su cartera.'); return; }

  const destinoEsAsistente = esRolAsistente(destino.rol);
  const mensajeConfirm = destinoEsAsistente
    ? `¿Dar a ${destino.name} (Asistente) acceso de visualización a los ${clientesOrigen.length} clientes de ${origen.name}?`
    : `¿Reasignar los ${clientesOrigen.length} clientes de ${origen.name} a ${destino.name}?`;
  if(!confirm(mensajeConfirm)) return;

  if(destinoEsAsistente){
    if(!destino.carterasVisibles) destino.carterasVisibles = [];
    if(!destino.carterasVisibles.includes(origenId)) destino.carterasVisibles.push(origenId);
    await saveUsuarios();
  }else{
    clientesOrigen.forEach(c => { c.encargadoId = destinoId; });
    await saveClientes();
  }

  renderApp();
  showToast(destinoEsAsistente
    ? `${destino.name} ahora ve la cartera de ${origen.name}.`
    : `${clientesOrigen.length} clientes derivados de ${origen.name} a ${destino.name}.`);
}

function generatePassword(){
  const words = ['Rio','Sol','Luna','Vela','Roca','Nube','Faro','Trigo','Cobre','Nieve','Junco','Cerro','Puma','Ancla'];
  const w = words[Math.floor(Math.random()*words.length)];
  const n = Math.floor(Math.random()*90)+10;
  const symbols = '!#$%';
  const s = symbols[Math.floor(Math.random()*symbols.length)];
  return `${w}${n}${s}`;
}

async function changePassword(id, label){
  const nueva = prompt(`Nueva clave para ${label}:`, generatePassword());
  if(!nueva) return;
  const hash = await sha256(nueva.trim());
  await ensureCredsLoaded();
  creds.usuarios[id] = hash;
  await saveCreds();
  alert(`Clave actualizada para ${label}:\n\n${nueva}\n\nCompártela por un canal seguro. No se mostrará de nuevo.`);
}

function generarUsuarioLogin(nombre){
  const primerNombre = nombre.trim().split(' ')[0]
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
  let candidato = primerNombre;
  let n = 1;
  const existentes = new Set(state.usuarios.map(u => (u.usuario||'').toLowerCase()));
  while(existentes.has(candidato)){
    n++;
    candidato = primerNombre + n;
  }
  return candidato;
}

async function addUsuario(){
  const nameInput = document.getElementById('newUserName');
  const emailInput = document.getElementById('newUserEmail');
  const rolSelect = document.getElementById('newUserRol');
  const sucursalSelect = document.getElementById('newUserSucursal');
  const name = nameInput.value.trim();
  const email = emailInput ? emailInput.value.trim() : '';
  const rol = rolSelect.value;
  // Administrador y Contabilidad ven ambas sucursales; el resto queda en la
  // sucursal que se elija en el formulario.
  const sucursal = (esRolAdmin(rol) || esRolContabilidad(rol)) ? 'Ambas' : sucursalSelect.value;
  if(!name) return showToast('Escribe el nombre del usuario.');
  const id = uid('u');
  const pass = generatePassword();
  const hash = await sha256(pass);
  const usuarioLogin = generarUsuarioLogin(name);
  const nuevoUsuario = { id, name, rol, usuario: usuarioLogin, sucursal, email };
  // Un Asistente nuevo arranca sin cartera asignada; el administrador le
  // otorga acceso manualmente desde "Accesos a cartera" más abajo.
  if(esRolAsistente(rol)){
    nuevoUsuario.carterasVisibles = [];
  }
  state.usuarios.push(nuevoUsuario);
  await ensureCredsLoaded();
  creds.usuarios[id] = hash;
  await saveUsuarios();
  await saveCreds();
  nameInput.value = '';
  renderApp();
  alert(`Acceso creado para ${name} (${rol} · ${sucursal}):\n\nUsuario: ${usuarioLogin}\nClave: ${pass}\n\nCompártelos por un canal seguro. No se mostrarán de nuevo.`);
}

async function actualizarPerfilRol(id, rol){
  const u = state.usuarios.find(u => u.id === id);
  if(!u) return;
  // Mismo resguardo que removeUsuario(): no dejar el sistema sin ningún
  // Administrador al cambiarle el rol al último que queda.
  if(esRolAdmin(u.rol) && !esRolAdmin(rol)){
    const quedanAdmins = state.usuarios.filter(x => x.id !== id && esRolAdmin(x.rol)).length;
    if(quedanAdmins === 0){
      alert('No puedes cambiarle el rol a este usuario: quedaría el sistema sin ningún Administrador.');
      renderApp(); // revierte el <select> a su valor real (el clic ya cambió lo que se ve)
      return;
    }
  }
  u.rol = rol;
  // Misma regla que al crear: Administrador y Contabilidad ven ambas
  // sucursales; si se le quita ese rol, vuelve a necesitar una sucursal
  // concreta (queda en Concepción por defecto, editable abajo).
  if(esRolAdmin(rol) || esRolContabilidad(rol)){
    u.sucursal = 'Ambas';
  }else if(u.sucursal === 'Ambas'){
    u.sucursal = 'Concepcion';
  }
  if(esRolAsistente(rol) && !u.carterasVisibles) u.carterasVisibles = [];
  await saveUsuarios();
  renderApp();
  showToast('Rol actualizado.');
}

async function actualizarPerfilSucursal(id, sucursal){
  const u = state.usuarios.find(u => u.id === id);
  if(!u || esRolAdmin(u.rol) || esRolContabilidad(u.rol)) return;
  u.sucursal = sucursal;

async function removeUsuario(id){
  const u = state.usuarios.find(u => u.id === id);
  if(!u) return;
  if(esRolAdmin(u.rol)){
    const quedanAdmins = state.usuarios.filter(x => x.id !== id && esRolAdmin(x.rol)).length;
    if(quedanAdmins === 0){
      alert('No puedes eliminar a este usuario: quedaría el sistema sin ningún Administrador.');
      return;
    }
  }
  if(!confirm(`¿Eliminar a "${u.name}" (${u.rol})? Perderá su acceso y sus clientes quedarán sin asignar. Esta acción no se puede deshacer.`)) return;
  state.usuarios = state.usuarios.filter(u => u.id !== id);
  state.clientes.forEach(c => { if(c.encargadoId === id) c.encargadoId = null; });
  await ensureCredsLoaded();
  delete creds.usuarios[id];
  if(activeFolder === id) activeFolder = 'todos';
  await saveUsuarios();
  await saveClientes();
  await saveCreds();
  renderApp();
  showToast('Usuario y su acceso fueron eliminados. Sus clientes quedaron sin asignar.');
}

// Layout compartido por Encargado, Asistente y TAX. TAX ve todas las
// carteras (verTodo); Encargado/Asistente solo la(s) suya(s). Ninguno de
// estos roles tiene Confección Iva ni Facturación (solo Administrador y,
// para lo demás, Contabilidad — ver contabilidadLayout).
function encargadoLayout(){
  const verTodo = puedeVerTodasLasCarteras(currentUser);
  const misCarteras = carterasDeUsuario(currentUser);
  const baseList = verTodo ? state.clientes : state.clientes.filter(c => misCarteras.includes(c.encargadoId));

  const filtered = q ? baseList.filter(c => (c.name||'').toLowerCase().includes(q) || (c.rut||'').toLowerCase().includes(q)) : baseList;
  const { pageItems, totalPages, page } = paginate(ordenarPorGrupo(filtered), tablePage);

  const content = activeTab === 'inicio' ? inicioContent()
    : activeTab === 'requerimientos' ? requerimientosContent()
    : activeTab === 'obligaciones' ? obligacionesContent(verTodo)
    : activeTab === 'f29' ? estimacionF29Content(verTodo)
    : activeTab === 'tareas' ? tareasContent(verTodo, false)
    : activeTab === 'archivos' ? archivosContent()
    : activeTab === 'trabajos-especiales' ? trabajosEspecialesContent()
    : activeTab === 'cartera-remuneraciones' ? carteraRemuneracionesContent()
    : activeTab === 'trabajos-especiales-remuneraciones' ? trabajosEspecialesContent('remuneraciones')
    : activeTab === 'facturacion-remuneraciones' ? facturacionRemuneracionesContent() : `
      <div class="main-head">
        <div>
          <h2 class="display">${verTodo ? 'Cartera de Clientes' : 'Tu cartera'}</h2>

        <input type="text" id="searchBox" placeholder="Buscar por nombre o RUT…" value="${escapeHtml(searchQuery||'')}" oninput="onSearch(this.value)" style="min-width:240px;">
      </div>
      ${baseList.length===0 ? `<div class="empty-state">
          <div class="display">Aún no tienes clientes asignados</div>
          <div>Pide al administrador que te asigne clientes desde su vista.</div>
        </div>`
        : filtered.length===0 ? `<div class="empty-state">
          <div class="display">Sin resultados</div>
          <div>Prueba con otro nombre o RUT.</div>
        </div>`
        : clientTableReadonly(pageItems, verTodo) + paginationControls(page, totalPages)}
  `;

  return `
    <div class="layout">
      <div class="folders">
        ${sectionNav()}
      </div>
      <div class="main">
        ${content}
      </div>
    </div>
  `;
}

// (Administrador, TAX o Contabilidad — ver puedeVerTodasLasCarteras) que
// llegan a esta tabla de solo lectura (Encargado y Asistente no la reciben).
function clientTableReadonly(list, puedeEditarGrupo){
  const puedeColor = puedeColorearClientes(currentUser);
  const coloresMapa = puedeColor ? cargarColoresClientes() : {};
  return `
    ${puedeColor ? colorBulkBarHtml() : ''}
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        ${puedeColor ? `<th style="width:34px;"><input type="checkbox" onchange="toggleSelectAllClienteColor(this.checked)" title="Seleccionar todos en esta página"></th>` : ''}
        <th>Cliente</th><th>Rut</th><th>Clave</th>${puedeEditarGrupo ? '<th>Grupo</th>' : ''}${puedeColor ? '<th>Color</th>' : ''}
      </tr></thead>
      <tbody>
        ${filasConEncabezadoDeGrupo(list, c => {
          const color = puedeColor ? coloresMapa[c.id] : null;
          const colorTexto = color ? colorTextoParaFondo(color) : null;
          const estiloFila = color ? ` style="background:${color};color:${colorTexto};"` : '';
          return `
          <tr${estiloFila}>
            ${puedeColor ? `<td><input type="checkbox" class="cliente-color-check" data-id="${c.id}" ${clienteColorSelected.has(c.id)?'checked':''} onchange="onClienteColorCheckChange('${c.id}', this.checked)"></td>` : ''}
            <td><div class="client-name client-clickable" onclick="openClientDetail('${c.id}')"${color?` style="color:${colorTexto};text-decoration-color:${colorTexto};"`:''}>${escapeHtml(c.name)}</div>${clientMeta(c, colorTexto)}</td>
            <td class="mono">${escapeHtml(c.rut||'—')}</td>
            <td class="mono">${escapeHtml(c.clave||'—')}</td>
            ${puedeEditarGrupo ? `<td>${grupoSelectHtml(c)}</td>` : ''}
            ${puedeColor ? `<td class="color-swatch-wrap">
              <button class="color-swatch-btn" style="background:${color||'var(--white)'};" title="Elegir color para este cliente" onclick="toggleColorPicker(event,'${c.id}')">${color?'':'🎨'}</button>
              ${colorPickerAbiertoPara===c.id ? colorPickerHtml(c.id, color) : ''}
            </td>` : ''}
          </tr>
        `;
        }, puedeEditarGrupo)}
      </tbody>
    </table>
    </div>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

// Si la persona cierra la pestaña, la cambia de sección/app, o minimiza el
// navegador antes de que se cumpla la ventana de guardado agrupado, se
// dispara de inmediato lo pendiente (mejor esfuerzo: un JSON de ~1MB no cabe
// en las APIs pensadas para "enviar al cerrar" tipo sendBeacon/keepalive, así
// que esto no es 100% garantizado, pero cubre el caso normal de cerrar la
// pestaña con calma o cambiar a otra app).
window.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushPendingSaves();
});
window.addEventListener('pagehide', flushPendingSaves);
window.addEventListener('beforeunload', flushPendingSaves);

/* ---------------- INIT ---------------- */
// Ya no se llama a loadCreds() acá: antes se descargaba el mapa completo de
// hashes de clave a CUALQUIER visitante apenas abría la página, incluso
// antes de loguearse. Ahora el login se verifica en el backend (ver
// verificarLoginBackend()/Code.gs) y creds solo se carga bajo demanda, cuando
// un administrador entra a gestionar usuarios/claves (ensureCredsLoaded()).
(async function init(){
  // Tailwind Play CDN se inyecta acá, en paralelo con loadState() de abajo,
  // en vez de como <script> bloqueante en el <head> (como estaba antes):
  // esa versión detenía el parseo del HTML —y por lo tanto retrasaba el
  // arranque mismo de loadState()— hasta que terminara de descargar. Tailwind
  // sigue aplicando estilos a todo lo que se agregue al DOM después gracias a
  // su propio MutationObserver interno, así que no importa que la carga
  // termine un poco más tarde que el HTML inicial.
  const tw = document.createElement('script');
  tw.src = 'https://cdn.tailwindcss.com';
  tw.onload = () => { tailwind.config = { corePlugins: { preflight: false } }; };
  document.head.appendChild(tw);

  document.getElementById('app').innerHTML = `<div class="gate"><div style="color:#8a8879;">Cargando…</div></div>`;
  await loadState();
  await limpiarArchivosVencidos();
  loadUF(); // no bloquea el render inicial; se muestra apenas esté lista
  loadDolar();
  const autoLogueado = await intentarAutoLogin();
  if(!autoLogueado) renderGate();
})();
</script>
